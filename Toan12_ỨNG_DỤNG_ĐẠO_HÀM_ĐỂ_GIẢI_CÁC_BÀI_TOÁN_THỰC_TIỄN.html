ịnh đầu tư sản xuất một loại sản phẩm với số lượng không quá 150 sản phẩm. Nếu ông $A$ sản xuất được $x$ sản phẩm thì bán và thu về số tiền được tính theo công thức $f(x)=x^3-1565x^2+128500x+30000$ (nghìn đồng), khi đó chi phí sản xuất bình quân cho một sản phẩm được tính theo công thức $C(x)=1000+x+\\frac{25000}{x}$ (nghìn đồng). Ông $A$ cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu về là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"42","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng chi phí sản xuất Hàm số chi phí bình quân cho một sản phẩm là: \\(C(x) = 1000 + x + \\frac{25000}{x}\\) (nghìn đồng).Tổng chi phí để doanh nghiệp sản xuất \\[x\\] sản phẩm là: \\[TC(x)=x\\cdot C(x)=x\\cdot \\left(1000+x+\\frac{25000}{x}\\right)=x^{2}+\\dots \\dots x+25000\\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Hàm số lợi nhuận \\(P(x)\\) nhận được bằng doanh thu trừ đi tổng chi phí sản xuất:\\[P(x)=f(x)=TC(x)\\]\\[\\Rightarrow P(x)=\\left(x^{3}-1565x^{2}+128500x+30000\\right)-\\left(x^{2}+1000x+25000\\right)\\]\\[\\Rightarrow P(x)=x^{3}-\\dots \\dots x^{2}+127500x+5000\\text{\\ (nghìn đồng)}\\]Miền khảo sát của hàm số lợi nhuận là đoạn: \\([1; \\ldots\\ldots]\\). Bước 3: Tìm cực trị bằng phương pháp đạo hàm để tối ưu lợi nhuận Tính đạo hàm của hàm số lợi nhuận \\(P(x)\\):\\[P^{\\prime }(x)=3x^{2}-\\dots \\dots x+127500\\]Giải phương trình đạo hàm \\(P'(x) = 0\\) trên đoạn miền khảo sát:\\[3x^{2}-3132x+127500=0\\Leftrightarrow x^{2}-1044x+42500=0\\Rightarrow \\begin{cases}x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ x=1002\\text{\\ (loại)}\\end{cases}\\]Qua điểm \\[x\\] vừa tìm được, đạo hàm \\(P'(x)\\) đổi dấu từ dương sang âm, nên hàm số đạt cực đại tại điểm này.Vậy ông \\[A\\] cần sản xuất \\(\\ldots\\ldots\\) sản phẩm để lợi nhuận thu về là lớn nhất.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":20,"qType":"3","qText":"Câu 20: (Chuyên Vinh 2025) Đầu năm mới 2025, công ty $A$ vừa kí được một hợp đồng sản xuất và cung cấp linh kiện theo đơn đặt hàng của nhà máy $B$. Theo hợp đồng nhà máy $B$ mua không quá 1500 linh kiện, nếu số lượng đặt hàng là $x$ thì giá bán mỗi linh kiện là $p(x)=40000-0,01x^2$ đồng. Chi phí để công ty sản xuất $x$ linh kiện là $C(x)=10000000+10000x$ đồng. Hỏi công ty $A$ nên sản xuất và cung cấp bao nhiêu linh kiện cho nhà máy $B$ để thu được lợi nhuận lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1000","explanation":"","hint":"Bước 1: Thiết lập hàm số doanh thu \\(R(x)\\) Doanh nghiệp bán được \\[x\\] linh kiện với giá mỗi linh kiện là \\(p(x) = 40000 - 0,01x^2\\) (đồng).Hàm số biểu thị tổng doanh thu khi bán hết số linh kiện đó là: \\[R(x)=x\\times p(x)=x(40000-0,01x^{2})=\\dots \\dots \\dots x-0,01x^{3}\\text{\\ (đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Lợi nhuận thu được là hiệu giữa tổng doanh thu \\(R(x)\\) và chi phí sản xuất \\(C(x)\\): \\[P(x)=R(x)-C(x)\\]\\[P(x)=(40000x-0,01x^{3})-(10000000+10000x)\\]\\[P(x)=-0,01x^{3}+\\dots \\dots \\dots x-10000000\\quad (\\text{với }0\\le x\\le 1500)\\]Bước 3: Tìm số lượng linh kiện \\[x\\] để lợi nhuận thu được lớn nhất Tính đạo hàm của hàm số lợi nhuận: \\[P^{\\prime }(x)=\\dots \\dots \\dots +30000\\]Tìm nghiệm của phương trình đạo hàm \\(P'(x) = 0\\) trên đoạn \\([0; 1500]\\): \\[-0,03x^{2}+30000=0\\Leftrightarrow x^{2}=\\dots \\dots \\dots \\Rightarrow x=\\dots \\dots \\dots \\quad (\\text{thỏa mãn})\\]"},{"originalNum":21,"qType":"3","qText":"Câu 21: (THPT Trần Phú - Vĩnh Phúc 2025) Trong trung tâm thương mại Lotte thành phố Vĩnh Yên, có một nhà hàng bán buffet hải sản. Khi nhà hàng bán với giá 200 ngàn đồng một suất thì mỗi ngày nhà hàng bán được 100 suất. Nhà hàng dự định có đợt giảm giá bán để kích cầu trong dịp cuối năm. Theo khảo sát từ thị trường thì mỗi lần giảm giá 10 ngàn đồng một suất thì nhà hàng bán thêm được 10 suất, hỏi nhà hàng cần bán với giá mới là bao nhiêu ngàn đồng một suất để doanh thu trong một ngày là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"150","explanation":"","hint":"Bước 1: Thiết lập biểu thức giá bán và số lượng suất buffet bán ra Gọi \\[x\\] (ngàn đồng) là giá bán mới của một suất buffet hải sản (\\(0 < x \\le 200\\)).Số tiền giảm giá cho mỗi suất buffet so với mức giá ban đầu là: \\(200 - x\\) (ngàn đồng).Vì cứ giảm giá \\[10\\] ngàn đồng thì nhà hàng bán thêm được \\[10\\] suất, nên số suất buffet tăng thêm là:\\[\\Delta N=10\\cdot \\frac{200-x}{10}=\\dots \\dots -x\\text{\\ (suất)}\\]Tổng số suất buffet nhà hàng bán được trong một ngày ở mức giá mới là: \\[N(x)=100+(200-x)=\\dots \\dots -x\\text{\\ (suất)}\\]Bước 2: Thiết lập hàm số tổng doanh thu trong một ngày \\(R(x)\\) Doanh thu trong ngày của nhà hàng được tính bằng tích của giá bán và số lượng suất bán ra: \\[R(x)=x\\cdot N(x)=x\\cdot (300-x)=-x^{2}+\\dots \\dots \\cdot x\\text{\\ (ngàn đồng)}\\]Bước 3: Tìm giá bán \\[x\\] để doanh thu đạt giá trị lớn nhất Hàm doanh thu \\(R(x) = -x^2 + 300x\\) là một hàm số bậc hai với hệ số \\(a = -1 < 0\\), biểu diễn một parabol quay bề lõm xuống dưới.Do đó, hàm số đạt giá trị lớn nhất tại hoành độ đỉnh của parabol:\\[x=-\\frac{b}{2a}=-\\frac{300}{2\\cdot (-1)}=\\dots \\dots \\]Mức giá này hoàn toàn thỏa mãn điều kiện kinh doanh thực tế (\\(0 < x \\le 200\\)). \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":22,"qType":"3","qText":"Câu 22: (Sở Vĩnh Phúc 2025) Một chủ nhà hàng kinh doanh phần ăn uống đồng giá có chiến lược kinh doanh như sau: Phí cố định được ước tính trong một năm là 55 triệu đồng. Chi phí một phần ăn ước tính khoảng 22 nghìn đồng. Giá niêm yết trên thực đơn là 30 nghìn đồng. Giả định rằng tất cả các phần ăn chế biến sẵn đều được bán hết và kí hiệu $x$ là số phần ăn trong một năm, giả sử $x$ là số nguyên thuộc $[5000;25000]$. Mục tiêu của chủ nhà hàng là tạo ra lợi nhuận ít nhất là 135 triệu đồng mỗi năm. Biết rằng nhà hàng mở cửa 300 ngày một năm, hỏi trung bình mỗi ngày nhà hàng phải phục vụ ít nhất bao nhiêu phần ăn để đạt mục tiêu trên?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"80","explanation":"","hint":"Bước 1: Lập bất phương trình biểu diễn lợi nhuận năm của nhà hàng Gọi \\[x\\] là số phần ăn bán ra trong một năm (\\(5000 \\le x \\le 25000, x \\in \\mathbb{N}\\)).Đổi đơn vị chi phí cố định: \\(55 \\text{ triệu đồng} = 55000 \\text{ nghìn đồng}\\).Tổng chi phí trong một năm của nhà hàng gồm chi phí cố định và chi phí biến đổi cho \\[x\\] phần ăn:\\[C(x)=55000+\\dots \\dots \\cdot x\\text{\\ (nghìn đồng)}\\]Tổng doanh thu thu được khi bán hết \\[x\\] phần ăn là:\\[R(x)=\\dots \\dots \\cdot x\\text{\\ (nghìn đồng)}\\]Hàm số lợi nhuận thu được trong một năm là: \\[L(x)=R(x)-C(x)=30x-(55000+22x)=\\dots \\dots \\cdot x-55000\\text{\\ (nghìn đồng)}\\]Bước 2: Tìm số phần ăn tối thiểu nhà hàng phải phục vụ trong một năm Đổi mục tiêu lợi nhuận: \\(135 \\text{ triệu đồng} = 135000 \\text{ nghìn đồng}\\).Để đạt mục tiêu lợi nhuận ít nhất \\(135 \\text{ triệu đồng/năm}\\), ta có bất phương trình: \\[L(x)\\ge 135000\\implies 8x-55000\\ge 135000\\implies 8x\\ge \\dots \\dots \\]\\[\\implies x\\ge \\dots \\dots \\text{\\ (phần ăn/năm)}\\]Bước 3: Tính số phần ăn trung bình tối thiểu mỗi ngày Vì nhà hàng mở cửa \\[300\\] ngày trong một năm, số phần ăn trung bình mỗi ngày nhà hàng cần phục vụ ít nhất là: \\[\\frac{\\dots \\dots }{300}=\\dots \\dots \\text{\\ (phần ăn/ngày)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":23,"qType":"3","qText":"Câu 23: (Cụm trường Hưng Yên 2025) Một doanh nghiệp dự định sản xuất không quá 400 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm ($1\\le x\\le 400$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=x^3-1999x^2+1001000x+250000$ (đồng). Trong đó chi phí vận hành máy móc cho mỗi sản phẩm là $G(x)=\\frac{200000x}{3x+2}$ (đồng). Tổng chi phí mua nguyên vật liệu là $H(x)=2x^3+100000x-50000$ (đồng), nhưng do doanh nghiệp đó mua nguyên vật liệu với số lượng lớn nên được giảm 2% cho 150 sản phẩm đầu tiên doanh nghiệp sản xuất và giảm 3% cho các sản phẩm tiếp theo. Doanh nghiệp cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"264","explanation":"","hint":"Bước 1: Xác định hàm số tổng doanh thu và hàm số tổng chi phí vận hành Tổng doanh thu khi bán hết \\[x\\] sản phẩm là:\\[F(x)=x^{3}-1999x^{2}+1001000x+250000\\text{\\ (đồng)}\\]Hàm số chi phí vận hành máy móc cho mỗi sản phẩm là \\(G(x) = \\frac{200000x}{3x+2}\\). Suy ra tổng chi phí vận hành máy móc cho \\[x\\] sản phẩm là: \\[TC_{vh}(x)=x\\cdot G(x)=\\frac{\\dots \\dots \\dots \\dots }{3x+2}\\text{\\ (đồng)}\\]Bước 2: Thiết lập hàm số chi phí mua nguyên vật liệu sau giảm giá Nhận thấy điểm mốc thay đổi mức chiết khấu là \\(x = 150\\). Xét trường hợp doanh nghiệp sản xuất số lượng sản phẩm lớn hơn 150 \\((x > 150)\\).Khi đó, 150 sản phẩm đầu tiên được giảm \\(2\\%\\) và các sản phẩm tiếp theo được giảm \\(3\\%\\). Hàm số tổng chi phí mua nguyên vật liệu thực tế sau giảm giá là: \\[TC_{nvl}(x)=0,98\\cdot H(150)+\\dots \\dots \\cdot [H(x)-H(150)]=0,97\\cdot H(x)+\\dots \\dots \\cdot H(150)\\]\\[\\Rightarrow TC_{nvl}(x)=0,97\\cdot \\left(2x^{3}+100000x-50000\\right)+0,01\\cdot H(150)\\]Bước 3: Xây dựng hàm số lợi nhuận và tìm điểm tối ưu Hàm số tổng lợi nhuận \\(P(x)\\) của doanh nghiệp thu được là:\\[P(x)=F(x)-TC_{vh}(x)-TC_{nvl}(x)\\]Tiến hành tính đạo hàm \\(P'(x)\\) và giải phương trình đạo hàm \\(P'(x) = 0\\) trên khoảng \\((150; 400]\\).Qua các bước lập bảng biến thiên và khảo sát hàm số, ta xác định được hàm số lợi nhuận đạt giá trị lớn nhất tại điểm:\\[x=\\dots \\dots \\text{\\ (sản phẩm)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":32,"qType":"3","qText":"Câu 32. (Chuyên Lam Sơn - Thanh Hóa 2025) Mỗi tuần, một cửa hàng bán điện thoại di động trung bình bán được 1000 điện thoại A với giá 14 triệu đồng một cái. Biết rằng, nếu cứ giảm giá bán 500 nghìn đồng/1 cái, số lượng điện thoại A bán ra sẽ tăng thêm khoảng 100 cái mỗi tuần. Biết rằng nếu bán $x$ cái điện thoại A thì giá mỗi cái là $p(x)$ (triệu đồng) và hàm chi phí hàng tuần $C(x)=12000-3x$ (triệu đồng). Để lợi nhuận là lớn nhất, cửa hàng nên bán mỗi cái điện thoại A với giá bao nhiêu (triệu đồng)?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"8","explanation":"","hint":"Bước 1: Thiết lập hàm cầu (giá bán) \\(p(x)\\) theo số lượng bán ra \\[x\\] Theo bài ra, ban đầu khi giá bán là \\[14\\] triệu đồng thì cửa hàng bán được \\[1000\\] chiếc. Cứ giảm giá \\(0,5\\) triệu đồng (\\[500\\] nghìn đồng) thì số lượng bán ra tăng thêm \\[100\\] chiếc.Mối quan hệ tuyến tính giữa số lượng bán ra \\[x\\] và giá bán \\[p\\] được biểu diễn qua phương trình: \\[x-1000=\\frac{100}{-0,5}(p-14)\\Rightarrow x-1000=-200(p-14)\\]\\[\\Rightarrow x=\\dots \\dots \\dots -200p\\Rightarrow p(x)=19-\\dots \\dots \\dots x\\]Bước 2: Xác định hàm doanh thu \\(R(x)\\) và hàm lợi nhuận \\(P(x)\\) Hàm số biểu thị tổng doanh thu hàng tuần thu được là:\\[R(x)=x\\cdot p(x)=x(19-0,005x)=19x-\\dots \\dots \\dots x^{2}\\]Hàm số biểu thị lợi nhuận thu được hàng tuần là hiệu giữa doanh thu \\(R(x)\\) và chi phí hàng tuần \\(C(x) = 12000 - 3x\\): \\[P(x)=R(x)-C(x)=(19x-0,005x^{2})-(12000-3x)\\]\\[P(x)=-0,005x^{2}+\\dots \\dots \\dots x-12000\\]Bước 3: Tìm số lượng điện thoại \\[x\\] để lợi nhuận lớn nhất Hàm lợi nhuận \\(P(x)\\) thu được là một hàm số bậc hai có đồ thị là một parabol quay bề lõm xuống dưới. Hàm số đạt giá trị lớn nhất tại đỉnh parabol: \\[x=-\\frac{b}{2a}=-\\frac{22}{2\\times (-0,005)}=\\dots \\dots \\dots \\text{\\ (chiếc)}\\]Bước 4: Tính giá bán tối ưu của mỗi chiếc điện thoại A Với số lượng máy đạt tối ưu \\(x = 2200\\), giá bán tương ứng của mỗi chiếc điện thoại là: \\[p(2200)=19-0,005\\times \\dots \\dots \\dots =\\dots \\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 8 "},{"originalNum":33,"qType":"3","qText":"Câu 33. (Sở Bắc Ninh 2025) Tại một nhà máy, khi sản xuất và bán ra $x$ sản phẩm A ($0\\le x\\le 250$) trong một tháng thì tổng chi phí mà nhà máy phải trả là $C(x)=0,00024x^3-0,03x^2+5x+30$ (triệu đồng) và doanh thu tương ứng là $D(x)=-0,01x^2+16x-25$ (triệu đồng). Hỏi trong một tháng, lợi nhuận lớn nhất mà nhà máy đó có thể thu nhờ vào sản xuất và bán sản phẩm A bằng bao nhiêu triệu đồng? (Làm tròn kết quả đến hàng đơn vị).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"34","explanation":"","hint":"Bước 1: Thiết lập hàm số lợi nhuận \\(L(x)\\) Lợi nhuận thu được khi sản xuất và bán ra \\[x\\] sản phẩm (\\(0 \\le x \\le 250\\)) là hiệu giữa doanh thu và tổng chi phí: \\[L(x)=D(x)-C(x)=\\left(-0,01x^{2}+16x-25\\right)-\\left(0,00024x^{3}-0,03x^{2}+5x+30\\right)\\]\\[L(x)=-0,00024x^{3}+\\dots \\dots \\cdot x^{2}+11x-\\dots \\dots \\text{\\ (triệu đồng)}\\]Bước 2: Tính đạo hàm \\(L'(x)\\) và tìm điểm cực trị Đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=-0,00072x^{2}+\\dots \\dots \\cdot x+11\\]Giải phương trình \\(L'(x) = 0\\) để tìm điểm cực trị trên đoạn \\([0; 250]\\): \\[-0,00072x^{2}+0,04x+11=0\\Leftrightarrow \\left[\\begin{aligned}&x\\approx \\dots \\dots \\text{\\ (thỏa mãn)}\\\\ &x\\approx -98,91\\text{\\ (loại)}\\end{aligned}\\right.\\]Bước 3: Xác định giá trị lợi nhuận lớn nhất và làm tròn Tính giá trị của hàm số \\(L(x)\\) tại các điểm đầu mút và điểm cực đại:\\[L(0)=-55;\\quad L(250)=195;\\quad L(\\dots \\dots )\\approx \\dots \\dots \\text{\\ (triệu đồng)}\\]So sánh các giá trị trên, ta thấy mức lợi nhuận lớn nhất thu được khi làm tròn đến hàng đơn vị là: \\(\\ldots\\ldots\\) triệu đồng. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":34,"qType":"3","qText":"Câu 34. (THPT Thọ Xuân 5 - Thanh Hóa 2026) Một con cá bơi ngược dòng để vượt khoảng cách là $100km$. Vận tốc dòng nước là $5km/h$. Nếu vận tốc bơi của cá khi nước đứng yên là $v(km/h)$, ($v>5$) thì năng lượng tiêu hao của cá trong $t$ giờ được cho bởi công thức $E(v)=c.v^3.t$, trong đó $c$ là hằng số dương, $E$ được tính bằng Jun. Biết rằng vận tốc bơi của cá khi nước đứng yên thuộc khoảng $(a;b)$ thì năng lượng tiêu hao của cá giảm. Hãy tính giá trị lớn nhất của $b-a$ (kết quả làm tròn tới hàng phần mười).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"20","explanation":"","hint":"Bước 1: Biểu diễn thời gian cá bơi theo vận tốc \\[v\\] Vận tốc bơi của cá khi nước đứng yên là \\(v \\text{ (km/h)}\\) với \\(v > 5\\).Vì cá bơi ngược dòng nước có vận tốc \\(5 \\text{ (km/h)}\\), vận tốc thực tế của cá đối với bờ là:\\[v_{tt}=v-\\dots \\dots \\text{\\ (km/h)}\\]Thời gian để cá bơi hết quãng đường \\(100 \\text{ km}\\) là: \\[t=\\frac{100}{\\dots \\dots }\\text{\\ (giờ)}\\]Bước 2: Thiết lập hàm số năng lượng tiêu hao \\(E(v)\\) và tính đạo hàm Thay \\[t\\] vào công thức đề bài cho, ta được hàm số năng lượng tiêu hao theo \\[v\\]:\\[E(v)=c\\cdot v^{3}\\cdot \\frac{100}{v-5}=100c\\cdot \\frac{v^{3}}{v-5}\\]Áp dụng quy tắc đạo hàm của thương \\[\\left(\\frac{u}{v}\\right)^{\\prime }\\], ta tính \\(E'(v)\\): \\[E^{\\prime }(v)=100c\\cdot \\frac{3v^{2}(v-5)-v^{3}}{(v-5)^{2}}=100c\\cdot \\frac{\\dots \\dots \\cdot v^{3}-15v^{2}}{(v-5)^{2}}=100c\\cdot \\frac{v^{2}(2v-\\dots \\dots )}{(v-5)^{2}}\\]Bước 3: Xác định khoảng giảm của năng lượng và tính giá trị yêu cầu Để năng lượng tiêu hao của cá giảm thì đạo hàm \\(E'(v) < 0\\). Với \\(v > 5\\), ta có:\\[2v-15<0\\implies v<\\dots \\dots \\]Khoảng vận tốc tối đa để năng lượng giảm là \\((5; 7,5)\\). Do đó: \\(a = 5\\) và \\(b = \\dots\\dots\\)Giá trị lớn nhất của biểu thức đề bài hỏi (\\(b - a\\)) là: \\[7,5-5=\\dots \\dots \\]\\[\\Rightarrow \\] Chọn đáp án: 2,5 (hoặc 20 theo mã đề gốc lỗi hệ thống"},{"originalNum":35,"qType":"3","qText":"Câu 35. (THPT Yên Định 1 - Thanh Hóa 2026) Một hộ gia đình chuyên làm thịt trâu sấy khô để bán, mỗi ngày hộ đó sản suất được $x$ kg thịt, ($1\\le x\\le 20$). Tổng chi phí sản xuất $x$ kg thịt trâu khô, tính bằng nghìn đồng, cho bởi hàm chi phí: $C(x)=x^3-9x^2+345x+450$. Giả sử hộ gia đình này bán hết số thịt làm ra mỗi ngày với giá 750 nghìn đồng/kg. Gọi $L(x)$ là lợi nhuận thu được khi bán $x$ kg thịt trâu sấy khô. Hỏi lợi nhuận tối đa mà hộ gia đình này thu được trong một ngày (kết quả tính theo đơn vị nghìn đồng)?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"350","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng doanh thu \\(R(x)\\) và hàm số lợi nhuận \\(L(x)\\) Vì mỗi kg thịt trâu sấy khô được bán với giá \\(750\\text{ nghìn đồng}\\) nên tổng doanh thu khi bán hết \\(x\\text{ kg}\\) thịt là:\\[R(x)=\\dots \\dots \\dots \\dots \\text{\\ (nghìn đồng)}\\]Hàm số lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi chi phí sản xuất: \\[L(x)=R(x)-C(x)=750x-\\left(x^{3}-9x^{2}+345x+450\\right)\\]\\[\\Rightarrow L(x)=-x^{3}+\\dots \\dots x^{2}+405x-450\\quad (\\text{với }1\\le x\\le 20)\\]Bước 2: Tìm cực trị bằng phương pháp đạo hàm Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=-3x^{2}+\\dots \\dots x+405\\]Giải phương trình đạo hàm \\(L'(x) = 0\\): \\[-3x^{2}+18x+405=0\\Rightarrow \\begin{cases}x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ x=-9\\text{\\ (loại)}\\end{cases}\\]Bước 3: Tính mức lợi nhuận tối đa đạt được Khảo sát hàm số trên đoạn \\([1; 20]\\) hoặc tính giá trị của \\(L(x)\\) tại các điểm biên và điểm cực trị:\\(L(1) = -5\\) (nghìn đồng)\\(L(20) = 3750\\) (nghìn đồng)\\(L(\\ldots\\ldots) = \\ldots\\ldots \\text{ (nghìn đồng)}\\) So sánh các giá trị trên, ta thấy hàm số \\(L(x)\\) đạt giá trị lớn nhất trên đoạn \\([1; 20]\\) tại điểm cực đại vừa tìm được. Vậy mức lợi nhuận tối đa mà hộ gia đình thu được trong một ngày là \\(\\ldots\\ldots\\) nghìn đồng.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":36,"qType":"3","qText":"Câu 36. (THPT Thanh Đa - HCM 2026) Một nhà máy sản xuất $x$ sản phẩm trong mỗi tháng. Chi phí sản xuất $x$ sản phẩm được cho bởi hàm chi phí $C(x)=1600+500x-1,6x^2+0,004x^3$ nghìn đồng. Biết giá bán của mỗi sản phẩm là một hàm số phụ thuộc vào số lượng sản phẩm $x$ và được cho bởi công thức $p(x)=1700-7x$ nghìn đồng. Hỏi mỗi tháng nhà máy nên sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất, biết rằng kết quả khảo sát thị trường cho thấy sản phẩm sản xuất ra sẽ được tiêu thụ hết?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"50","explanation":"","hint":"Bước 1: Thiết lập hàm số doanh thu \\(R(x)\\) Doanh nghiệp sản xuất và bán hết \\[x\\] sản phẩm với giá bán mỗi sản phẩm phụ thuộc vào số lượng bán ra là \\(p(x) = 1700 - 7x\\) (nghìn đồng).Hàm số biểu thị tổng doanh thu hàng tháng thu được là: \\[R(x)=x\\times p(x)=x(1700-7x)=\\dots \\dots \\dots x-7x^{2}\\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Lợi nhuận hàng tháng thu được là hiệu giữa tổng doanh thu \\(R(x)\\) và chi phí sản xuất \\(C(x)\\): \\[P(x)=R(x)-C(x)\\]\\[P(x)=(1700x-7x^{2})-(1600+500x-1,6x^{2}+0,004x^{3})\\]\\[P(x)=-0,004x^{3}-\\dots \\dots \\dots x^{2}+\\dots \\dots \\dots x-1600\\]Bước 3: Tìm số lượng sản phẩm \\[x\\] để lợi nhuận lớn nhất Tính đạo hàm của hàm số lợi nhuận:\\[P^{\\prime }(x)=-0,012x^{2}-\\dots \\dots \\dots x+1200\\]Giải phương trình đạo hàm \\(P'(x) = 0\\):\\[-0,012x^{2}-10,8x+1200=0\\Leftrightarrow x^{2}+900x-100000=0\\]\\[\\Leftrightarrow \\left[\\begin{aligned}&x=100\\quad (\\text{thỏa mãn }x>0)\\\\ &x=-1000\\quad (\\text{loại})\\end{aligned}\\right.\\]Lập bảng biến thiên hoặc đánh giá dấu của \\(P'(x)\\), ta thấy hàm số \\(P(x)\\) đạt giá trị lớn nhất tại điểm cực đại \\(x = \\ldots\\ldots\\ldots\\) "},{"originalNum":37,"qType":"3","qText":"Câu 37. (THPT Kim Liên - Hà Nội 2026) Doanh nghiệp $A$ độc quyền sản xuất một loại máy tính bảng. Gọi $x$ là số lượng sản phẩm bán ra, tính bằng nghìn sản phẩm, $0\\le x\\le 50$, $x∈ N$. Giá bán mỗi sản phẩm phụ thuộc số lượng bán ra theo công thức $p(x)=497-2x$, nghìn đồng/sản phẩm. Tổng chi phí để sản xuất $x$ nghìn sản phẩm là $C(x)=1000+300x-10x^2+\\frac{1}{3}x^3$, triệu đồng. Doanh nghiệp cần sản xuất bao nhiêu nghìn sản phẩm máy tính bảng để thu được lợi nhuận lớn nhất, biết chi phí đánh thuế mỗi sản phẩm bán ra là 36 nghìn đồng?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"100","explanation":"","hint":"Bước 1: Thiết lập hàm doanh thu \\(R(x)\\) và hàm chi phí thuế \\(T(x)\\) Gọi \\[x\\] là số lượng sản phẩm máy tính bảng bán ra (tính bằng nghìn sản phẩm), điều kiện: \\(0 \\leq x \\leq 50\\).Doanh thu thu được khi bán hết \\[x\\] nghìn sản phẩm là:\\[R(x)=x\\cdot p(x)=x\\cdot (497-2x)=497x-\\dots \\dots \\cdot x^{2}\\text{\\ (triệu đồng)}\\]Thuế mỗi sản phẩm bán ra là \\[36\\] nghìn đồng, suy ra tổng chi phí đánh thuế cho \\[x\\] nghìn sản phẩm là: \\[T(x)=36\\cdot x\\text{\\ (triệu đồng)}\\]Bước 2: Thiết lập hàm số lợi nhuận \\(L(x)\\) Lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi tổng chi phí sản xuất và chi phí thuế: \\[L(x)=R(x)-C(x)-T(x)\\]\\[L(x)=\\left(497x-2x^{2}\\right)-\\left(1000+300x-10x^{2}+\\frac{1}{3}x^{3}\\right)-36x\\]\\[L(x)=-\\frac{1}{3}x^{3}+\\dots \\dots \\cdot x^{2}+161x-1000\\text{\\ (triệu đồng)}\\]Bước 3: Khảo sát hàm số tìm lượng sản phẩm để lợi nhuận lớn nhất Đạo hàm của hàm lợi nhuận:\\[L^{\\prime }(x)=-x^{2}+\\dots \\dots \\cdot x+161\\]Giải phương trình \\(L'(x) = 0\\) trên đoạn \\([0; 50]\\):\\[-x^{2}+16x+161=0\\Leftrightarrow \\left[\\begin{aligned}&x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ &x=-7\\text{\\ (loại)}\\end{aligned}\\right.\\]Lập bảng biến thiên trên đoạn \\([0; 50]\\), ta thấy hàm số đạt giá trị lớn nhất tại điểm cực đại vừa tìm được. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":38,"qType":"3","qText":"Câu 38. (THPT Marie Curie - Hà Nội 2026) Một doanh nghiệp kinh doanh sản xuất một loại sản phẩm. Hàm tổng chi phí khi doanh nghiệp này sản xuất và bán $x$ sản phẩm là $y=f(x)=\\frac{ax^2+bx+c}{x+e}$, đơn vị: USD, $x∈ N$. Biết rằng đồ thị hàm số $f(x)$ có tâm đối xứng là $I\\left(-100;-\\frac{2000}{3}\\right)$ và có đường tiệm cận xiên đi qua điểm $B(300;2000)$. Theo khảo sát, tổng doanh thu của doanh nghiệp này được mô tả bởi hàm số $R(x)=0,1x^2+20x$, đơn vị: USD, và lợi nhuận thu về khi bán 200 sản phẩm bằng 5250 USD. Hỏi doanh nghiệp sản xuất bao nhiêu sản phẩm thì tổng chi phí là thấp nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"367","explanation":"","hint":"Bước 1: Xác định các hệ số của hàm số tổng chi phí từ yếu tố tiệm cận Hàm số tổng chi phí có dạng:\\[f(x)=\\frac{ax^{2}+bx+c}{x+e}=ax+(b-ae)+\\frac{c-be+ae^{2}}{x+e}\\]Đồ thị hàm số có đường tiệm cận đứng là \\(x = -e\\) và đường tiệm cận xiên là \\(y = ax + b - ae\\).Vì tâm đối xứng \\(I\\left(-100; -\\frac{2000}{3}\\right)\\) là giao điểm của hai đường tiệm cận, ta có:\\[-e=-100\\implies e=\\dots \\dots \\]Tọa độ tâm đối xứng \\[I\\] và điểm \\(B(300; 2000)\\) đều thuộc đường tiệm cận xiên, thay vào phương trình ta tìm được các hệ số: \\[a=\\frac{20}{3};\\quad b=\\frac{2000}{3}\\]Bước 2: Sử dụng dữ kiện lợi nhuận để tìm hệ số \\[c\\] Tại mức sản lượng \\(x = 200\\), tổng doanh thu của doanh nghiệp là:\\[R(200)=0,1\\cdot 200^{2}+20\\cdot 200=\\dots \\dots \\text{\\ (USD)}\\]Do lợi nhuận thu về bằng doanh thu trừ đi chi phí (\\(P = R - f\\)), chi phí khi sản xuất 200 sản phẩm là:\\[f(200)=R(200)-5250=8000-5250=\\dots \\dots \\text{\\ (USD)}\\]Thay \\(x = 200\\) cùng các hệ số \\(a, b, e\\) vào công thức \\(f(x)\\), ta tìm được hệ số tự do:\\[c=\\dots \\dots \\]Khi đó, hàm tổng chi phí rút gọn thành: \\(f(x) = \\frac{20}{3}x + \\frac{410000}{x+100}\\) Bước 3: Khảo sát hàm chi phí để tìm mức sản lượng tối ưu Tính đạo hàm của hàm tổng chi phí \\(f(x)\\):\\[f^{\\prime }(x)=\\frac{20}{3}-\\frac{410000}{(x+100)^{2}}\\]Cho \\(f'(x) = 0 \\implies (x+100)^2 = 61500 \\implies x = \\sqrt{61500} - 100 \\approx 148\\)."},{"originalNum":39,"qType":"3","qText":"Câu 39: (Sở Đồng Tháp 2026) Một doanh nghiệp dự định sản xuất không quá 500 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm, $x∈\\mathbb{Z}$, $1\\le x\\le 100$, thì doanh thu nhận được khi bán hết số sản phẩm đó là $R(x)=x^3-396x^2+80000\\ln x+38800x+500$ nghìn đồng. Trong khi chi phí sản xuất bình quân cho một sản phẩm là $G(x)=x+400+\\frac{2500}{x}$ nghìn đồng. Giả sử sản phẩm làm ra luôn được bán hết, lợi nhuận lớn nhất khi doanh nghiệp sản xuất bao nhiêu sản phẩm?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"5","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng chi phí sản xuất \\(C(x)\\) Hàm số chi phí sản xuất bình quân cho một sản phẩm là: \\(G(x) = x + 400 + \\frac{2500}{x}\\) (nghìn đồng).Tổng chi phí để doanh nghiệp sản xuất \\[x\\] sản phẩm là: \\[C(x)=x\\cdot G(x)=x\\cdot \\left(x+400+\\frac{2500}{x}\\right)=x^{2}+\\dots \\dots x+2500\\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(L(x)\\) Hàm số lợi nhuận \\(L(x)\\) nhận được bằng doanh thu trừ đi tổng chi phí sản xuất:\\[L(x)=R(x)-C(x)\\]\\[\\Rightarrow L(x)=\\left(x^{3}-396x^{2}+80000\\ln x+38800x+500\\right)-\\left(x^{2}+400x+2500\\right)\\]\\[\\Rightarrow L(x)=x^{3}-\\dots \\dots x^{2}+38400x+80000\\ln x-2000\\text{\\ (nghìn đồng)}\\]Miền khảo sát của hàm số lợi nhuận là đoạn: \\([1; 100]\\). Bước 3: Tìm số lượng sản phẩm bằng phương pháp đạo hàm Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=3x^{2}-\\dots \\dots x+38400+\\frac{80000}{x}\\]Quy đồng mẫu số biểu thức đạo hàm ta thu được phương trình bậc ba ở tử số:\\[3x^{3}-794x^{2}+38400x+80000=0\\]Khảo sát dấu của \\(L'(x)\\) hoặc sử dụng máy tính bỏ túi giải phương trình thu được nghiệm xấp xỉ \\(x \\approx 66,7\\). Lập bảng biến thiên trên đoạn \\([1; 100]\\), ta thấy hàm số đạt giá trị lớn nhất tại điểm nguyên gần nhất là:\\[x=\\dots \\dots \\text{\\ (sản phẩm)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":40,"qType":"3","qText":"Câu 40: (THPT Lê Thánh Tông HCM 2026) Một công ty công nghệ cung cấp gói lưu trữ dữ liệu doanh nghiệp với giá niêm yết 200.000 đồng/tháng và đang có 400 khách hàng. Phòng kinh doanh xác định được quy luật: Cứ giảm giá 10.000 đồng thì sẽ có thêm 50 khách hàng mới. Tuy nhiên, do hiện tượng quá tải băng thông, chi phí vận hành $C(n)$ (nghìn đồng) không cố định mà biến thiên theo hàm bậc hai của số lượng khách hàng $n$, được xác định bởi công thức: $C(n)=28n+0,01n^2+15.000$. Công ty cần chốt giá bán bao nhiêu nghìn đồng để lợi nhuận đạt mức tối đa?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"160","explanation":"","hint":"Bước 1: Thiết lập mối quan hệ giữa giá bán \\[p\\] và số lượng khách hàng \\[n\\] Gọi \\[x\\] (nghìn đồng) là số tiền giảm giá của gói lưu trữ (\\(x \\ge 0\\)). Khi đó, giá bán mới của gói lưu trữ là:\\[p=200-x\\text{\\ (nghìn đồng)}\\]Theo quy luật quy đổi, cứ giảm \\[10\\] nghìn đồng thì tăng thêm \\[50\\] khách hàng (tức là giảm \\[1\\] nghìn đồng thì tăng thêm \\(\\ldots\\ldots\\ldots\\) khách hàng). Số lượng khách hàng \\[n\\] tương ứng với mức giảm giá \\[x\\] là:\\[n=400+\\dots \\dots \\dots x\\Rightarrow x=\\frac{n-400}{5}=0,2n-80\\]Biểu diễn giá bán \\[p\\] theo số lượng khách hàng \\[n\\], ta được hàm số cầu: \\[p=200-(0,2n-80)=\\dots \\dots \\dots -0,2n\\text{\\ (nghìn đồng)}\\]Bước 2: Xây dựng hàm số doanh thu \\(R(n)\\) và hàm số lợi nhuận \\(P(n)\\) Tổng doanh thu thu được từ \\[n\\] khách hàng là:\\[R(n)=n\\times p=n(\\dots \\dots \\dots -0,2n)=-0,2n^{2}+\\dots \\dots \\dots n\\text{\\ (nghìn đồng)}\\]Hàm số biểu thị lợi nhuận thu được là hiệu giữa doanh thu \\(R(n)\\) và chi phí vận hành \\(C(n) = 28n + 0,01n^2 + 15000\\): \\[P(n)=R(n)-C(n)=(-0,2n^{2}+280n)-(0,01n^{2}+28n+15000)\\]\\[P(n)=-\\dots \\dots \\dots n^{2}+\\dots \\dots \\dots n-15000\\]Bước 3: Tìm số lượng khách hàng \\[n\\] để lợi nhuận đạt mức tối đa Hàm số lợi nhuận \\(P(n)\\) là một hàm số bậc hai có đồ thị là một parabol quay bề lõm xuống dưới. Hàm số đạt giá trị lớn nhất tại đỉnh parabol: \\[n=-\\frac{b}{2a}=-\\frac{252}{2\\times (-0,21)}=\\dots \\dots \\dots \\text{\\ (khách hàng)}\\]Bước 4: Chốt giá bán tối ưu cho sản phẩm Với số lượng khách hàng tối ưu thu được là \\(n = 600\\), công ty cần chốt giá bán của gói lưu trữ dữ liệu doanh nghiệp là: \\[p=280-0,2\\times \\dots \\dots \\dots =\\dots \\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 160"},{"originalNum":41,"qType":"3","qText":"Câu 41: (Sở Bắc Ninh 2026) Giả sử nhu cầu tiêu thụ một loại sản phẩm mới của doanh nghiệp $A$ được mô hình hóa bởi hàm số $p=\\frac{1500}{\\sqrt{x}}$, trong đó $p$ là đơn giá (tính bằng nghìn đồng) và $x$ là số lượng đơn vị sản phẩm. Chi phí (tính bằng nghìn đồng) để sản xuất $x$ đơn vị sản phẩm được cho bởi hàm số $C=12x+500$. Tìm mức giá (tính bằng nghìn đồng) để mang lại lợi nhuận tối đa.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"24","explanation":"","hint":"Bước 1: Thiết lập hàm doanh thu \\(R(x)\\) và hàm lợi nhuận \\(L(x)\\) Doanh thu \\(R(x)\\) thu được khi bán ra \\[x\\] đơn vị sản phẩm (\\(x > 0\\)) là:\\[R(x)=x\\cdot p=x\\cdot \\frac{1500}{\\sqrt{x}}=\\dots \\dots \\cdot \\sqrt{x}\\text{\\ (nghìn đồng)}\\]Hàm chi phí đã cho là: \\(C(x) = 12x + 500 \\text{ (nghìn đồng)}\\).Lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=R(x)-C(x)=1500\\sqrt{x}-\\dots \\dots \\cdot x-500\\text{\\ (nghìn đồng)}\\]Bước 2: Tìm số lượng đơn vị sản phẩm \\[x\\] để lợi nhuận tối đa Đạo hàm của hàm lợi nhuận theo biến \\[x\\]:\\[L^{\\prime }(x)=\\frac{1500}{2\\sqrt{x}}-12=\\frac{\\dots \\dots }{\\sqrt{x}}-12\\]Giải phương trình \\(L'(x) = 0\\) để tìm điểm cực trị:\\[\\frac{750}{\\sqrt{x}}=12\\Leftrightarrow \\sqrt{x}=\\frac{750}{12}=\\dots \\dots \\Rightarrow x=\\left(\\frac{125}{2}\\right)^{2}=3906,25\\]Lập bảng biến thiên với \\(x > 0\\), ta thấy hàm số đạt giá trị lợi nhuận lớn nhất tại \\(x = 3906{,}25\\). Bước 3: Xác định mức giá \\[p\\] tối ưu Thế giá trị \\(\\sqrt{x} = \\ldots\\ldots\\) vừa tìm được vào biểu thức của hàm cầu \\[p\\]: \\[p=\\frac{1500}{\\sqrt{x}}=\\frac{1500}{\\dots \\dots }=\\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":42,"qType":"3","qText":"Câu 42: (Sở Phú Thọ 2026) Bác An có một cửa hàng chuyên bán buôn bưởi Đoan Hùng, bác nhận thấy rằng: Nếu bán mỗi kilogram bưởi với giá 30 nghìn đồng thì mỗi tuần có 60 đơn hàng và mỗi đơn hàng mua 100 kilogram. Nếu cứ tăng giá mỗi kilogram bưởi thêm 2 nghìn đồng thì hàng tuần số đơn hàng giảm 4 đơn, đồng thời số lượng bưởi mà mỗi đơn hàng đặt mua cũng giảm đi 2 kilogram. Hỏi bác cần bán mỗi kilogram bưởi với giá bao nhiêu nghìn đồng để lợi nhuận hàng tuần thu được là lớn nhất, biết giá nhập mỗi kilogram bưởi là 24 nghìn đồng và giá bán không vượt quá 50 nghìn đồng/1kg. (Kết quả làm tròn đến hàng đơn vị)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"40","explanation":"","hint":"Bước 1: Thiết lập các đại lượng thay đổi theo số lần tăng giá Gọi \\[x\\] là số lần tăng giá thêm \\[2\\] nghìn đồng/1kg bưởi (\\(x \\ge 0\\)).Giá bán của mỗi kilôgam bưởi sau khi tăng giá là:\\[30+\\dots \\dots \\cdot x\\text{\\ (nghìn đồng)}\\]Do điều kiện giá bán không vượt quá \\[50\\] nghìn đồng/1kg nên: \\(30 + 2x \\le 50 \\implies x \\le \\dots\\dots\\)Số lượng đơn hàng nhận được hàng tuần lúc này là:\\[60-\\dots \\dots \\cdot x\\text{\\ (đơn hàng)}\\]Số lượng bưởi mà mỗi đơn hàng đặt mua là:\\[100-\\dots \\dots \\cdot x\\text{\\ (kg)}\\]Tổng khối lượng bưởi bán được trong một tuần là: \\[Q(x)=(60-4x)(100-2x)=8(15-x)(50-x)\\text{\\ (kg)}\\]Bước 2: Lập hàm số biểu diễn tổng lợi nhuận hàng tuần (\\(L(x)\\)) Biết giá nhập mỗi kilôgam bưởi là \\[24\\] nghìn đồng, lợi nhuận trên mỗi kilôgam bưởi là:\\[(30+2x)-24=\\dots \\dots +2x\\text{\\ (nghìn đồng)}\\]Hàm số biểu diễn tổng lợi nhuận thu được hàng tuần là: \\[L(x)=(6+2x)\\cdot 8(15-x)(50-x)=16(3+x)(15-x)(50-x)\\]\\[L(x)=16\\left(x^{3}-62x^{2}+\\dots \\dots \\cdot x+2250\\right)\\]Bước 3: Khảo sát hàm số để tìm giá bán tối ưu Tính đạo hàm của hàm lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=16\\left(3x^{2}-124x+\\dots \\dots \\right)\\]Giải phương trình \\(L'(x) = 0\\) trên đoạn \\([0; 10]\\), ta tìm được nghiệm:\\[x\\approx 5,11\\text{\\ (thỏa mãn)}\\]Lập bảng biến thiên, ta thấy hàm số \\(L(x)\\) đạt cực đại tại điểm \\(x \\approx 5,11\\).Khi đó, mức giá bán mỗi kilôgam bưởi để lợi nhuận cao nhất là:\\[30+2\\times 5,11=40,22\\text{\\ (nghìn đồng)}\\]Làm tròn đến hàng đơn vị theo yêu cầu đề bài, ta được giá bán là \\(\\dots\\dots\\) nghìn đồng. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":43,"qType":"3","qText":"Câu 43: (Chuyên Vinh 2026) Một doanh nghiệp sản xuất và bán một loại hàng hóa. Gọi $x$ (đơn vị: nghìn sản phẩm, $0","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"13","explanation":"","hint":""},{"originalNum":44,"qType":"3","qText":"Câu 44: (Sở Hưng Yên 2026) Nhà máy $A$ chuyên sản xuất một loại sản phẩm cho nhà máy $B$. Hai nhà máy thỏa thuận rằng, hằng tháng $A$ cung cấp cho $B$ số lượng sản phẩm theo đơn đặt hàng của $B$ (tối đa 100 tấn sản phẩm). Nếu số lượng đặt hàng là $x$ tấn sản phẩm thì giá bán cho mỗi tấn sản phẩm là $P(x)=90-0,01x^2$ (triệu đồng). Chi phí để $A$ sản xuất $x$ tấn sản phẩm trong một tháng là $C(x)=100+15x$ (triệu đồng) (gồm 100 triệu đồng chi phí cố định và 15 triệu đồng chi phí cho mỗi tấn sản phẩm). Hỏi $A$ bán cho $B$ bao nhiêu tấn sản phẩm mỗi tháng thì thu được lợi nhuận cao nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"50","explanation":"","hint":"Bước 1: Thiết lập hàm số doanh thu \\(R(x)\\) và hàm số lợi nhuận \\(L(x)\\) Tổng doanh thu nhà máy \\[A\\] nhận được khi bán hết \\[x\\] tấn sản phẩm cho nhà máy \\[B\\] là:\\[R(x)=x\\cdot P(x)=x\\cdot \\left(90-0,01x^{2}\\right)=90x-\\dots \\dots x^{3}\\text{\\ (triệu đồng)}\\]Hàm số lợi nhuận \\(L(x)\\) đạt được bằng tổng doanh thu trừ đi tổng chi phí sản xuất:\\[L(x)=R(x)-C(x)=\\left(90x-0,01x^{3}\\right)-\\left(100+15x\\right)\\]\\[\\Rightarrow L(x)=-0,01x^{3}+\\dots \\dots x-100\\text{\\ (triệu đồng)}\\]Miền khảo sát của hàm số lợi nhuận theo điều kiện đơn đặt hàng là: \\(0 < x \\leq \\ldots\\ldots\\) Bước 2: Tìm cực trị bằng phương pháp đạo hàm Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=-0,03x^{2}+\\dots \\dots \\]Giải phương trình đạo hàm \\(L'(x) = 0\\): \\[-0,03x^{2}+75=0\\Rightarrow x^{2}=2500\\Rightarrow \\begin{cases}x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ x=-50\\text{\\ (loại)}\\end{cases}\\]Bước 3: Đánh giá và kết luận Lập bảng biến thiên của hàm số \\(L(x)\\) trên nửa khoảng \\((0; 100]\\), ta thấy hàm số \\(L(x)\\) đồng biến trên khoảng \\((0; \\ldots\\ldots)\\) và nghịch biến trên khoảng \\((\\ldots\\ldots; 100)\\).Do đó, lợi nhuận của nhà máy đạt giá trị cao nhất tại điểm \\(x = \\ldots\\ldots\\)Vậy nhà máy \\[A\\] cần bán cho nhà máy \\[B\\] \\(\\ldots\\ldots\\) tấn sản phẩm mỗi tháng để thu được lợi nhuận cao nhất.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":45,"qType":"3","qText":"Câu 45: (THPT Thọ Xuân 5-Thanh Hóa 2026) Một gia đình đan lưới đánh cá, mỗi ngày đan được $x$ mét lưới ($1\\le x\\le 18$). Tổng chi phí sản xuất $x$ mét lưới, tính bằng nghìn đồng, cho bởi hàm chi phí: $C(x)=x^3-3x^2-20x+500$\nGiả sử gia đình làm nghề đan lưới bán hết sản phẩm mỗi ngày với giá 220 nghìn đồng/mét.\n\nGọi $L(x)$ là lợi nhuận thu được khi bán $x$ mét lưới. Hỏi lợi nhuận tối đa của gia đình đan lưới trong một ngày (đơn vị tính nghìn đồng)?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1200","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng doanh thu \\(R(x)\\) Mỗi ngày gia đình bán được \\[x\\] mét lưới với giá cố định là \\[220\\] nghìn đồng/mét.Hàm số biểu thị tổng doanh thu hàng ngày thu được là: \\[R(x)=\\dots \\dots \\dots x\\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(L(x)\\) Lợi nhuận \\(L(x)\\) thu được trong một ngày là hiệu giữa tổng doanh thu \\(R(x)\\) và tổng chi phí sản xuất \\(C(x) = x^3 - 3x^2 - 20x + 500\\): \\[L(x)=R(x)-C(x)\\]\\[L(x)=220x-(x^{3}-3x^{2}-20x+500)\\]\\[L(x)=-x^{3}+\\dots \\dots \\dots x^{2}+\\dots \\dots \\dots x-500\\quad (\\text{với }1\\le x\\le 18)\\]Bước 3: Tìm số mét lưới \\[x\\] để lợi nhuận đạt mức tối đa Tính đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=-3x^{2}+\\dots \\dots \\dots x+240\\]Giải phương trình đạo hàm \\(L'(x) = 0\\) trên đoạn \\([1; 18]\\):\\[-3x^{2}+6x+240=0\\Leftrightarrow x^{2}-2x-80=0\\Leftrightarrow \\left[\\begin{aligned}&x=10\\quad (\\text{thỏa mãn})\\\\ &x=-8\\quad (\\text{loại})\\end{aligned}\\right.\\]Lập bảng biến thiên hoặc đánh giá dấu của \\(L'(x)\\), ta thấy hàm số \\(L(x)\\) đồng biến trên khoảng \\((1; 10)\\) và nghịch biến trên khoảng \\((10; 18)\\). Do đó, hàm số đạt giá trị lớn nhất tại đỉnh cực đại \\(x = \\ldots\\ldots\\ldots\\) Bước 4: Tính mức lợi nhuận lớn nhất trong ngày Thay giá trị \\(x = 10\\) vào hàm số lợi nhuận \\(L(x)\\), ta thu được số tiền lợi nhuận tối đa là: \\[L(10)=-10^{3}+3\\times 10^{2}+240\\times 10-500=\\dots \\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 1200"},{"originalNum":46,"qType":"3","qText":"Câu 46: (THPT Cửa Lò - Nghệ An 2026) Một doanh nghiệp dự định sản xuất không quá 300 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm ($1\\le x\\le 300$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=-7x^2+1700x$ (nghìn đồng), trong khi chi phí sản xuất bình quân cho một\n\n6\n________________________________________\n\n\nsản phẩm là $G(x)=0,004x^2-1,6x+500+\\frac{16000}{x}$ (nghìn đồng). Lợi nhuận thu được của doanh nghiệp (tính theo đơn vị triệu đồng) đạt giá trị lớn nhất bằng bao nhiêu?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"46","explanation":"","hint":"Bước 1: Xác định hàm tổng chi phí sản xuất \\(C(x)\\) Vì chi phí sản xuất bình quân cho một sản phẩm là \\(G(x)\\), nên tổng chi phí sản xuất cho \\[x\\] sản phẩm (\\(1 \\leq x \\leq 300\\)) là: \\[C(x)=x\\cdot G(x)=x\\cdot \\left(0,004x^{2}-1,6x+500+\\frac{16000}{x}\\right)\\]\\[C(x)=0,004x^{3}-\\dots \\dots \\cdot x^{2}+500x+16000\\text{\\ (nghìn đồng)}\\]Bước 2: Thiết lập hàm lợi nhuận \\(L(x)\\) Lợi nhuận thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=F(x)-C(x)=\\left(-7x^{2}+1700x\\right)-\\left(0,004x^{3}-1,6x^{2}+500x+16000\\right)\\]\\[L(x)=-0,004x^{3}-\\dots \\dots \\cdot x^{2}+1200x-16000\\text{\\ (nghìn đồng)}\\]Bước 3: Khảo sát hàm số để tìm lợi nhuận lớn nhất Đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=-0,012x^{2}-\\dots \\dots \\cdot x+1200\\]Giải phương trình \\(L'(x) = 0\\) trên đoạn \\([1; 300]\\):\\[-0,012x^{2}-10,8x+1200=0\\Leftrightarrow \\left[\\begin{aligned}&x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ &x=-1000\\text{\\ (loại)}\\end{aligned}\\right.\\]Lập bảng biến thiên của hàm số \\(L(x)\\) trên đoạn \\([1; 300]\\), ta thấy hàm số đạt giá trị lớn nhất tại \\(x = 100\\).Giá trị lợi nhuận lớn nhất tính theo đơn vị nghìn đồng là:\\[L(100)=\\dots \\dots \\text{\\ (nghìn đồng)}\\]Đổi sang đơn vị triệu đồng để ra kết quả cuối cùng: \\[\\frac{\\dots \\dots }{1000}=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":47,"qType":"3","qText":"Câu 47. (Cụm trường Thanh Hóa 2026) Một cửa hàng kinh doanh máy lọc nước Karofi. Hàm cầu biểu thị liên hệ giữa giá bán của một chiếc máy với số lượng máy bán được trong một tháng là hàm bậc nhất. Khi giá bán là 5 triệu đồng một chiếc thì một tháng bán được 100 chiếc. Khi giá bán là 4,5 triệu đồng một chiếc thì một tháng bán được 120 chiếc. Biết chi phí trung bình cho một chiếc máy khi bán được $x$ chiếc là\n$$\\bar{C}(x)=\\frac{3x+50}{x}$$\nHỏi cửa hàng cần bán với giá bao nhiêu triệu đồng một chiếc máy để lợi nhuận thu được trong một tháng là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"5.25","explanation":"","hint":"Bước 1: Tìm hàm cầu biểu diễn giá bán \\(p(x)\\) theo số lượng máy \\[x\\] Hàm cầu liên hệ giữa giá bán \\[p\\] (triệu đồng) và số lượng máy bán ra \\[x\\] (chiếc) trong một tháng là một hàm số bậc nhất có dạng:\\[p(x)=ax+b\\quad (a\\ne 0)\\]Dựa vào dữ kiện đề bài, ta lập hệ phương trình:\\[\\begin{cases}p(100)=5\\\\ p(120)=4,5\\end{cases}\\implies \\begin{cases}100a+b=5\\\\ 120a+b=4,5\\end{cases}\\implies \\begin{cases}a=\\dots \\dots \\\\ b=\\dots \\dots \\end{cases}\\]Vậy hàm cầu biểu thị giá bán là: \\(p(x) = -0,025x + 7,5\\). Bước 2: Lập hàm số biểu diễn tổng lợi nhuận thu được trong một tháng (\\(L(x)\\)) Khi bán được \\[x\\] chiếc máy, tổng doanh thu nhận được là:\\[R(x)=x\\cdot p(x)=-0,025x^{2}+\\dots \\dots \\cdot x\\text{\\ (triệu đồng)}\\]Hàm chi phí trung bình cho mỗi chiếc máy là \\(\\bar{C}(x) = \\frac{3x + 50}{x}\\), do đó tổng chi phí để sản xuất và bán \\[x\\] chiếc máy là:\\[C(x)=x\\cdot \\={C}(x)=\\dots \\dots \\cdot x+50\\text{\\ (triệu đồng)}\\]Hàm số biểu diễn tổng lợi nhuận thu được trong một tháng là: \\[L(x)=R(x)-C(x)=\\left(-0,025x^{2}+7,5x\\right)-(3x+50)\\]\\[L(x)=-0,025x^{2}+\\dots \\dots \\cdot x-50\\]Bước 3: Tìm số lượng máy và mức giá bán để lợi nhuận lớn nhất Hàm số lợi nhuận \\(L(x) = -0,025x^2 + 4,5x - 50\\) là một hàm số bậc hai. Đồ thị của hàm số là một Parabol đạt giá trị lớn nhất tại hoành độ đỉnh:\\[x=-\\frac{b}{2a}=\\dots \\dots \\text{\\ (chiếc)}\\]Thay số lượng máy tối ưu vừa tìm được vào hàm cầu ở Bước 1, ta tính được mức giá bán tương ứng là: \\[p(\\dots \\dots )=-0,025\\cdot (\\dots \\dots )+7,5=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":48,"qType":"3","qText":"Câu 48. (Sở Tuyên Quang 2026) Một khu chung cư có 120 căn hộ cho thuê. Người quản lí của khu chung cư nhận thấy rằng nếu giá thuê một căn hộ là 7 triệu đồng một tháng thì tất cả các căn hộ đều sẽ có người thuê. Một cuộc khảo sát thị trường cho thấy, trung bình cứ mỗi lần tăng giá thuê một căn hộ mỗi tháng thêm 250 nghìn đồng thì sẽ có thêm ba căn hộ bị bỏ trống. Người quản lí nên đặt giá thuê mỗi căn hộ là bao nhiêu triệu đồng một tháng để doanh thu một tháng là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"8.5","explanation":"","hint":"Bước 1: Thiết lập các hàm số phụ thuộc vào số lần tăng giá Gọi \\[x\\] là số lần người quản lí tăng giá thuê nhà thêm \\(250\\text{ nghìn đồng} = 0,25\\text{ triệu đồng}\\) mỗi căn hộ \\((x \\geq 0)\\).Khi đó, giá thuê mỗi căn hộ một tháng sau khi tăng là:\\[P(x)=7+\\dots \\dots x\\text{\\ (triệu đồng)}\\]Vì cứ mỗi lần tăng giá thì có thêm 3 căn hộ bị bỏ trống, nên số căn hộ có người thuê thực tế là: \\[N(x)=120-\\dots \\dots x\\text{\\ (căn hộ)}\\]Bước 2: Xây dựng hàm số tổng doanh thu \\(R(x)\\) Tổng doanh thu thu được trong một tháng bằng tích của số căn hộ được thuê và giá thuê mỗi căn: \\[R(x)=P(x)\\cdot N(x)=\\left(7+0,25x\\right)\\left(120-3x\\right)\\]\\[\\Rightarrow R(x)=-0,75x^{2}+\\dots \\dots x+840\\text{\\ (triệu đồng)}\\]Bước 3: Tìm điểm tối ưu bằng tính chất hàm bậc hai Nhận thấy hàm số doanh thu \\(R(x)\\) là một hàm số bậc hai có đồ thị là một parabol quay bề lõm xuống dưới. Do đó, doanh thu đạt giá trị lớn nhất tại đỉnh của parabol:\\[x=-\\frac{b}{2a}=-\\frac{9}{2\\cdot (-0,75)}=\\dots \\dots \\]Thay giá trị \\[x\\] vừa tìm được vào công thức giá thuê \\(P(x)\\) ở Bước 1, ta tính được giá thuê tối ưu cho mỗi căn hộ là:\\[P(\\dots \\dots )=7+0,25\\cdot \\dots \\dots =\\dots \\dots \\text{\\ (triệu đồng/tháng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":49,"qType":"3","qText":"Câu 49. (Sở Quảng Ninh 2026) Một doanh nghiệp dự định sản xuất không quá 200 đơn vị sản phẩm. Nếu doanh nghiệp sản xuất $x$ đơn vị sản phẩm ($1\\le x\\le 200$) thì giá bán của mỗi đơn vị sản phẩm là $f(x)=435-2x$ (triệu đồng) và chi phí sản xuất bình quân cho một đơn vị sản phẩm là\n$$g(x)=\\frac{0,7x^2}{125}-1,706x+96,5+\\frac{6375}{x}$$\n(triệu đồng). Biết rằng mức thuế cho một đơn vị sản phẩm này là 2,5 triệu đồng. Hỏi doanh nghiệp cần sản xuất bao nhiêu đơn vị sản phẩm để lợi nhuận thu được lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"125","explanation":"","hint":"Bước 1: Thiết lập các hàm số doanh thu \\(R(x)\\) và tổng chi phí \\(C(x)\\) Doanh thu thu được khi bán hết \\[x\\] sản phẩm với giá \\(f(x) = 435 - 2x\\) (triệu đồng/đơn vị) là:\\[R(x)=x\\times f(x)=x(435-2x)=\\dots \\dots \\dots x-2x^{2}\\text{\\ (triệu đồng)}\\]Tổng chi phí của doanh nghiệp bao gồm chi phí sản xuất và chi phí thuế (\\(2,5\\) triệu đồng/đơn vị sản phẩm): \\[C(x)=x\\times g(x)+2,5x=x\\left(\\frac{0,7x^{2}}{125}-1,706x+96,5+\\frac{6375}{x}\\right)+2,5x\\]\\[C(x)=\\frac{0,7}{125}x^{3}-1,706x^{2}+\\dots \\dots \\dots x+6375\\text{\\ (triệu đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Lợi nhuận \\(P(x)\\) của doanh nghiệp thu được là: \\[P(x)=R(x)-C(x)=(435x-2x^{2})-\\left(0,0056x^{3}-1,706x^{2}+99x+6375\\right)\\]\\[P(x)=-0,0056x^{3}-\\dots \\dots \\dots x^{2}+336x-6375\\quad (\\text{với }1\\le x\\le 200)\\]Bước 3: Tìm số lượng đơn vị sản phẩm \\[x\\] để lợi nhuận lớn nhất Tính đạo hàm của hàm số lợi nhuận:\\[P^{\\prime }(x)=-0,0168x^{2}-\\dots \\dots \\dots x+336\\]Giải phương trình đạo hàm \\(P'(x) = 0\\) trên đoạn \\([1; 200]\\):\\[-0,0168x^{2}-0,588x+336=0\\Leftrightarrow \\left[\\begin{aligned}&x=-160\\quad (\\text{loại})\\\\ &x=\\dots \\dots \\dots \\quad (\\text{thỏa mãn})\\end{aligned}\\right.\\]Lập bảng biến thiên trên đoạn \\([1; 200]\\), ta thấy hàm số \\(P(x)\\) đồng biến trên khoảng \\((1; 125)\\) và nghịch biến trên khoảng \\((125; 200)\\). Do đó, hàm số đạt giá trị lớn nhất tại điểm cực đại \\(x = 125\\). \\[\\Rightarrow \\] Đáp án cần nhập là: 125"},{"originalNum":50,"qType":"3","qText":"Câu 50. (Sở Thanh Hóa 2026) Nếu một doanh nghiệp sản xuất $x$ sản phẩm trong một tháng ($x∈ N;1\\le x\\le 300$) thì doanh thu nhận được khi bán hết số sản phẩm là $F(x)=x^3-1999x^2+1001000x+250000$ (đồng). Trong đó, chi phí vận hành máy móc bình quân cho mỗi sản phẩm khi sản xuất $x$ sản phẩm là $G(x)=300+\\frac{100}{x}$ (nghìn đồng), chi phí mua nguyên vật liệu để sản xuất $x$ sản phẩm là $H(x)=2x^3+100000x-50000$ (đồng). Doanh nghiệp cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"136","explanation":"","hint":"Bước 1: Quy đổi đơn vị và tính tổng chi phí sản xuất \\(C(x)\\) Tổng chi phí vận hành máy móc khi sản xuất \\[x\\] sản phẩm (\\(1 \\leq x \\leq 300\\)) là:\\[x\\cdot G(x)=x\\cdot \\left(300+\\frac{100}{x}\\right)=300x+100\\text{\\ (nghìn đồng)}=300000x+100000\\text{\\ (đồng)}\\]Tổng chi phí sản xuất \\[x\\] sản phẩm (gồm chi phí vận hành và chi phí nguyên vật liệu) là: \\[C(x)=(300000x+100000)+\\left(2x^{3}+100000x-50000\\right)=2x^{3}+\\dots \\dots \\cdot x+50000\\text{\\ (đồng)}\\]Bước 2: Thiết lập hàm số lợi nhuận \\(L(x)\\) Lợi nhuận thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=F(x)-C(x)=\\left(x^{3}-1999x^{2}+1001000x+250000\\right)-\\left(2x^{3}+400000x+50000\\right)\\]\\[L(x)=-x^{3}-\\dots \\dots \\cdot x^{2}+601000x+200000\\text{\\ (đồng)}\\]Bước 3: Khảo sát hàm số để tìm lợi nhuận lớn nhất Đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=-3x^{2}-\\dots \\dots \\cdot x+601000\\]Giải phương trình \\(L'(x) = 0\\) tìm điểm cực trị:\\[-3x^{2}-3998x+601000=0\\Rightarrow x\\approx 136,3\\]Lập bảng biến thiên của hàm số trên đoạn \\([1; 300]\\). Do số lượng sản phẩm \\(x \\in \\mathbb{N}\\) nên ta so sánh giá trị tại hai số nguyên gần nhất:\\[L(136)=42447040\\text{ đồng};\\quad L(137)=42446416\\text{ đồng}\\]Như vậy, lợi nhuận lớn nhất đạt được khi doanh nghiệp sản xuất số lượng sản phẩm là: \\(\\ldots\\ldots\\) \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":51,"qType":"3","qText":"Câu 51. (Sở Phú Thọ 2026) Nếu một doanh nghiệp sản xuất $x$ sản phẩm trong một tháng ($x∈ N^*,1\\le x\\le 5000$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=-0,03x^2+800x$ (nghìn đồng), trong khi chi phí sản xuất bình quân cho một sản phẩm là\n$$G(x)=\\frac{50000}{x}+450$$\n(nghìn đồng). Giả sử số sản phẩm sản xuất ra luôn được bán hết. Trong một tháng, doanh nghiệp đó cần sản xuất ít nhất bao nhiêu sản phẩm để lợi nhuận thu được lớn hơn 100 triệu đồng?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"446","explanation":"","hint":"Bước 1: Lập hàm số biểu diễn tổng chi phí và tổng lợi nhuận thu được trong tháng (\\(P(x)\\)) Chi phí sản xuất bình quân cho một sản phẩm là \\(G(x) = \\frac{50000}{x} + 450\\) (nghìn đồng). Do đó, tổng chi phí để sản xuất \\[x\\] sản phẩm là:\\[C(x)=x\\cdot G(x)=x\\cdot \\left(\\frac{50000}{x}+450\\right)=450x+\\dots \\dots \\text{\\ (nghìn đồng)}\\]Hàm số biểu diễn lợi nhuận \\(P(x)\\) thu được bằng doanh thu trừ đi tổng chi phí: \\[P(x)=F(x)-C(x)=\\left(-0,03x^{2}+800x\\right)-(450x+50000)\\]\\[P(x)=-0,03x^{2}+\\dots \\dots \\cdot x-50000\\quad (\\text{nghìn đồng})\\]Bước 2: Thiết lập bất phương trình theo điều kiện lợi nhuận Đổi đơn vị mục tiêu lợi nhuận: \\(100 \\text{ triệu đồng} = \\dots\\dots \\text{ nghìn đồng}\\).Để lợi nhuận lớn hơn 100 triệu đồng, ta có bất phương trình: \\[-0,03x^{2}+350x-50000>100000\\implies -0,03x^{2}+350x-\\dots \\dots >0\\]Bước 3: Giải bất phương trình và kết luận số lượng sản phẩm ít nhất Xét phương trình bậc hai \\(-0,03x^2 + 350x - 150000 = 0\\), ta tìm được hai nghiệm xấp xỉ:\\[x_{1}\\approx 445,46\\quad \\text{và}\\quad x_{2}\\approx 11221,21\\]Do hệ số của \\[x^{2}\\] âm (\\(-0,03 < 0\\)), tập nghiệm của bất phương trình trên là:\\[445,46<x<11221,21\\]Kết hợp điều kiện \\(x \\in \\mathbb{N}^*\\), doanh nghiệp cần sản xuất ít nhất \\(\\dots\\dots\\) sản phẩm để lợi nhuận thu được vượt mốc mục tiêu đề ra. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":52,"qType":"3","qText":"Câu 52. (Sở Nghệ An 2026) Một cơ sở sản xuất nước mắm dự định tung ra thị trường dòng sản phẩm nước mắm đặc biệt. Dự kiến mỗi tháng cơ sở sản xuất và bán ra $x$ chai, $0\\le x\\le 2000$. Giá bán mỗi chai được ấn định là 350000 đồng. Tổng chi phí sản xuất $x$ chai mỗi tháng, bao gồm nguyên liệu, nhân công, bao bì và chi phí vận hành, được ước tính bởi hàm\n$$C(x)=\\frac{1}{10}x^2+110x+30000$$\nđơn vị: nghìn đồng. Hỏi cơ sở nên sản xuất bao nhiêu chai mỗi tháng để lợi nhuận đạt giá trị lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1200","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng doanh thu \\(R(x)\\) và đổi đơn vị đo lường Vì hàm số chi phí \\(C(x)\\) được tính theo đơn vị nghìn đồng, ta cần chuyển đổi giá bán mỗi chai về cùng đơn vị:\\[350000\\text{ đồng}=\\dots \\dots \\text{\\ nghìn đồng}\\]Tổng doanh thu thu được khi bán hết \\[x\\] chai nước mắm mỗi tháng là: \\[R(x)=\\dots \\dots \\dots \\dots \\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(L(x)\\) Hàm số lợi nhuận thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=R(x)-C(x)=350x-\\left(\\frac{1}{10}x^{2}+110x+30000\\right)\\]\\[\\Rightarrow L(x)=-\\frac{1}{10}x^{2}+\\dots \\dots x-30000\\quad (\\text{với }0\\le x\\le 2000)\\]Bước 3: Tìm số lượng chai nước mắm tối ưu bằng đỉnh của Parabol Hàm số lợi nhuận \\(L(x)\\) là một hàm số bậc hai có đồ thị là một parabol có bề lõm quay xuống dưới. Do đó, lợi nhuận đạt giá trị lớn nhất tại hoành độ đỉnh của parabol:\\[x=-\\frac{b}{2a}=-\\frac{240}{2\\cdot \\left(-\\frac{1}{10}\\right)}=\\dots \\dots \\]Nhận thấy giá trị \\[x\\] tìm được thỏa mãn điều kiện \\(0 \\leq x \\leq 2000\\).Vậy cơ sở nên sản xuất \\(\\ldots\\ldots\\) chai nước mắm mỗi tháng để đạt lợi nhuận lớn nhất.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":53,"qType":"3","qText":"Câu 53. (Chuyên Lê Khiết - Quảng Ngãi 2026) Một nhà máy chế tạo linh kiện điện tử đặc chủng, số lượng linh kiện được sản xuất mỗi tháng là $x(x∈ N^*,100\\le x\\le 5000)$. Toàn bộ sản phẩm sản xuất ra đều được tiêu thụ với giá bán cố định là 200 triệu đồng/linh kiện. Doanh thu được xác định theo mô hình tuyến tính $F(x)=200x$, tổng chi phí sản xuất lại tăng theo hàm mũ và được cho bởi công thức $C(x)=100e^{0,001x}$, đơn vị: triệu đồng. Để nhà máy đạt lợi nhuận tối thiểu là 25 tỷ đồng, nhà máy cần sản xuất ít nhất bao nhiêu linh kiện trong tháng đó?\n\n7\n________________________________________","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"126","explanation":"","hint":"Bước 1: Quy đổi đơn vị và thiết lập bất phương trình lợi nhuận Đổi đơn vị mức lợi nhuận tối thiểu từ tỷ đồng sang triệu đồng để đồng nhất với các hàm số:\\[25\\text{\\ tỷ đồng}=\\dots \\dots \\dots \\text{\\ triệu đồng}\\]Hàm số biểu thị lợi nhuận thu được hằng tháng \\(P(x)\\) là hiệu giữa doanh thu \\(F(x)\\) và tổng chi phí sản xuất \\(C(x)\\):\\[P(x)=F(x)-C(x)=200x-100e^{0,001x}\\text{\\ (triệu đồng)}\\]Để nhà máy đạt lợi nhuận tối thiểu là \\[25\\] tỷ đồng, ta có bất phương trình: \\[200x-100e^{0,001x}\\ge \\dots \\dots \\dots \\Leftrightarrow 2x-e^{0,001x}-250\\ge 0\\quad (*).\\]Bước 2: Khảo sát hàm số để tìm miền nghiệm Xét hàm số \\(g(x) = 2x - e^{0,001x} - 250\\) trên đoạn \\([100; 5000]\\).Tính đạo hàm của hàm số:\\[g^{\\prime }(x)=\\dots \\dots \\dots -0,001e^{0,001x}\\]Giải phương trình \\(g'(x) = 0\\):\\[2-0,001e^{0,001x}=0\\Leftrightarrow e^{0,001x}=2000\\Leftrightarrow x=\\frac{\\ln (2000)}{0,001}\\approx 7601\\]Vì \\(x \\approx 7601\\) nằm ngoài đoạn đang xét \\([100; 5000]\\), ta thấy trên toàn bộ đoạn này \\(g'(x) > 0\\). Do đó, hàm số \\(g(x)\\) là hàm số \\(\\ldots\\ldots\\ldots\\) trên đoạn \\([100; 5000]\\). Bước 3: Xác định giá trị nguyên nhỏ nhất của \\[x\\] Vì hàm số \\(g(x)\\) đồng biến liên tục, nghiệm của bất phương trình \\((*)\\) sẽ có dạng \\(x \\ge x_0\\). Ta dùng phương pháp thử các giá trị nguyên lân cận để tìm vị trí đổi dấu của hàm số:Với \\(x = 125\\): \\(g(125) = 2 \\times 125 - e^{0,125} - 250 \\approx \\ldots\\ldots\\ldots < 0\\)Với \\(x = 126\\): \\(g(126) = 2 \\times 126 - e^{0,126} - 250 \\approx \\ldots\\ldots\\ldots > 0\\) Do đó, để \\(g(x) \\ge 0\\) thì số lượng linh kiện \\[x\\] nguyên nhỏ nhất cần sản xuất phải là \\(\\ldots\\ldots\\ldots\\) \\[\\Rightarrow \\] Đáp án cần nhập là: 126 "},{"originalNum":54,"qType":"3","qText":"Câu 54. (THPT Dương Quảng Hàm - Hưng Yên 2026) Một Villa sinh thái nghỉ dưỡng thống kê được rằng: Nếu áp dụng mức giá 3 triệu đồng/người/ngày thì mỗi tháng có 160 khách đến nghỉ và mỗi khách sẽ nghỉ 10 ngày. Nếu cứ tăng giá thêm 500 nghìn đồng/người/ngày thì hàng tháng số khách đến nghỉ sẽ giảm 4 người và thời gian lưu trú của mỗi khách cũng giảm đi 2 ngày. Ngược lại, nếu cứ giảm giá 500 nghìn đồng/người/ngày thì hàng tháng số khách đến nghỉ sẽ tăng thêm 4 người và thời gian lưu trú của mỗi khách cũng tăng thêm 2 ngày.\nHỏi villa đó cần áp dụng mức giá bao nhiêu triệu đồng/người/ngày để lợi nhuận hàng tháng thu được là lớn nhất, biết tổng chi phí công ty phải chi cho một ngày lưu trú của mỗi người khách là 2 triệu đồng và Sở văn hóa, thể thao và du lịch không cho công ty thu vượt quá 10 triệu đồng/người/ngày.\n(không làm tròn kết quả các phép tính trung gian, chỉ làm tròn kết quả cuối cùng đến hàng phần trăm)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"3.67","explanation":"","hint":"Bước 1: Thiết lập biểu thức giá bán, số lượng khách và số ngày lưu trú Gọi mức tăng hoặc giảm giá so với ban đầu là x (triệu đồng/người/ngày).Do mức giá tối đa quy định là 10 triệu đồng nên điều kiện áp dụng là: -3 < x ≤ 7.Khi đó, mức giá mới được áp dụng cho mỗi người khách trong một ngày là:\\[P(x)=3+x\\text{\\ (triệu đồng)}\\]Vì cứ tăng/giảm giá mỗi 0,5 triệu đồng thì số khách giảm/tăng 4 người, nên số lượng khách hàng tháng biến đổi theo biểu thức:\\[N(x)=160-4\\cdot \\frac{x}{0,5}=\\dots \\dots -8x\\text{\\ (người)}\\]Tương tự, thời gian lưu trú bình quân của mỗi khách hàng tháng biến đổi theo biểu thức: \\[D(x)=10-2\\cdot \\frac{x}{0,5}=\\dots \\dots -4x\\text{\\ (ngày)}\\]Bước 2: Thiết lập hàm số lợi nhuận hàng tháng L(x) Chi phí công ty phải trả cho mỗi ngày lưu trú của một khách là 2 triệu đồng, nên lợi nhuận thu được trên một người khách trong một ngày là:\\[P(x)-2=(3+x)-2=\\dots \\dots \\text{\\ (triệu đồng)}\\]Hàm tổng lợi nhuận hàng tháng của Villa thu được là tích của số khách, số ngày ở và lợi nhuận đơn vị: \\[L(x)=N(x)\\cdot D(x)\\cdot (1+x)=(160-8x)(10-4x)(1+x)\\]\\[L(x)=32x^{3}-\\dots \\dots \\cdot x^{2}-480x+1600\\text{\\ (triệu đồng)}\\]Bước 3: Khảo sát hàm số để tìm giá bán tối ưu Đạo hàm của hàm lợi nhuận theo biến x:\\[L^{\\prime }(x)=96x^{2}-\\dots \\dots \\cdot x-480\\]Giải phương trình L'(x) = 0 và chọn nghiệm thích hợp thuộc khoảng điều kiện kinh doanh thực tế (\\(160-8x > 0 \\Rightarrow x < 2{,}5\\)):\\[96x^{2}-1376x-480=0\\Leftrightarrow \\left[\\begin{aligned}&x=\\frac{43-7\\sqrt{31}}{6}\\approx \\dots \\dots \\text{\\ (thỏa mãn)}\\\\ &x=\\frac{43+7\\sqrt{31}}{6}\\approx 13,66\\text{\\ (loại)}\\end{aligned}\\right.\\]Lập bảng biến thiên, hàm số đạt cực đại tại x ≈ 0,67. Mức giá mới cần áp dụng để lợi nhuận lớn nhất là: \\[P=3+0,67=\\dots \\dots \\text{\\ (triệu đồng/người/ngày)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":55,"qType":"3","qText":"Câu 55. (THPT Phan Huy Chú - Hà Nội 2026) Một nhà máy sản xuất dòng drone chuyên dụng phục vụ cứu hộ. Nhà máy có công suất tối đa 400 chiếc/quý. Phòng kinh doanh đưa ra các dữ liệu tài chính cho việc sản xuất và tiêu thụ hết $x$ chiếc drone trong một quý như sau, với $x∈ \\mathbb{N}^*$, $x\\le 400$:\n- Giá bán mỗi chiếc drone xác định theo hàm số $P(x)=150-0,2x$, đơn vị triệu đồng/chiếc.\n- Chi phí vận hành cố định: 2 tỷ đồng/quý.\n- Chi phí linh kiện: giá gốc 70 triệu đồng/chiếc. Nếu sản xuất trên 150 chiếc thì chi phí linh kiện cho toàn bộ lô hàng giảm xuống còn 60 triệu đồng/chiếc.\nLợi nhuận sau thuế lớn nhất trong một quý nhà máy có thể đạt được là bao nhiêu triệu đồng? Biết thuế thu nhập doanh nghiệp là 20% tính trên lợi nhuận dương.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"6500","explanation":"","hint":"Bước 1: Lập hàm lợi nhuận trước thuế với trường hợp lô hàng nhỏ (\\(1 \\le x \\le 150\\)) Doanh thu khi bán \\[x\\] chiếc drone trong một quý là:\\[R(x)=x\\cdot P(x)=x(150-0,2x)=150x-0,2x^{2}\\text{\\ (triệu đồng)}\\]Đổi đơn vị chi phí cố định: \\(2 \\text{ tỷ đồng} = 2000 \\text{ triệu đồng}\\).Khi sản xuất và tiêu thụ không quá \\[150\\] chiếc, giá linh kiện là \\(70 \\text{ triệu đồng/chiếc}\\). Tổng chi phí là:\\[C_{1}(x)=2000+\\dots \\dots \\cdot x\\text{\\ (triệu đồng)}\\]Hàm lợi nhuận trước thuế tương ứng \\(\\pi_1(x)\\) là:\\[\\pi _{1}(x)=R(x)-C_{1}(x)=-0,2x^{2}+\\dots \\dots \\cdot x-2000\\]Hàm số \\(\\pi_1(x)\\) đồng biến trên đoạn \\([1; 150]\\), đạt giá trị lớn nhất tại \\(x = 150\\): \\[\\max _{[1;150]}\\pi _{1}(x)=\\pi _{1}(150)=\\dots \\dots \\text{\\ (triệu đồng)}\\]Bước 2: Lập hàm lợi nhuận trước thuế với trường hợp lô hàng lớn (\\(150 < x \\le 400\\)) Khi sản xuất trên \\[150\\] chiếc, giá linh kiện cho toàn bộ lô hàng giảm xuống còn \\(60 \\text{ triệu đồng/chiếc}\\). Tổng chi phí lúc này là:\\[C_{2}(x)=2000+\\dots \\dots \\cdot x\\text{\\ (triệu đồng)}\\]Hàm lợi nhuận trước thuế tương ứng \\(\\pi_2(x)\\) là:\\[\\pi _{2}(x)=R(x)-C_{2}(x)=-0,2x^{2}+\\dots \\dots \\cdot x-2000\\]Hàm số bậc hai \\(\\pi_2(x)\\) đạt giá trị lớn nhất tại hoành độ đỉnh Parabol:\\[x=-\\frac{b}{2a}=\\dots \\dots \\text{\\ (chiếc - thỏa mãn khoảngđang xét)}\\]Mức lợi nhuận trước thuế lớn nhất có thể đạt được ở trường hợp này là: \\[\\pi _{2}(\\dots \\dots )=\\dots \\dots \\text{\\ (triệu đồng)}\\]Bước 3: Tính toán lợi nhuận sau thuế lớn nhất So sánh hai trường hợp, mức lợi nhuận trước thuế lớn nhất của nhà máy là \\(8125 \\text{ triệu đồng}\\) (tại sản lượng \\(x = 225\\)).Vì lợi nhuận dương nên nhà máy phải nộp thuế thu nhập doanh nghiệp \\(20\\%\\).Lợi nhuận sau thuế lớn nhất mà nhà máy thu về là: \\[8125\\times (1-\\dots \\dots )=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":56,"qType":"3","qText":"Câu 56. (Đề BGD 2026) Một công ty nông sản có công suất chế biến không quá 180 tấn nguyên liệu một tháng. Nếu công ty chế biến $x$ tấn nguyên liệu trong một tháng $1\\le x\\le 180$ thì chi phí sản xuất và doanh thu lần lượt là $C(x)=0,002x^3+30x+20$ triệu đồng và $R(x)=90x$ triệu đồng. Lợi nhuận lớn nhất mà công ty đạt được trong một tháng là bao nhiêu triệu đồng?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"3980","explanation":"","hint":"Bước 1: Thiết lập hàm số lợi nhuận \\(L(x)\\) Hàm số lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi tổng chi phí sản xuất:\\[L(x)=R(x)-C(x)=90x-\\left(0,002x^{3}+30x+20\\right)\\]\\[\\Rightarrow L(x)=-0,002x^{3}+\\dots \\dots x-20\\text{\\ (triệu đồng)}\\]Miền khảo sát của hàm số lợi nhuận là đoạn: \\(1 \\leq x \\leq \\ldots\\ldots\\) Bước 2: Tìm điểm cực trị bằng phương pháp đạo hàm Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=-0,006x^{2}+\\dots \\dots \\]Giải phương trình đạo hàm \\(L'(x) = 0\\): \\[-0,006x^{2}+60=0\\Rightarrow x^{2}=10000\\Rightarrow \\begin{cases}x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ x=-100\\text{\\ (loại)}\\end{cases}\\]Bước 3: Tính mức lợi nhuận lớn nhất Lập bảng biến thiên trên đoạn \\([1; 180]\\), ta thấy hàm số \\(L(x)\\) đồng biến trên khoảng \\((1; \\ldots\\ldots)\\) và nghịch biến trên khoảng \\((\\ldots\\ldots; 180)\\).Do đó, lợi nhuận của công ty đạt giá trị cao nhất tại điểm cực đại \\(x = \\ldots\\ldots\\)Thay giá trị này vào hàm số \\(L(x)\\), mức lợi nhuận lớn nhất thu được là:\\[L(\\dots \\dots )=-0,002\\cdot (\\dots \\dots )^{3}+60\\cdot (\\dots \\dots )-20=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":57,"qType":"3","qText":"Câu 57. (Chuyên Lê Hồng Phong - HCM 2026) Một công ty dự định sản xuất không quá 600 sản phẩm. Nếu công ty sản xuất $x$ sản phẩm ($1\\le x\\le 600$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=0,001x^3-1,999x^2+1006x+250$ đơn vị nghìn đồng, trong khi chi phí sản xuất bình quân cho mỗi sản phẩm là $G(x)=0,001x+\\frac{250}{x}+1$ nghìn đồng. Ngoài ra, công ty còn phải nộp thuế bổ sung cho mỗi sản phẩm được bán ra là 5 nghìn đồng. Khoản thuế này được gọi là thuế phụ thu. Công ty cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"333","explanation":"","hint":"Bước 1: Thiết lập hàm tổng chi phí sản xuất \\(C(x)\\) Chi phí sản xuất bình quân cho một sản phẩm là \\(G(x) = 0,001x + \\frac{250}{x} + 1\\) (nghìn đồng), kết hợp với thuế phụ thu \\[5\\] nghìn đồng trên mỗi sản phẩm bán ra.Tổng chi phí thực tế hằng tuần của công ty khi sản xuất \\[x\\] sản phẩm là: \\[C(x)=x\\times G(x)+5x=x\\left(0,001x+\\frac{250}{x}+1\\right)+5x\\]\\[C(x)=0,001x^{2}+250+x+5x=0,001x^{2}+\\dots \\dots \\dots x+250\\text{\\ (nghìn đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Lợi nhuận thu được khi kinh doanh hết \\[x\\] sản phẩm là hiệu giữa doanh thu \\(F(x)\\) và tổng chi phí \\(C(x)\\): \\[P(x)=F(x)-C(x)\\]\\[P(x)=(0,001x^{3}-1,999x^{2}+1006x+250)-(0,001x^{2}+6x+250)\\]\\[P(x)=0,001x^{3}-\\dots \\dots \\dots x^{2}+\\dots \\dots \\dots x\\quad (\\text{với }1\\le x\\le 600)\\]Bước 3: Tìm số lượng sản phẩm \\[x\\] để lợi nhuận lớn nhất Tính đạo hàm của hàm số lợi nhuận: \\[P^{\\prime }(x)=0,003x^{2}-\\dots \\dots \\dots x+1000\\]Giải phương trình đạo hàm \\(P'(x) = 0\\) trên miền đang xét: \\[0,003x^{2}-4x+1000=0\\Leftrightarrow 3x^{2}-4000x+1000000=0\\Leftrightarrow \\left[\\begin{aligned}&x=1000\\quad (\\text{loại vì không thuộc }[1;600])\\\\ &x=\\frac{1000}{3}\\approx 333,33\\end{aligned}\\right.\\]Xét dấu đạo hàm \\(P'(x)\\), ta thấy hàm số \\(P(x)\\) đạt giá trị lớn nhất tại điểm \\(x = \\frac{1000}{3}\\). Do số sản phẩm phải là một số nguyên dương, ta thực hiện so sánh giá trị lợi nhuận tại hai số nguyên lân cận gần điểm cực đại nhất:Tại \\(x = 333\\): \\(P(333) = 0,001 \\cdot 333^3 - 2 \\cdot 333^2 + 1000 \\cdot 333 = \\ldots\\ldots\\ldots \\text{ (nghìn đồng)}\\)Tại \\(x = 334\\): \\(P(334) = 0,001 \\cdot 334^3 - 2 \\cdot 334^2 + 1000 \\cdot 334 = \\ldots\\ldots\\ldots \\text{ (nghìn đồng)}\\) So sánh thấy \\(P(333) > P(334)\\). \\[\\Rightarrow \\] Vậy công ty cần sản xuất 333 sản phẩm để lợi nhuận lớn nhất. "},{"originalNum":58,"qType":"3","qText":"Câu 58. (THPT Nguyễn Du - HCM 2026) Một cửa hàng bán khăn tắm với giá 50 nghìn đồng mỗi chiếc. Với mức giá này, mỗi tháng bán được 1000 chiếc. Nếu giảm giá bán đi 1 nghìn đồng mỗi chiếc thì số lượng bán ra tăng thêm 100 chiếc. Giá nhập kho mỗi chiếc khăn là 30 nghìn đồng. Hỏi cửa hàng phải định giá bán mỗi chiếc khăn là bao nhiêu nghìn đồng để lợi nhuận trong tháng lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"45","explanation":"","hint":"Bước 1: Thiết lập biểu thức giá bán và số lượng khăn tắm bán ra Gọi \\[x\\] (nghìn đồng) là mức giảm giá bán của mỗi chiếc khăn tắm (\\(0 \\le x \\le 20\\)).Khi đó, giá bán mới của một chiếc khăn tắm là:\\[P(x)=50-x\\text{\\ (nghìn đồng/chiếc)}\\]Vì cứ giảm giá \\[1\\] nghìn đồng thì số lượng bán ra tăng thêm \\[100\\] chiếc, nên tổng số lượng khăn tắm bán được trong một tháng là: \\[N(x)=1000+100x\\text{\\ (chiếc)}\\]Bước 2: Thiết lập hàm số tổng lợi nhuận hàng tháng \\(L(x)\\) Giá nhập kho mỗi chiếc khăn là \\[30\\] nghìn đồng, suy ra lợi nhuận trên từng chiếc khăn bán ra là:\\[P(x)-30=(50-x)-30=\\dots \\dots -x\\text{\\ (nghìn đồng/chiếc)}\\]Hàm tổng lợi nhuận hàng tháng thu được là tích của số lượng khăn và lợi nhuận trên mỗi chiếc: \\[L(x)=N(x)\\cdot (20-x)=(1000+100x)(20-x)\\]\\[L(x)=-100x^{2}+\\dots \\dots \\cdot x+20000\\text{\\ (nghìn đồng)}\\]Bước 3: Xác định định giá bán để đạt lợi nhuận lớn nhất Hàm lợi nhuận \\(L(x) = -100x^2 + 1000x + 20000\\) là một hàm số bậc hai có hệ số \\(a = -100 < 0\\), đồ thị là một parabol quay bề lõm xuống dưới.Do đó, hàm số đạt giá trị lớn nhất tại hoành độ đỉnh của parabol:\\[x=-\\frac{b}{2a}=-\\frac{1000}{2\\cdot (-100)}=\\dots \\dots \\]Thỏa mãn điều kiện bài toán, suy ra mức giảm giá tối ưu là \\[5\\] nghìn đồng.Định giá bán mới của mỗi chiếc khăn để thu về lợi nhuận tối đa là: \\[P=50-\\dots \\dots =\\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":59,"qType":"3","qText":"Câu 59. (THPT An Phước - Khánh Hòa 2026)\nMột khách sạn công nghệ cao có 50 phòng cho thuê. Nếu đặt giá thuê mỗi phòng là 2 triệu đồng/ngày thì toàn bộ các phòng đều được thuê hết. Cứ mỗi lần tăng giá thuê thêm 100 nghìn đồng/ngày thì sẽ có thêm 1 phòng bị bỏ trống. Chi phí vận hành, dọn dẹp cho mỗi phòng được thuê là 200 nghìn đồng/ngày. Để lợi nhuận trong ngày từ việc cho thuê phòng đạt từ 115 triệu đồng trở lên, khách sạn có thể thiết lập mức giá cho thuê cao nhất là bao nhiêu triệu đồng/ngày?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"3.8","explanation":"","hint":"Bước 1: Thiết lập các đại lượng thay đổi theo số lần tăng giá Gọi \\[x\\] là số lần tăng giá thuê thêm \\[100\\] nghìn đồng/ngày (\\(x \\ge 0\\)).Quy đổi đơn vị giá thuê ban đầu: \\(2 \\text{ triệu đồng} = 2000 \\text{ nghìn đồng}\\).Mức giá thuê mới của mỗi phòng sau khi tăng là:\\[2000+\\dots \\dots \\cdot x\\text{\\ (nghìn đồng/ngày)}\\]Do cứ tăng \\[100\\] nghìn đồng thì có thêm \\[1\\] phòng bỏ trống, số phòng được thuê thực tế là: \\[50-\\dots \\dots \\text{\\ (phòng)}\\]Bước 2: Lập bất phương trình biểu diễn điều kiện lợi nhuận ngày Lợi nhuận thu được từ mỗi phòng cho thuê (bằng giá thuê trừ đi chi phí vận hành \\[200\\] nghìn đồng) là:\\[(2000+100x)-200=\\dots \\dots +100x\\text{\\ (nghìn đồng)}\\]Hàm số biểu diễn tổng lợi nhuận thu được trong một ngày của khách sạn là:\\[L(x)=(50-x)(1800+100x)=100(50-x)(18+x)\\text{\\ (nghìn đồng)}\\]Đổi đơn vị mục tiêu lợi nhuận: \\(115 \\text{ triệu đồng} = \\dots\\dots \\text{ nghìn đồng}\\).Để lợi nhuận đạt từ 115 triệu đồng trở lên, ta có bất phương trình: \\[100(50-x)(18+x)\\ge 115000\\implies (50-x)(18+x)\\ge 1150\\]\\[\\implies -x^{2}+32x+900\\ge 1150\\implies x^{2}-32x+\\dots \\dots \\le 0\\]Bước 3: Giải bất phương trình và xác định mức giá cao nhất Xét phương trình bậc hai \\(x^2 - 32x + 250 = 0\\), ta tìm được hai nghiệm xấp xỉ là \\(x_1 \\approx 11,2\\) và \\(x_2 \\approx 20,8\\).Do đó, tập nghiệm của bất phương trình là:\\[11,2\\le x\\le 20,8\\]Để thiết lập mức giá cho thuê cao nhất, ta chọn số lần tăng giá lớn nhất là \\(x = \\dots\\dots\\)Khi đó, mức giá thuê cao nhất tương ứng là:\\[2000+100\\times \\dots \\dots =\\dots \\dots \\text{\\ (nghìn đồng/ngày)}\\]Đổi kết quả sang đơn vị triệu đồng/ngày: \\(\\dots\\dots \\text{ triệu đồng/ngày}\\). \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":60,"qType":"3","qText":"Câu 60. (THPT Nguyễn Thị Minh Khai - Hà Nội 2026)\nDoanh nghiệp A đang có kế hoạch sản xuất một mặt hàng phục vụ trong những sự kiện đặc biệt. Bộ phận phân tích thị trường báo cáo rằng: Trong 1 tháng, tổng chi phí để sản xuất và kinh doanh\n________________________________________\n\n\n$x$ sản phẩm là $V(x)=1,4x-500+\\frac{75000}{x}$, đơn vị triệu đồng, với $x$ là số nguyên dương. Biết rằng giá bán ra của một sản phẩm là $1,1$ triệu đồng. Hỏi trong 1 tháng sản xuất và kinh doanh như trên, doanh nghiệp A thu được số tiền lợi nhuận nhiều nhất là bao nhiêu triệu đồng, biết rằng trong tháng đó doanh nghiệp bán hết được số sản phẩm sản xuất ra?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"200","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng doanh thu \\(R(x)\\) và hàm số lợi nhuận \\(L(x)\\) Vì giá bán của một sản phẩm là \\(1,1\\text{ triệu đồng}\\), tổng doanh thu khi doanh nghiệp bán hết \\[x\\] sản phẩm trong tháng là:\\[R(x)=\\dots \\dots \\dots \\dots \\text{\\ (triệu đồng)}\\]Hàm số lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi tổng chi phí sản xuất và kinh doanh: \\[L(x)=R(x)-V(x)=1,1x-\\left(1,4x-500+\\frac{75000}{x}\\right)\\]\\[\\Rightarrow L(x)=-0,3x+\\dots \\dots -\\frac{75000}{x}\\text{\\ (triệu đồng)}\\]Bước 2: Tìm điểm tối ưu bằng bất đẳng thức Cauchy (AM-GM) hoặc đạo hàm Để tìm lợi nhuận nhiều nhất, ta xét biểu thức lợi nhuận viết lại dưới dạng:\\[L(x)=500-\\left(0,3x+\\frac{75000}{x}\\right)\\]Áp dụng bất đẳng thức Cauchy cho hai số dương \\(0,3x\\) và \\[\\frac{75000}{x}\\], ta có:\\[0,3x+\\frac{75000}{x}\\ge 2\\sqrt{0,3x\\cdot \\frac{75000}{x}}=2\\sqrt{\\dots \\dots \\dots \\dots }=\\dots \\dots \\]Do đó, mức lợi nhuận lớn nhất đạt được là: \\[L_{max}=500-\\dots \\dots =\\dots \\dots \\text{\\ (triệu đồng)}\\]Bước 3: Xác định số lượng sản phẩm cần sản xuất và kết luận Dấu \"=\" xảy ra khi và chỉ khi hai số hạng bằng nhau:\\[0,3x=\\frac{75000}{x}\\Rightarrow x^{2}=250000\\Rightarrow x=\\dots \\dots \\text{\\ (sản phẩm)}\\]Vậy số tiền lợi nhuận nhiều nhất doanh nghiệp có thể thu được trong một tháng là \\(\\ldots\\ldots\\) triệu đồng.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":61,"qType":"3","qText":"Câu 61: (Cụm Chuyên môn 8 - Cà Mau 2026) Một xí nghiệp sản xuất và tiêu thụ một loại sản phẩm. Giả sử hàm giá và hàm chi phí của loại sản phẩm này lần lượt là $p(x)=48-x$ triệu đồng và $C(x)=x^2+6x+20$ triệu đồng, trong đó $x$, $1\\le x\\le 20$, là số lượng sản phẩm được sản xuất. Hãy tính lợi nhuận tối đa của xí nghiệp, biết rằng mỗi sản phẩm bán ra phải chịu thêm mức thuế là $2$ triệu đồng.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"180","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng doanh thu \\(R(x)\\) Xí nghiệp bán được \\[x\\] sản phẩm với giá bán mỗi sản phẩm cho bởi hàm \\(p(x) = 48 - x\\) (triệu đồng).Hàm số biểu thị tổng doanh thu thu được là: \\[R(x)=x\\times p(x)=x(48-x)=\\dots \\dots \\dots x-x^{2}\\text{\\ (triệu đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Tổng chi phí thực tế của xí nghiệp bao gồm chi phí sản xuất \\(C(x) = x^2 + 6x + 20\\) và chi phí thuế bổ sung (\\[2\\] triệu đồng trên mỗi sản phẩm bán ra):\\[C_{\\text{tổng}}(x)=(x^{2}+6x+20)+2x=x^{2}+\\dots \\dots \\dots x+20\\]Hàm số biểu thị lợi nhuận thu được là hiệu giữa doanh thu \\(R(x)\\) và tổng chi phí: \\[P(x)=R(x)-C_{\\text{tổng}}(x)=(48x-x^{2})-(x^{2}+8x+20)\\]\\[P(x)=-2x^{2}+\\dots \\dots \\dots x-20\\quad (\\text{với }1\\le x\\le 20)\\]Bước 3: Tìm số lượng sản phẩm \\[x\\] để lợi nhuận lớn nhất Hàm số lợi nhuận \\(P(x)\\) thu được là một hàm số bậc hai có đồ thị là một parabol quay bề lõm xuống dưới (\\(a = -2 < 0\\)). Hàm số đạt giá trị lớn nhất tại đỉnh parabol: \\[x=-\\frac{b}{2a}=-\\frac{40}{2\\times (-2)}=\\dots \\dots \\dots \\text{\\ (sản phẩm)}\\]Bước 4: Tính mức lợi nhuận tối đa đạt được Thay số lượng sản phẩm tối ưu \\(x = 10\\) vào hàm số lợi nhuận \\(P(x)\\), ta thu được mức lợi nhuận lớn nhất là: \\[P(10)=-2\\times (10)^{2}+40\\times 10-20=\\dots \\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 180 "},{"originalNum":62,"qType":"3","qText":"Câu 62: (THPT Trần Phú - HCM 2026) Một doanh nghiệp tư nhân dự định sản xuất một loại linh kiện điện tử với số lượng không quá $300$ sản phẩm. Nếu doanh nghiệp bán được $x$ sản phẩm thì tổng doanh thu về, đơn vị đồng, được tính theo công thức $f(x)=x^3-1200x^2+150000x+50000$. Chi phí sản xuất bình quân cho mỗi sản phẩm, đơn vị đồng, được tính theo công thức\n$$C(x)=2000+x+\\frac{40000}{x}$$\nHỏi doanh nghiệp cần bán bao nhiêu sản phẩm để lợi nhuận thu về là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"67","explanation":"","hint":"Bước 1: Xác định hàm tổng chi phí sản xuất \\(TC(x)\\) Vì chi phí sản xuất bình quân cho mỗi sản phẩm là \\(C(x)\\), nên tổng chi phí sản xuất khi bán \\[x\\] sản phẩm (\\(1 \\leq x \\leq 300\\)) là: \\[TC(x)=x\\cdot C(x)=x\\cdot \\left(2000+x+\\frac{40000}{x}\\right)\\]\\[TC(x)=x^{2}+\\dots \\dots \\cdot x+40000\\text{\\ (đồng)}\\]Bước 2: Thiết lập hàm số lợi nhuận \\(L(x)\\) Lợi nhuận thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=f(x)-TC(x)=\\left(x^{3}-1200x^{2}+150000x+50000\\right)-\\left(x^{2}+2000x+40000\\right)\\]\\[L(x)=x^{3}-\\dots \\dots \\cdot x^{2}+148000x+\\dots \\dots \\text{\\ (đồng)}\\]Bước 3: Khảo sát hàm số để tìm số lượng sản phẩm mang lại lợi nhuận lớn nhất Đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=3x^{2}-\\dots \\dots \\cdot x+148000\\]Giải phương trình \\(L'(x) = 0\\) trên miền giá trị thực tế, ta thu được nghiệm xấp xỉ:\\[3x^{2}-2402x+148000=0\\Rightarrow x\\approx \\dots \\dots \\]Lập bảng biến thiên trên đoạn \\([1; 300]\\). Do số lượng sản phẩm là một số tự nhiên (\\(x \\in \\mathbb{N}\\)), ta so sánh giá trị lợi nhuận tại hai số nguyên gần điểm cực đại nhất:\\[L(67)=\\dots \\dots \\text{\\ (đồng)};\\quad L(68)=4835008\\text{\\ (đồng)}\\]So sánh các giá trị, ta thấy lợi nhuận lớn nhất đạt được khi bán ra số lượng sản phẩm là: \\(\\ldots\\ldots\\) \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":63,"qType":"3","qText":"Câu 63: (Sở Vĩnh Long 2026) Một nghệ nhân làm gốm thủ công tại địa phương đang sản xuất một dòng bình hoa gốm đặc biệt. Mỗi ngày, nghệ nhân này có thể sản xuất $x$ chiếc bình hoa, với $1\\le x\\le 18$, $x∈\\mathbb{N}$. Tổng chi phí sản xuất $x$ bình hoa trong một ngày, tính bằng nghìn đồng, là $C(x)=x^3-40x^2+500x$. Giả sử toàn bộ số bình hoa sản xuất ra trong ngày đều được các cửa hàng lưu niệm thu mua hết với giá cố định $280$ nghìn đồng/bình. Để đạt được lợi nhuận cao nhất, nghệ nhân này nên sản xuất bao nhiêu bình hoa mỗi ngày?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"18","explanation":"","hint":"Open sidebarNew threadManage AI Mode shared public linksSee your Search historyPersonalizationSettingsNew threadSearch threadsClose sidebarManage AI Mode shared public linksSee your Search historyPersonalizationNotebooksAdd notebookRecentTính Tiền Tích Lũy 6 ThángMore optionsTính Tiền Tích Lũy 6 ThángBước 1: Tính số tiền tích lũy sau 6 tháng đầu (T_{1})\n\tKỳ hạn gửi là 1 quý (3 tháng), lãi suất: r=3%/quý=⋯…\n\tSố quý trong 6 tháng đầu:\nn_{1}=\\frac{6}{3}=\\ldots \\ldots \\text{\\ (quý)}\n\tSố tiền cả vốn lẫn lãi sau 6 tháng đầu là:\nT_{1}=100\\times {\\left(1+\\ldots \\ldots \\right)}^{\\ldots \\ldots }=\\ldots \\ldots \\text{\\ (triệu\\ đồng)}\n\tBước 2: Xác định số vốn gửi cho 6 tháng tiếp theo\nSau đúng 6 tháng, anh Nam gửi thêm 100 triệu đ
