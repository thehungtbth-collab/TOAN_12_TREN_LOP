    <script>
        
        const quizData = [{"title":"Chuyên đề 3. Quần thể, y tế, môi trường","questions":[{"originalNum":1,"qType":"3","qText":"Câu 1. (THPT Lê Thánh Tông - HCM 2025) Giả sử số lượng của một quần thể nấm men tại môi trường nuôi cấy trong phòng thí nghiệm được mô hình hóa bằng hàm số \n$$P(t)=\\frac{a}{b+e^{-0,75t}};$$\ntrong đó: $a,b$ là các số thực và thời gian $t$ được tính bằng giờ. Tại thời điểm ban đầu $t=0$, quần thể có 20 tế bào và không ngừng tăng lên với tốc độ 12 tế bào/giờ. Số lượng của quần thể này tại thời điểm $t=8$ giờ là bao nhiêu tế bào (làm tròn đến hàng đơn vị)?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"99","explanation":"","hint":"Bước 1: Sử dụng điều kiện thời điểm ban đầu (\\(t = 0\\)) để lập phương trình thứ nhất Tại thời điểm ban đầu \\(t = 0\\), quần thể có \\[20\\] tế bào: \\[P(0)=\\frac{a}{b+e^{0}}=\\frac{a}{b+\\dots \\dots }=20\\implies a=20(b+\\dots \\dots )\\quad (1)\\]Bước 2: Sử dụng điều kiện tốc độ tăng trưởng để tìm các hệ số \\[a\\] và \\[b\\] Tốc độ tăng trưởng của quần thể tại thời điểm \\[t\\] chính là đạo hàm \\(P'(t)\\):\\[P^{\\prime }(t)=\\frac{-a\\cdot \\left(-0,75e^{-0,75t}\\right)}{\\left(b+e^{-0,75t}\\right)^{2}}=\\frac{0,75a\\cdot e^{-0,75t}}{\\left(b+e^{-0,75t}\\right)^{2}}\\]Tại thời điểm \\(t = 0\\), tốc độ tăng trưởng là \\[12\\] tế bào/giờ:\\[P^{\\prime }(0)=\\frac{0,75a}{(b+\\dots \\dots )^{2}}=12\\quad (2)\\]Thay \\((1)\\) vào \\((2)\\), ta được phương trình ẩn \\[b\\]:\\[\\frac{0,75\\cdot 20(b+1)}{(b+1)^{2}}=12\\implies \\frac{15}{b+1}=12\\implies b+1=\\dots \\dots \\implies b=\\dots \\dots \\]Thay giá trị \\[b\\] vừa tìm được vào \\((1)\\), ta được: \\(a = \\dots\\dots\\) Bước 3: Tính số lượng quần thể tại thời điểm \\(t = 8\\) giờ Với các hệ số \\(a, b\\) tìm được, hàm số mô hình hóa quần thể có dạng:\\[P(t)=\\frac{\\dots \\dots }{\\dots \\dots +e^{-0,75t}}\\]Số lượng tế bào của quần thể tại thời điểm \\(t = 8\\) giờ là: \\[P(8)=\\frac{\\dots \\dots }{\\dots \\dots +e^{-0,75\\cdot 8}}\\approx \\dots \\dots \\text{\\ (tế bào)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":2,"qType":"3","qText":"Câu 2. (Sở Vũng Tàu 2025) Giả sử dân số Việt Nam được dự báo theo mô hình logistic, giai đoạn từ năm 2023 đến hết năm 2035 là hàm số: \n$$P(t)=\\frac{120}{1+0,2e^{-0,06t}}$$\n(triệu người), trong đó $t$ là số năm tính từ đầu năm 2023. Chi phí an sinh xã hội bình quân theo đầu người được mô hình hoá bởi hàm số \n$$C(t)=25-20e^{-0,05t}$$\n(triệu đồng/người/năm). Tính tốc độ thay đổi của tổng chi phí an sinh xã hội toàn quốc (nghìn tỷ đồng/năm) vào đầu năm 2030. (làm tròn kết quả đến hàng đơn vị)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"83","explanation":"","hint":"Bước 1: Xác định số năm \\[t\\] và công thức tổng chi phíĐầu năm 2030 ứng với:\\[t=2030-2023=\\dots \\dots \\]Tổng chi phí an sinh xã hội toàn quốc \\(E(t)\\) (đơn vị: nghìn tỷ đồng/năm) bằng tích của dân số \\(P(t)\\) và chi phí bình quân \\(C(t)\\):\\[E(t)=P(t)\\cdot C(t)=\\frac{120}{1+0,2e^{-0,06t}}\\cdot \\left(\\dots \\dots \\dots \\dots \\right)\\]Bước 2: Tìm biểu thức đạo hàm \\(E'(t)\\)Áp dụng quy tắc đạo hàm của tích \\((u \\cdot v)' = u'v + uv'\\), ta có:Đạo hàm của hàm dân số \\(P(t)\\):\\[P^{\\prime }(t)=\\frac{120\\cdot 0,2\\cdot (-0,06)\\cdot \\left(-e^{-0,06t}\\right)}{\\left(1+0,2e^{-0,06t}\\right)^{2}}=\\frac{\\dots \\dots e^{-0,06t}}{\\left(1+0,2e^{-0,06t}\\right)^{2}}\\]Đạo hàm của hàm chi phí bình quân \\(C(t)\\):\\[C^{\\prime }(t)=-20\\cdot (-0,05)\\cdot e^{-0,05t}=\\dots \\dots e^{-0,05t}\\]Khi đó, tốc độ thay đổi của tổng chi phí là hàm số: \\(E'(t) = P'(t) \\cdot C(t) + P(t) \\cdot C'(t)\\)Bước 3: Tính tốc độ thay đổi vào đầu năm 2030Thay giá trị \\[t\\] tìm được ở Bước 1 vào biểu thức đạo hàm:\\(P(7) \\approx 106,06\\)\\(P'(7) \\approx 0,74\\)\\(C(7) \\approx \\ldots\\ldots\\)\\(C'(7) \\approx 0,70\\)Tính toán giá trị của đạo hàm tại thời điểm cần tìm:\\[E^{\\prime }(7)=P^{\\prime }(7)\\cdot C(7)+P(7)\\cdot C^{\\prime }(7)\\approx 0,74\\cdot \\dots \\dots +106,06\\cdot 0,70\\approx \\dots \\dots \\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\)"},{"originalNum":3,"qType":"3","qText":"Câu 3. (Sở Hà Tĩnh 2025) Giả sử tỷ lệ sinh của Tỉnh $A$ tuân theo quy luật logistic được mô hình hóa bằng hàm số \n$$f(t)=\\frac{200}{1+4e^{-t}};t\\ge 0,t∈ \\mathbb{N},$$\ntrong đó thời gian $t$ được tính bằng tháng. Khi đó đạo hàm $f'(t)$ sẽ biểu thị tốc độ tăng dân số của tỉnh $A$. Hỏi sau bao nhiêu tháng tốc độ tăng trưởng của dân số tỉnh $A$ là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1.39","explanation":"","hint":"Bước 1: Tính đạo hàm bậc nhất \\(f'(t)\\) (Tốc độ tăng dân số)Ta có hàm số dân số:\\[f(t)=\\frac{200}{1+4e^{-t}}\\]Áp dụng công thức đạo hàm hàm hợp \\(\\left(\\frac{1}{u}\\right)' = -\\frac{u'}{u^2}\\), tốc độ tăng dân số \\(f'(t)\\) là:\\[f^{\\prime }(t)=200\\times \\frac{-(1+4e^{-t})^{\\prime }}{(1+4e^{-t})^{2}}=200\\times \\frac{\\dots \\dots \\dots }{(1+4e^{-t})^{2}}=\\frac{\\dots \\dots \\dots }{(1+4e^{-t})^{2}}\\]Bước 2: Tìm thời điểm để tốc độ tăng trưởng \\(f'(t)\\) đạt giá trị lớn nhấtCách 1: Sử dụng bất đẳng thức Cauchy (Đánh giá mẫu số)Biến đổi \\(f'(t)\\) bằng cách chia cả tử và mẫu cho \\[e^{-t}\\]:\\[f^{\\prime }(t)=\\frac{800}{\\frac{(1+4e^{-t})^{2}}{e^{-t}}}=\\frac{800}{\\left(\\frac{1+4e^{-t}}{e^{-t/2}}\\right)^{2}}=\\frac{800}{(e^{t/2}+4e^{-t/2})^{2}}\\]Để \\(f'(t)\\) đạt giá trị lớn nhất thì mẫu số \\((e^{t/2} + 4e^{-t/2})^2\\) phải \\(\\ldots\\ldots\\ldots\\)Áp dụng bất đẳng thức Cauchy cho hai số dương \\[e^{t/2}\\] và \\[4e^{-t/2}\\]:\\[e^{t/2}+4e^{-t/2}\\ge 2\\sqrt{e^{t/2}\\times 4e^{-t/2}}=\\dots \\dots \\dots \\]Dấu \"=\" xảy ra khi và chỉ khi:\\[e^{t/2}=4e^{-t/2}\\Rightarrow e^{t}=\\dots \\dots \\dots \\Rightarrow t=\\ln (\\dots \\dots \\dots )\\]Cách 2: Sử dụng đạo hàm bậc hai \\(f''(t)\\)Để \\(f'(t)\\) đạt cực đại thì đạo hàm bậc hai của hàm số phải bằng 0:\\[f^{\\prime \\prime }(t)=\\frac{-800e^{-t}(1-\\dots \\dots \\dots )}{(1+4e^{-t})^{3}}\\]\\[f^{\\prime \\prime }(t)=0\\Leftrightarrow 1-\\dots \\dots \\dots =0\\Leftrightarrow e^{t}=\\dots \\dots \\dots \\Leftrightarrow t=\\ln (\\dots \\dots \\dots )\\]Bước 3: Tính giá trị xấp xỉ của thời gian \\[t\\]Giá trị xấp xỉ của \\[t\\]:\\[t=\\ln (4)\\approx \\dots \\dots \\dots \\text{\\ (tháng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: \\(\\ldots\\ldots\\ldots\\)"},{"originalNum":4,"qType":"3","qText":"Câu 4. (THPT Cẩm Xuyên - Hà Tĩnh 2025) Giả sử doanh số (tính bằng số sản phẩm) của một sản phẩm mới (trong vòng một số năm nhất định) tuân theo quy luật logistic được mô hình hoá bằng hàm số \n$$f(t)=\\frac{5000}{1+5e^{-t}},t\\ge 0$$\ntrong đó thời gian $t$ được tính bằng năm, kể từ khi phát hành sản phẩm mới. Khi đó, đạo hàm $f'(t)$ sẽ biểu thị tốc độ bán hàng. Hỏi sau khi phát hành thì tốc độ bán hàng đạt lớn nhất bằng bao nhiêu?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1250","explanation":"","hint":"Bước 1: Tính đạo hàm \\(f'(t)\\) biểu thị tốc độ bán hàngTa có hàm số doanh số: \\(f(t) = \\frac{5000}{1 + 5e^{-t}}\\)Tốc độ bán hàng tại thời điểm \\[t\\] là:\\[f^{\\prime }(t)=\\frac{5000\\times \\left(1+5e^{-t}\\right)^{\\prime }}{-\\left(1+5e^{-t}\\right)^{2}}=\\frac{\\dots \\dots \\cdot e^{-t}}{\\left(1+5e^{-t}\\right)^{2}}\\]Bước 2: Tìm giá trị lớn nhất của \\(f'(t)\\) bằng phương pháp đổi biếnĐặt \\(x = e^{-t}\\). Vì \\(t \\geq 0\\) nên điều kiện của \\[x\\] là: \\(x \\in (\\ldots\\ldots; \\ldots\\ldots]\\)Khi đó, tốc độ bán hàng được biểu diễn theo biến \\[x\\] là hàm số:\\[g(x)=\\frac{25000x}{(1+5x)^{2}}\\]Bước 3: Áp dụng bất đẳng thức hoặc khảo sát hàm số để tìm GTLNCách 1: Áp dụng bất đẳng thức Cô-si (AM-GM) cho mẫu số dưới dạng:\\[(1+5x)^{2}\\ge \\left(2\\sqrt{1\\cdot 5x}\\right)^{2}=\\dots \\dots x\\]Suy ra:\\[g(x)\\le \\frac{25000x}{\\dots \\dots x}=\\dots \\dots \\]Dấu \"\\[=\\]\" xảy ra khi \\(1 = 5x \\Leftrightarrow x = \\ldots\\ldots\\) (thỏa mãn điều kiện).Khi đó \\(e^{-t} = \\frac{1}{5} \\Leftrightarrow t = \\ln(5) \\approx 1{,}61\\) (năm).\\[\\Rightarrow \\] Kết luận: Tốc độ bán hàng đạt lớn nhất bằng: \\(\\ldots\\ldots\\)"},{"originalNum":5,"qType":"3","qText":"Câu 5. (THPT Cẩm Xuyên - Hà Tĩnh 2025) Sau khi phát hiện ra dịch bệnh vi rút Đậu mùa Khỉ, các chuyên gia y tế ước tính số người nhiễm bệnh kể từ khi xuất hiện bệnh nhân đầu tiên đến ngày thứ $x$ là $f(x)=-x^3+18x^2$. Ta xem $f'(x)$ là tốc độ truyền bệnh tại thời điểm $x$. Tốc độ truyền bệnh sẽ lớn nhất vào ngày thứ bao nhiêu?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"6","explanation":"","hint":"Bước 1: Xác định hàm số tính tốc độ truyền bệnh Theo đề bài, tốc độ truyền bệnh tại thời điểm \\[x\\] là đạo hàm bậc nhất của hàm số số người nhiễm bệnh \\(f(x) = -x^3 + 18x^2\\).Ta có hàm số tốc độ truyền bệnh \\(g(x) = f'(x) = \\ldots\\ldots\\ldots\\)\\(\\Rightarrow g(x) = \\mathbf{-3x^2 + 36x}\\) Bước 2: Tìm thời điểm tốc độ truyền bệnh lớn nhất Để tốc độ truyền bệnh lớn nhất, ta cần tìm giá trị lớn nhất (Max) của hàm số \\(g(x)\\) trên khoảng thời gian xét đến.Lấy đạo hàm bậc hai của hàm số gốc (hoặc đạo hàm bậc nhất của hàm tốc độ):\\(g'(x) = f''(x) = \\ldots\\ldots\\ldots\\)\\(\\Rightarrow g'(x) = \\mathbf{-6x + 36}\\)Giải phương trình \\(g'(x) = 0\\):\\(-6x + 36 = 0 \\Leftrightarrow x = \\ldots\\ldots\\)\\(\\Leftrightarrow x = \\mathbf{6}\\) Bước 3: Lập bảng biến thiên hoặc đánh giá đỉnh Parabol Vì hàm số \\(g(x) = -3x^2 + 36x\\) là một hàm bậc hai có hệ số \\(a = -3 < 0\\), nên đồ thị là một Parabol có bề lõm quay xuống dưới.Do đó, hàm số đạt giá trị lớn nhất tại đỉnh của Parabol, tức là tại \\(x = \\mathbf{6}\\). \\[\\Rightarrow \\] Kết luận: Tốc độ truyền bệnh sẽ lớn nhất vào ngày thứ 6."},{"originalNum":7,"qType":"3","qText":"Câu 7. (THPT Lương Tài 2 - Bắc Ninh 2025) Nồng độ $C$ của một loại hóa chất trong máu sau $t$ giờ tiêm vào cơ thể được cho bởi công thức \n$$C(t)=\\frac{4t}{64+t^3}$$\nvới $t\\ge 0$. Sau khoảng bao nhiêu giờ tiêm thì nồng độ của hóa chất trong máu là cao nhất? (kết quả làm tròn tới hàng phần trăm)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"3.17","explanation":"","hint":"Bước 1: Tính đạo hàm của hàm số nồng độ \\(C(t)\\) Hàm số nồng độ hóa chất trong máu:\\[C(t)=\\frac{4t}{64+t^{3}}\\quad (t\\ge 0)\\]Áp dụng quy tắc tính đạo hàm của một thương \\[\\left(\\frac{u}{v}\\right)^{\\prime }\\], ta có: \\[C^{\\prime }(t)=\\frac{(4t)^{\\prime }\\cdot (64+t^{3})-4t\\cdot (64+t^{3})^{\\prime }}{(64+t^{3})^{2}}\\]\\[C^{\\prime }(t)=\\frac{4(64+t^{3})-4t\\cdot (\\dots \\dots )}{(64+t^{3})^{2}}=\\frac{256-\\dots \\dots }{(64+t^{3})^{2}}\\]Bước 2: Tìm nghiệm của phương trình \\(C'(t) = 0\\) Xét phương trình \\(C'(t) = 0\\) trên khoảng \\((0; +\\infty)\\):\\[256-\\dots \\dots =0\\implies t^{3}=\\dots \\dots \\implies t=\\sqrt[3]{\\dots \\dots }\\]Tính giá trị xấp xỉ của \\[t\\] (làm tròn đến hàng phần trăm): \\[t\\approx \\dots \\dots \\text{\\ (giờ)}\\]Bước 3: Lập bảng biến thiên và kết luận thời điểm nồng độ cao nhất Khi qua điểm \\(t = \\sqrt[3]{32}\\), đạo hàm \\(C'(t)\\) đổi dấu từ dương sang âm, do đó hàm số đạt cực đại tại điểm này.Vậy sau khoảng \\(\\dots\\dots\\) giờ tiêm thì nồng độ của hóa chất trong máu đạt giá trị cao nhất. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":8,"qType":"3","qText":"Câu 8. (THPT Lương Tài 2 - Bắc Ninh 2025) Trong khoảng thời gian từ ngày 01/01/2024 đến hết ngày 30/12/2024 nhóm nghiên cứu đã quan sát sự phát triển của một quần thể sinh vật $X$. Kết quả nghiên cứu chỉ ra rằng, tại ngày thứ $t$ của năm 2024 (tính từ ngày 01/01/2024) số cá thể sinh vật $X$ trong quần thể được ước lượng bởi hàm số $f(t)=-\\frac{1}{300}t^3+bt^2+ct+12000$ (con), $0 \\le t \\le 365$ và ngày 26/09/2024 là ngày có số lượng cá thể sinh vật $X$ nhiều nhất với 55740 con. Ngày 25/11/2024 số lượng cá thể sinh vật $X$ được ước lượng khoảng bao nhiêu nghìn con? (Kết quả làm tròn đến hàng phần chục).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"49.6","explanation":"","hint":"Bước 1: Xác định số ngày \\[t\\] ứng với ngày 26/09/2024 Vì năm 2024 là năm nhuận nên tháng 2 có 29 ngày.Tính từ ngày 01/01/2024 đến ngày 26/09/2024 có tổng cộng:\\[t=31+29+31+30+31+30+31+31+26=\\dots \\dots \\text{\\ (ngày)}\\]Theo giả thiết, tại ngày này quần thể đạt số lượng nhiều nhất bằng \\[55740\\] con, nghĩa là hàm số \\(f(t)\\) đạt cực đại tại điểm đó. Do đó ta có hệ điều kiện: \\[\\begin{cases}f(\\dots \\dots )=55740\\\\ f^{\\prime }(\\dots \\dots )=0\\end{cases}\\]Bước 2: Xác định các hệ số \\[b\\] và \\[c\\] Ta có biểu thức đạo hàm:\\[f^{\\prime }(t)=-\\frac{1}{100}t^{2}+\\dots \\dots t+c\\]Từ điều kiện \\(f'(\\ldots\\ldots) = 0\\), ta suy ra mối liên hệ:\\[-\\frac{1}{100}\\cdot (\\dots \\dots )^{2}+2b\\cdot (\\dots \\dots )+c=0\\Rightarrow c=729-\\dots \\dots b\\]Thay \\[c\\] vào phương trình \\(f(\\ldots\\ldots) = 55740\\), giải hệ phương trình ta tìm được:\\[b=\\dots \\dots ;\\quad c=\\dots \\dots \\]Như vậy, hàm số hoàn chỉnh là: \\(f(t) = -\\frac{1}{300}t^3 + \\ldots\\ldots t^2 + \\ldots\\ldots t + 12000\\) Bước 3: Tính số lượng cá thể sinh vật vào ngày 25/11/2024 Ngày 25/11/2024 ứng với ngày thứ:\\[t=31+29+31+30+31+30+31+31+30+31+25=\\dots \\dots \\text{\\ (ngày)}\\]Thay giá trị \\[t\\] này vào hàm số \\(f(t)\\), ta tính được số lượng cá thể:\\[f(\\dots \\dots )=-\\frac{1}{300}\\cdot (\\dots \\dots )^{3}+1,2\\cdot (\\dots \\dots )^{2}+81\\cdot (\\dots \\dots )+12000=\\dots \\dots \\text{\\ (con)}\\]Đổi sang đơn vị nghìn con và làm tròn đến hàng phần chục: \\(\\ldots\\ldots\\) nghìn con.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":9,"qType":"3","qText":"Câu 9. (THPT Lê Xoay - Vĩnh Phúc 2025) Giả sử chiều cao (tính bằng cm) của một giống cây trồng (trong vòng một số tháng nhất định) tuân theo quy luật logistic được mô hình hoá bằng hàm số\n$$f(t)=\\frac{200}{1+3e^{-t}},t \\ge 0$$\ntrong đó thời gian $t$ được tính bằng tháng kể từ khi hạt bắt đầu nảy mầm. Khi đó đạo hàm $f'(t)$ sẽ biểu thị tốc độ tăng chiều cao của giống cây đó. Biết rằng kể từ khi hạt giống bắt đầu nảy mầm thì sau $t$ tháng, tốc độ tăng chiều cao của cây là lớn nhất. Tính $t$ (làm tròn kết quả đến chữ số thập phân thứ nhất).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1.1","explanation":"","hint":"Bước 1: Tính đạo hàm bậc nhất \\(f'(t)\\) (Tốc độ tăng chiều cao) Ta có hàm số biểu thị chiều cao của cây:\\[f(t)=\\frac{200}{1+3e^{-t}}\\]Áp dụng công thức đạo hàm hàm hợp \\(\\left(\\frac{1}{u}\\right)' = -\\frac{u'}{u^2}\\), tốc độ tăng chiều cao \\(f'(t)\\) của cây là: \\[f^{\\prime }(t)=200\\times \\frac{-(1+3e^{-t})^{\\prime }}{(1+3e^{-t})^{2}}=200\\times \\frac{\\dots \\dots \\dots }{(1+3e^{-t})^{2}}=\\frac{\\dots \\dots \\dots }{(1+3e^{-t})^{2}}\\]Bước 2: Tìm thời điểm \\[t\\] để tốc độ tăng chiều cao đạt giá trị lớn nhất Sử dụng bất đẳng thức Cauchy để đánh giá:Biến đổi \\(f'(t)\\) bằng cách chia cả tử và mẫu cho \\[e^{-t}\\]:\\[f^{\\prime }(t)=\\frac{600}{\\frac{(1+3e^{-t})^{2}}{e^{-t}}}=\\frac{600}{\\left(\\frac{1+3e^{-t}}{e^{-t/2}}\\right)^{2}}=\\frac{600}{(e^{t/2}+3e^{-t/2})^{2}}\\]Để tốc độ tăng trưởng \\(f'(t)\\) đạt giá trị lớn nhất thì mẫu số \\((e^{t/2} + 3e^{-t/2})^2\\) phải nhỏ nhất, hay biểu thức \\((e^{t/2} + 3e^{-t/2})\\) phải đạt giá trị nhỏ nhất.Áp dụng bất đẳng thức Cauchy cho hai số dương \\[e^{t/2}\\] và \\[3e^{-t/2}\\]:\\[e^{t/2}+3e^{-t/2}\\ge 2\\sqrt{e^{t/2}\\times 3e^{-t/2}}=\\dots \\dots \\dots \\]Dấu \"=\" xảy ra khi và chỉ khi hai số bằng nhau: \\[e^{t/2}=3e^{-t/2}\\Rightarrow e^{t}=\\dots \\dots \\dots \\Rightarrow t=\\ln (\\dots \\dots \\dots )\\]Bước 3: Tính giá trị xấp xỉ của thời gian \\[t\\] Làm tròn kết quả đến chữ số thập phân thứ nhất:\\[t=\\ln (3)\\approx \\dots \\dots \\dots \\text{\\ (tháng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: \\(\\ldots\\ldots\\ldots\\) "},{"originalNum":10,"qType":"3","qText":"Câu 10. (Cụm Chương Mỹ - Thanh Oai 2025) Huyết áp là đại lượng để đo độ lớn của lực tác dụng lên thành mạch máu. Nó được đo bằng 2 chỉ số: huyết áp tâm thu (là áp lực của máu lên động mạch khi tim co bóp) và huyết áp tâm trương (là áp lực của máu lên thành động mạch khi tim giãn ra). Huyết áp khác nhau đáng kể giữa người này và người khác, nhưng huyết áp tiêu chuẩn là $120/80$, nó có nghĩa là huyết áp tâm thu là $120\\text{mmHg}$ và huyết áp tâm trương là $80\\text{mmHg}$. Giả sử rằng trái tim của một người đập 70 lần một phút, huyết áp riêng $P$ sau $t$ giây có thể được mô tả bằng hàm số $P(t)=100+20\\sin\\left(\\frac{7π}{3}t\\right)$. Trong thời gian từ 0 giây đến 1 giây, thời điểm $t=\\frac{a}{b}$ ($a,b ∈ \\mathbb{N}^*,\\frac{a}{b}$ tối giản) mà tại đó huyết áp bằng $80\\text{mmHg}$. Tính $2a-b$","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"4","explanation":"","hint":"Bước 1: Thiết lập phương trình lượng giác từ dữ kiện bài toán Huyết áp của người đó sau \\[t\\] giây được mô tả bởi hàm số: \\(P(t) = 100 + 20 \\sin\\left(\\frac{7\\pi}{3}t\\right)\\)Để huyết áp bằng \\(80\\text{ mmHg}\\), ta có phương trình: \\[100+20\\sin \\left(\\frac{7\\pi }{3}t\\right)=80\\Leftrightarrow \\sin \\left(\\frac{7\\pi }{3}t\\right)=\\dots \\dots \\]Bước 2: Giải phương trình lượng giác tìm nghiệm tổng quát Giải phương trình trên, ta được:\\[\\frac{7\\pi }{3}t=-\\frac{\\pi }{2}+k2\\pi \\quad (k\\in \\mathbb{Z})\\]Cô lập biến \\[t\\] theo \\[k\\]: \\[t=-\\frac{3}{14}+\\frac{\\dots \\dots \\cdot k}{7}\\quad (k\\in \\mathbb{Z})\\]Bước 3: Tìm giá trị \\[k\\] phù hợp với điều kiện thời gian và tính giá trị biểu thức Vì thời gian xét từ \\[0\\] giây đến \\[1\\] giây nên ta có điều kiện: \\(0 \\leq t \\leq 1\\)\\[0\\le -\\frac{3}{14}+\\frac{6k}{7}\\le 1\\Leftrightarrow \\frac{3}{12}\\le k\\le \\frac{\\dots \\dots }{12}\\]Do \\(k \\in \\mathbb{Z}\\) nên ta chọn được \\(k = \\ldots\\ldots\\)Thay \\[k\\] ngược lại vào công thức nghiệm, ta tìm được thời điểm:\\[t=\\frac{\\dots \\dots }{14}\\text{\\ (giây)}\\]Đối chiếu với dạng phân số tối giản \\(t = \\frac{a}{b}\\), ta xác định được: \\(a = \\ldots\\ldots\\) và \\(b = \\ldots\\ldots\\) \\[\\Rightarrow \\] Giá trị của biểu thức \\(2a - b = \\dots\\dots\\) "},{"originalNum":11,"qType":"3","qText":"Câu 11. (Sở Gia Lai 2025) Biết rằng tốc độ đánh máy trung bình $S$ (tính bằng từ trên phút) của một học viên lớn tuổi sau $t$ tuần (kể từ khi chưa biết đánh máy) được cho bởi một trong hai công thức sau $S(t)=\\frac{at^2+b}{ct^2+d}$ và $S(t)=\\frac{at^2+b}{ct+d}$ ($a,b,c,d ∈ ℝ;ac \\neq 0$). Ông A (một người lớn tuổi chưa biết đánh máy) sau 4 tuần đi học thì tốc độ đánh máy trung bình đạt 20 từ trên phút, sau 6 tuần đạt 30 từ trên phút. Em hãy dự đoán xem, sau khóa học 15 tuần thì tốc độ đánh máy trung bình của ông A là bao nhiêu từ trên phút.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"45","explanation":"","hint":"Bước 1: Lựa chọn công thức phù hợp và xác định hệ số ban đầu Vì tốc độ đánh máy của một người không thể tăng lên vô hạn theo thời gian, nên khi thời gian \\(t \\to +\\infty\\), tốc độ trung bình \\(S(t)\\) phải tiến tới một giới hạn hữu hạn. Do đó, ta loại công thức \\(S(t) = \\frac{at^2+b}{ct+d}\\) (vì giới hạn của hàm này bằng vô cực) và chọn công thức:\\[S(t)=\\frac{at^{2}+b}{ct^{2}+d}\\]Tại thời điểm bắt đầu khóa học khi chưa biết đánh máy (\\(t = 0\\)), tốc độ đánh máy trung bình bằng \\[0\\]:\\[S(0)=\\frac{b}{d}=0\\implies b=\\dots \\dots \\]\\(\\Rightarrow b = \\mathbf{0}\\)Khi đó, công thức rút gọn thành: \\(S(t) = \\frac{at^2}{ct^2+d}\\). Chia cả tử và mẫu cho \\[c\\] (với \\(c \\neq 0\\)), ta đặt lại hàm dưới dạng đơn giản: \\[S(t)=\\frac{Kt^{2}}{t^{2}+M}\\quad \\left(\\text{với }K=\\frac{a}{c},M=\\frac{d}{c}\\right)\\]Bước 2: Lập hệ phương trình để tìm các hằng số \\[K\\] và \\[M\\] Sau \\[4\\] tuần đi học, tốc độ đánh máy trung bình đạt \\[20\\] từ trên phút:\\[S(4)=\\frac{K\\cdot 4^{2}}{4^{2}+M}=20\\iff \\frac{16K}{16+M}=20\\iff 16K-20M=\\dots \\dots \\]\\(\\Rightarrow 16K - 20M = \\mathbf{320}\\) (1)Sau \\[6\\] tuần đi học, tốc độ đánh máy trung bình đạt \\[30\\] từ trên phút:\\[S(6)=\\frac{K\\cdot 6^{2}}{6^{2}+M}=30\\iff \\frac{36K}{36+M}=30\\iff 36K-30M=\\dots \\dots \\]\\(\\Rightarrow 36K - 30M = \\mathbf{1080}\\) (2)Giải hệ phương trình gồm hai phương trình (1) và (2), ta tìm được:\\[K=\\dots \\dots ,\\quad M=\\dots \\dots \\]\\(\\Rightarrow K = \\mathbf{50}, \\quad M = \\mathbf{24}\\)Như vậy, hàm số biểu diễn tốc độ đánh máy trung bình của ông A là: \\[S(t)=\\frac{50t^{2}}{t^{2}+24}\\]Bước 3: Dự đoán tốc độ đánh máy trung bình sau 15 tuần Thay \\(t = 15\\) vào hàm số vừa tìm được để tính toán:\\[S(15)=\\frac{50\\cdot 15^{2}}{15^{2}+24}=\\frac{\\dots \\dots \\dots }{249}\\approx \\dots \\dots \\text{\\ (từ/phút)}\\]"},{"originalNum":12,"qType":"3","qText":"Câu 12. (THPT Lê Thánh Tông - HCM 2025) Anh Nam có một cái ao diện tích $50\\text{m}^2$ để nuôi cá diêu hồng. Vụ vừa qua, anh nuôi với mật độ $40\\text{ con/m}^2$ và thu được 3 tấn cá thành phẩm. Theo kinh nghiệm nuôi cá của mình anh thấy cứ thả giảm đi $8\\text{ con/m}^2$ thì mỗi con cá thành phẩm tăng thêm $0,5\\text{kg}$. Để tổng năng suất cao nhất thì vụ tới anh Nam nên mua bao nhiêu cá giống để thả? (giả sử không có hao hụt trong quá trình nuôi)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1600","explanation":"","hint":"Bước 1: Tính số lượng cá và khối lượng trung bình của mỗi con cá ở vụ vừa qua Số lượng cá giống anh Nam đã thả ở vụ vừa qua là:\\[N_{0}=40\\times 50=\\dots \\dots \\text{\\ (con)}\\]Đổi sản lượng thu hoạch: \\(3 \\text{ tấn} = 3000 \\text{ kg}\\).Khối lượng trung bình của mỗi con cá thành phẩm ở vụ vừa qua là: \\[m_{0}=\\frac{3000}{\\dots \\dots }=\\dots \\dots \\text{\\ (kg/con)}\\]Bước 2: Lập hàm số biểu diễn tổng năng suất cá thu hoạch (\\[T\\]) Gọi \\[x\\] là số lượng mật độ cá thả giảm đi trên mỗi mét vuông (\\[\\text{con/m}^{2}\\]), với \\(0 < x < 40\\).Mật độ cá thả mới của vụ tới sẽ là: \\(\\dots\\dots - x \\text{ (con/m}^2)\\).Tổng số cá giống vụ tới được thả trong ao là:\\[N(x)=50\\times (40-x)\\text{\\ (con)}\\]Vì cứ giảm \\(8 \\text{ con/m}^2\\) thì mỗi con tăng thêm \\(0,5 \\text{ kg}\\), nên khi giảm \\(x \\text{ con/m}^2\\) thì khối lượng mỗi con cá thành phẩm tăng thêm \\(\\frac{0,5}{8}x = \\frac{x}{16} \\text{ kg}\\). Khối lượng một con cá khi đó là:\\[m(x)=1,5+\\frac{x}{\\dots \\dots }\\text{\\ (kg)}\\]Hàm số biểu diễn tổng năng suất thu hoạch của cả ao là: \\[T(x)=N(x)\\times m(x)=50(40-x)\\left(1,5+\\frac{x}{16}\\right)=\\frac{25}{8}(40-x)(24+x)\\]Bước 3: Khảo sát hàm số để tìm tổng năng suất cao nhất Xét hàm số bậc hai \\(f(x) = (40 - x)(24 + x) = -x^2 + 16x + 960\\).Hàm số đạt giá trị lớn nhất tại đỉnh Parabol:\\[x=-\\frac{b}{2a}=\\dots \\dots \\text{\\ (thỏa mãn)}\\]Khi đó, mật độ cá thả tối ưu cho vụ tới là: \\(40 - \\dots\\dots = \\dots\\dots \\text{ (con/m}^2)\\).Số lượng cá giống anh Nam nên mua để thả là: \\[\\dots \\dots \\times 50=\\dots \\dots \\text{\\ (con)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":13,"qType":"3","qText":"Câu 13. (THPT Triệu Quang Phục - Hưng Yên 2025) Một con cá hồi bơi ngược dòng (từ nơi sinh sống) vượt khoảng cách $300\\text{km}$ để tới nơi sinh sản. Vận tốc dòng nước là $6\\text{km/h}$. Giả sử vận tốc hơi của cá khi nước đứng yên là $v\\text{ km/h}$ thì năng lượng tiêu hao của cá trong $t$ giờ cho bởi công thức $E(v)=cv^3t$ trong đó $c$ là hằng số cho trước. $E$ tính bằng Jun. Tính vận tốc bơi của cá khi nước đứng yên, để năng lượng của cá tiêu hao ít nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"9","explanation":"","hint":"Bước 1: Thiết lập mối quan hệ giữa thời gian \\[t\\] và vận tốc \\[v\\] Vận tốc bơi thực tế của con cá hồi khi đi ngược dòng nước là:\\[v_{nd}=v-\\dots \\dots \\text{\\ (km/h)}\\quad (v>6)\\]Thời gian \\[t\\] để con cá vượt hết quãng đường \\(300\\text{ km}\\) ngược dòng là: \\[t=\\frac{300}{\\dots \\dots }\\text{\\ (giờ)}\\]Bước 2: Xây dựng hàm số năng lượng tiêu hao \\(E(v)\\) Thay biểu thức thời gian \\[t\\] vào công thức năng lượng \\(E(v) = c \\cdot v^3 \\cdot t\\), ta được hàm số theo biến \\[v\\]:\\[E(v)=c\\cdot v^{3}\\cdot \\frac{300}{v-6}=300c\\cdot \\frac{v^{3}}{\\dots \\dots }\\]Để tìm vận tốc giúp năng lượng tiêu hao ít nhất, ta xét hàm số \\(f(v) = \\frac{v^3}{v - 6}\\) trên khoảng \\((6; +\\infty)\\). Bước 3: Tìm giá trị nhỏ nhất bằng cách tính đạo hàm Đạo hàm của hàm số \\(f(v)\\) là:\\[f^{\\prime }(v)=\\frac{3v^{2}(v-6)-v^{3}\\cdot 1}{(v-6)^{2}}=\\frac{\\dots \\dots v^{2}(v-9)}{(v-6)^{2}}\\]Giải phương trình \\(f'(v) = 0\\) trên khoảng \\((6; +\\infty)\\) ta thu được nghiệm:\\[v=\\dots \\dots \\text{\\ (km/h)}\\]Lập bảng biến thiên hoặc đánh giá dấu đạo hàm, ta thấy hàm số \\(f(v)\\) đạt giá trị nhỏ nhất tại điểm này.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":14,"qType":"3","qText":"Câu 14. (Sở Cà Mau 2025) Giả sử doanh số sản phẩm mới trong vòng một số năm nhất định của một công ty được mô hình hóa bằng hàm số\n$$f(t)=\\frac{7000}{1+7e^{-t}}$$\n(trong đó thời gian $t \\ge 0$ được tính bằng năm), kể từ khi phát hành sản phẩm mới. Biết rằng hàm số $f''(t)$ biểu thị tốc độ bán hàng. Hỏi sau khi phát hành bao nhiêu năm thì tốc độ bán hàng là lớn nhất? (làm tròn kết quả đến hàng phần mười).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1.9","explanation":"","hint":"Bước 1: Tính đạo hàm bậc nhất \\(f'(t)\\) (Tốc độ bán hàng) Ta có hàm số biểu thị doanh số sản phẩm:\\[f(t)=\\frac{7000}{1+7e^{-t}}\\]Áp dụng công thức đạo hàm hàm hợp \\(\\left(\\frac{1}{u}\\right)' = -\\frac{u'}{u^2}\\), tốc độ bán hàng \\(f'(t)\\) của công ty là: \\[f^{\\prime }(t)=7000\\times \\frac{-(1+7e^{-t})^{\\prime }}{(1+7e^{-t})^{2}}=7000\\times \\frac{\\dots \\dots \\dots }{(1+7e^{-t})^{2}}=\\frac{\\dots \\dots \\dots }{(1+7e^{-t})^{2}}\\]Bước 2: Tìm thời điểm \\[t\\] để tốc độ bán hàng đạt giá trị lớn nhất Sử dụng bất đẳng thức Cauchy để đánh giá:Biến đổi \\(f'(t)\\) bằng cách chia cả tử và mẫu cho \\[e^{-t}\\]:\\[f^{\\prime }(t)=\\frac{49000}{\\frac{(1+7e^{-t})^{2}}{e^{-t}}}=\\frac{49000}{\\left(\\frac{1+7e^{-t}}{e^{-t/2}}\\right)^{2}}=\\frac{49000}{(e^{t/2}+7e^{-t/2})^{2}}\\]Để tốc độ bán hàng \\(f'(t)\\) đạt giá trị lớn nhất thì mẫu số \\((e^{t/2} + 7e^{-t/2})^2\\) phải nhỏ nhất, hay biểu thức \\((e^{t/2} + 7e^{-t/2})\\) phải đạt giá trị nhỏ nhất.Áp dụng bất đẳng thức Cauchy cho hai số dương \\[e^{t/2}\\] và \\[7e^{-t/2}\\]:\\[e^{t/2}+7e^{-t/2}\\ge 2\\sqrt{e^{t/2}\\times 7e^{-t/2}}=\\dots \\dots \\dots \\]Dấu \"=\" xảy ra khi và chỉ khi hai số bằng nhau: \\[e^{t/2}=7e^{-t/2}\\Rightarrow e^{t}=\\dots \\dots \\dots \\Rightarrow t=\\ln (\\dots \\dots \\dots )\\]Bước 3: Tính giá trị xấp xỉ của thời gian \\[t\\] Làm tròn kết quả đến hàng phần mười (chữ số thập phân thứ nhất):\\[t=\\ln (7)\\approx \\dots \\dots \\dots \\text{\\ (năm)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: \\(\\ldots\\ldots\\ldots\\) "},{"originalNum":15,"qType":"3","qText":"Câu 15. (Sở Hải Phòng 2026) Để hỗ trợ học sinh ôn thi tốt nghiệp THPT, một nhóm chuyên gia đã phát triển ứng dụng trợ lý học tập AI. Số lượng người dùng ứng dụng sau $t$ tháng phát hành được mô hình hóa bởi hàm số\n$$f(t)=\\frac{12000}{1+23e^{-0,5t}}$$\nvới $t \\ge 0$. Biết rằng $f''(t)$ biểu thị tốc độ tăng trưởng quanh một ngưỡng $K$ nhất định. Hỏi sau bao nhiêu phút thì tốc độ sinh trưởng của vi khuẩn đạt 90% của ngưỡng $K$ đó?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"6","explanation":"","hint":"Bước 1: Tính đạo hàm \\(f'(t)\\) biểu thị tốc độ tăng trưởng Hàm số số lượng người dùng: \\(f(t) = \\frac{12000}{1 + 23e^{-0{,}5t}}\\)Đạo hàm \\(f'(t)\\) biểu thị tốc độ tăng trưởng: \\[f^{\\prime }(t)=\\frac{-12000\\cdot \\left(1+23e^{-0,5t}\\right)^{\\prime }}{\\left(1+23e^{-0,5t}\\right)^{2}}=\\frac{\\dots \\dots \\cdot e^{-0,5t}}{\\left(1+23e^{-0,5t}\\right)^{2}}\\]Bước 2: Tìm thời điểm để tốc độ tăng trưởng đạt giá trị lớn nhất Đặt \\(x = e^{-0{,}5t}\\) (\\(x > 0\\)). Khi đó biểu thức tốc độ tăng trưởng trở thành:\\[g(x)=\\frac{138000x}{(1+23x)^{2}}\\]Áp dụng bất đẳng thức Cô-si cho mẫu số:\\[(1+23x)^{2}\\ge \\left(2\\sqrt{1\\cdot 23x}\\right)^{2}=\\dots \\dots x\\]Suy ra:\\[g(x)\\le \\frac{138000x}{\\dots \\dots x}=\\dots \\dots \\]Tốc độ tăng trưởng đạt giá trị lớn nhất khi dấu \"\\(\"=\"\\)\" xảy ra: \\(23x = 1 \\Leftrightarrow x = \\frac{1}{23}\\). Bước 3: Xác định thời gian \\[t\\] và làm tròn kết quả Với \\(x = \\frac{1}{23}\\), ta có phương trình tìm \\[t\\]:\\[e^{-0,5t}=\\frac{1}{23}\\Leftrightarrow -0,5t=-\\ln (23)\\Leftrightarrow t=2\\ln (23)\\approx \\dots \\dots \\]Làm tròn kết quả đến hàng đơn vị theo yêu cầu bài toán, ta được \\(t \\approx \\ldots\\ldots\\) \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":22,"qType":"3","qText":"Câu 22: (Sở Hà Tĩnh 2026) Giả sử số lượng tế bào của một quần thể nấm men tại môi trường nuôi cấy trong phòng thí nghiệm được mô hình hóa bằng hàm số $P(t)=\\frac{2a}{b+3e^{-0,75t}}$ (với $a,b ∈ ℝ$), trong đó thời gian $t$ được tính bằng giờ. Đạo hàm của hàm số $y=P(t)$ biểu thị tốc độ sinh trưởng của nấm men (tính bằng tế bào/giờ) tại thời điểm $t$ (giờ). Tại thời điểm ban đầu $t=0$, quần thể có 24 tế bào và tốc độ sinh trưởng là 6 tế bào/giờ. Sau một thời gian về lâu dài thì số lượng tế bào của quần thể nấm men tiến về giá trị bao nhiêu?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"36","explanation":"","hint":"Bước 1: Sử dụng điều kiện thời điểm ban đầu (\\(t = 0\\)) để lập phương trình số lượng tế bào Tại thời điểm ban đầu \\(t = 0\\), quần thể có \\[24\\] tế bào: \\[P(0)=\\frac{2a}{b+3e^{0}}=\\frac{2a}{b+\\dots \\dots }=24\\implies 2a=24(b+3)\\implies a=12(b+3)\\quad (1)\\]Bước 2: Sử dụng điều kiện tốc độ sinh trưởng ban đầu để tìm hệ số \\[a\\] và \\[b\\] Đạo hàm của hàm số \\(P(t)\\) biểu thị tốc độ sinh trưởng:\\[P^{\\prime }(t)=\\frac{-2a\\cdot 3\\cdot \\left(-0,75e^{-0,75t}\\right)}{\\left(b+3e^{-0,75t}\\right)^{2}}=\\frac{4,5a\\cdot e^{-0,75t}}{\\left(b+3e^{-0,75t}\\right)^{2}}\\]Tại thời điểm ban đầu \\(t = 0\\), tốc độ sinh trưởng là \\[6\\] tế bào/giờ:\\[P^{\\prime }(0)=\\frac{4,5a}{(b+3)^{2}}=6\\quad (2)\\]Thay \\((1)\\) vào \\((2)\\), ta được phương trình ẩn \\[b\\]:\\[\\frac{4,5\\cdot 12(b+3)}{(b+3)^{2}}=6\\implies \\frac{54}{b+3}=6\\implies b+3=\\dots \\dots \\implies b=\\dots \\dots \\]Thay giá trị \\[b\\] ngược lại vào \\((1)\\), ta tìm được: \\(a = \\dots\\dots\\) Bước 3: Tìm giới hạn số lượng tế bào của quần thể về lâu dài (\\(t \\to +\\infty\\)) Số lượng tế bào của quần thể nấm men về lâu dài chính là giới hạn của hàm số khi \\[t\\] tiến ra dương vô cùng:\\[\\lim _{t\\rightarrow +\\infty }P(t)=\\lim _{t\\rightarrow +\\infty }\\frac{2a}{b+3e^{-0,75t}}\\]Vì \\(\\lim_{t \\to +\\infty} e^{-0,75t} = \\dots\\dots\\) nên: \\[\\lim _{t\\rightarrow +\\infty }P(t)=\\frac{2a}{b}=\\frac{2\\cdot \\dots \\dots }{\\dots \\dots }=\\dots \\dots \\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":24,"qType":"3","qText":"Câu 24: (THPT Mỹ Đình - Hà Nội 2026) Đối với ngành xử lý môi trường, việc kiểm soát nồng độ hóa chất độc hại tồn dư trong nguồn nước thải là nhiệm vụ quan trọng. Khi thử nghiệm một phương pháp lọc nước mới, người ta nhận thấy nồng độ hóa chất độc hại $y(t)$, đơn vị mg/lít, trong bể nước thải của một nhà máy tại thời điểm $t$ ngày, với $t \\ge 0$, thỏa mãn $y(t)>0$ và $y'(t)=-k \\cdot y^2(t)$, trong đó $k$ là hằng số dương. Do nồng độ hóa chất độc hại trong bể tại thời điểm $t=1$ ngày và $t=3$ ngày lần lượt là 2 mg/lít và 1 mg/lít. Biết $y(t)=\\frac{1}{g(t)}$ với mọi $t \\ge 0$. Theo tiêu chuẩn an toàn sinh thái, nhà máy được phép xả bể nước thải ra môi trường bên ngoài khi nồng độ hóa chất độc hại tồn dư trong bể nước thải giảm xuống mức 0,1 mg/lít hoặc thấp hơn. Hỏi sau ít nhất bao nhiêu ngày kể từ lúc bắt đầu xử lý, bể nước thải đạt tiêu chuẩn được phép xả thải ra môi trường bên ngoài?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"39","explanation":"","hint":"Bước 1: Biến đổi hệ thức đạo hàm để tìm hàm số \\(y(t)\\) Từ giả thiết bài toán ta có phương trình vi phân:\\[y^{\\prime }(t)=-k\\cdot y^{2}(t)\\Rightarrow \\frac{y^{\\prime }(t)}{y^{2}(t)}=-k\\Rightarrow \\left(\\frac{1}{y(t)}\\right)^{\\prime }=\\dots \\dots \\]Lấy nguyên hàm hai vế theo biến \\[t\\], ta được hàm số \\(g(t) = \\frac{1}{y(t)}\\) có dạng: \\[g(t)=k\\cdot t+C\\Rightarrow y(t)=\\frac{1}{k\\cdot t+C}\\]Bước 2: Tìm các hằng số \\[k\\] và \\[C\\] Thay các dữ kiện nồng độ tại thời điểm \\(t = 1\\) ngày và \\(t = 3\\) ngày vào công thức, ta được hệ phương trình:\\[\\begin{cases}y(1)=\\frac{1}{k+C}=2\\\\ y(3)=\\frac{1}{3k+C}=1\\end{cases}\\Rightarrow \\begin{cases}k+C=\\dots \\dots \\\\ 3k+C=\\dots \\dots \\end{cases}\\]Giải hệ phương trình trên, ta tìm được các hằng số:\\[k=\\dots \\dots ;\\quad C=\\dots \\dots \\]Như vậy, biểu thức nồng độ hóa chất độc hại theo thời gian là: \\(y(t) = \\frac{4}{t + 1}\\) Bước 3: Xác định thời gian tối thiểu để bể nước thải đạt tiêu chuẩn xả thải Theo tiêu chuẩn an toàn sinh thái, nhà máy được phép xả thải khi nồng độ \\(y(t) \\leq 0,1 \\text{ mg/lít}\\):\\[\\frac{4}{t+1}\\le 0,1\\Rightarrow t+1\\ge \\dots \\dots \\Rightarrow t\\ge \\dots \\dots \\]Vậy sau ít nhất \\(\\ldots\\ldots\\) ngày kể từ lúc bắt đầu xử lý, bể nước thải đạt tiêu chuẩn được phép xả thải ra môi trường.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":25,"qType":"3","qText":"Câu 25: (Cụm Chuyên Phú Thọ 2026) Nuôi cấy nấm men thu sinh khối, ứng dụng làm tế bào nhân trong công nghệ gen để sản xuất một số chất có hoạt tính sinh học mạnh. Giả sử số lượng tế bào của một quần thể nấm men tại môi trường nuôi cấy trong phòng thí nghiệm được mô hình hóa bằng hàm số $P(t)=\\frac{a}{b+e^{-0,75t}}$, trong đó thời gian $t$ được tính bằng giờ. Đạo hàm của hàm số $y=P(t)$ biểu thị tốc độ tăng trưởng của quần thể nấm men, tính bằng tế bào/giờ, tại thời điểm $t$. Tại thời điểm ban đầu $t=0$, quần thể có 30 tế bào và tốc độ sinh trưởng là 15 tế bào/giờ. Hỏi sau bao nhiêu giờ thì tốc độ sinh trưởng của quần thể nấm men đạt mức tối đa? Kết quả làm tròn đến hàng phần trăm.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"0.92","explanation":"","hint":"Bước 1: Xác định các hệ số \\[a\\] và \\[b\\] từ dữ kiện ban đầu Số lượng tế bào tại thời điểm ban đầu \\(t = 0\\) là \\[30\\]:\\[P(0)=\\frac{a}{b+e^{0}}=30\\Rightarrow \\frac{a}{b+1}=30\\Rightarrow a=30(b+1)\\quad (1)\\]Đạo hàm biểu thị tốc độ tăng trưởng \\(P'(t)\\) có dạng:\\[P^{\\prime }(t)=\\frac{a\\times (-0,75e^{-0,75t})\\times (-1)}{(b+e^{-0,75t})^{2}}=\\frac{\\dots \\dots \\dots }{(b+e^{-0,75t})^{2}}\\]Tại thời điểm \\(t = 0\\), tốc độ tăng trưởng là \\[15\\]:\\[P^{\\prime }(0)=\\frac{0,75a}{(b+1)^{2}}=15\\quad (2)\\]Thay \\((1)\\) vào \\((2)\\), ta tìm được: \\[b=\\dots \\dots \\dots \\Rightarrow a=\\dots \\dots \\dots \\]Bước 2: Tìm thời điểm \\[t\\] để tốc độ sinh trưởng đạt mức tối đa Thay các hệ số vừa tìm được vào biểu thức \\(P'(t)\\):\\[P^{\\prime }(t)=\\frac{33,75e^{-0,75t}}{(0,5+e^{-0,75t})^{2}}\\]Biến đổi bằng cách chia cả tử và mẫu cho \\[e^{-0,75t}\\]:\\[P^{\\prime }(t)=\\frac{33,75}{\\left(\\frac{0,5+e^{-0,75t}}{e^{-0,375t}}\\right)^{2}}=\\frac{33,75}{(0,5e^{0,375t}+e^{-0,375t})^{2}}\\]Để \\(P'(t)\\) đạt giá trị lớn nhất thì mẫu số phải nhỏ nhất. Áp dụng bất đẳng thức Cauchy cho hai số dương \\(0,5e^{0,375t}\\) và \\[e^{-0,375t}\\], dấu \"=\" xảy ra khi và chỉ khi: \\[0,5e^{0,375t}=e^{-0,375t}\\Rightarrow e^{0,75t}=\\dots \\dots \\dots \\Rightarrow 0,75t=\\ln (\\dots \\dots \\dots )\\]Bước 3: Tính giá trị xấp xỉ của thời gian \\[t\\] Rút ra \\[t\\] và làm tròn đến hàng phần trăm (hai chữ số thập phân):\\[t=\\frac{\\ln (2)}{0,75}\\approx \\dots \\dots \\dots \\text{\\ (giờ)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: \\(\\ldots\\ldots\\ldots\\) "},{"originalNum":26,"qType":"3","qText":"Câu 26: (Sở Ninh Bình 2026) Độ cao $h$ tính bằng ki-lô-mét so với mặt nước biển của một vị trí trong không trung tính theo áp suất không khí $P$ tại điểm đó và áp suất $P_0$ của không khí tại mặt nước biển được cho bởi công thức $h=-19,4\\log\\frac{P}{P_0}$.\n\nMột chiếc máy bay đang bay ngang ở độ cao $10$ km thì bắt đầu hạ độ cao. Khi hạ xuống đến vị trí có độ cao $h_1$, áp suất không khí bên ngoài máy bay đo được tăng lên gấp đôi so với lúc máy bay đang ở độ cao $10$ km. Hỏi máy bay đã hạ xuống một khoảng cách là bao nhiêu ki-lô-mét so với vị trí ban đầu? Kết quả làm tròn đến hàng phần chục.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"5.8","explanation":"","hint":"Bước 1: Thiết lập hệ thức áp suất tại độ cao ban đầu (\\(10 \\text{ km}\\)) Gọi \\[P_{1}\\] là áp suất không khí tại vị trí máy bay ở độ cao \\(10 \\text{ km}\\). Ta có phương trình: \\[10=-19,4\\log \\frac{P_{1}}{P_{0}}\\quad (1)\\]Bước 2: Thiết lập hệ thức áp suất tại độ cao mới (\\[h_{1}\\]) Khi máy bay hạ xuống độ cao \\[h_{1}\\], áp suất tăng lên gấp đôi, tức là bằng \\(\\dots\\dots \\cdot P_1\\).Thay vào công thức, ta thu được:\\[h_{1}=-19,4\\log \\frac{\\dots \\dots \\cdot P_{1}}{P_{0}}\\quad (2)\\]Sử dụng tính chất của lôgarit \\(\\log(A \\cdot B) = \\log A + \\log B\\), biến đổi phương trình \\((2)\\): \\[h_{1}=-19,4\\cdot \\left(\\log 2+\\log \\frac{P_{1}}{P_{0}}\\right)=-19,4\\log 2+\\left(-19,4\\log \\frac{P_{1}}{P_{0}}\\right)\\]Bước 3: Tính khoảng cách máy bay đã hạ xuống Thay thế hệ thức \\((1)\\) vào phương trình biến đổi của \\[h_{1}\\], ta được:\\[h_{1}=-19,4\\log 2+\\dots \\dots \\]Khoản cách mà máy bay đã hạ xuống so với vị trí ban đầu là:\\[\\Delta h=10-h_{1}=10-(-19,4\\log 2+10)=19,4\\log 2\\]Tính giá trị xấp xỉ (làm tròn đến hàng phần chục): \\[\\Delta h\\approx \\dots \\dots \\text{\\ (km)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":27,"qType":"3","qText":"Câu 27: (Sở Thái Nguyên 2026) Đối với ngành nuôi trồng thủy sản, việc kiểm soát lượng thuốc tồn dư trong nước là một nhiệm vụ quan trọng nhằm đáp ứng các tiêu chuẩn an toàn về môi trường. Khi nghiên cứu một loại thuốc trị bệnh trong nuôi trồng thủy sản, người ta sử dụng thuốc đó một lần và theo dõi nồng độ thuốc tồn dư trong nước kể từ lúc sử dụng thuốc. Kết quả cho thấy nồng độ thuốc $y(t)$ (đơn vị: mg/lít) tồn dư trong nước tại thời điểm $t$ ngày kể từ lúc sử dụng thuốc, thỏa mãn $y(t)=e^{s(t)}$ và $y'(t)=k\\cdot y(t)$ với $t\\ge 0$, trong đó $k$ là hằng số khác không. Do nồng độ thuốc tồn dư trong nước tại các thời điểm $t=6$ ngày, $t=12$ ngày nhận được kết quả lần lượt là $2$ mg/lít, $1$ mg/lít. Nồng độ thuốc tồn dư trong nước tại thời điểm $30$ ngày bằng bao nhiêu mg/lít? (kết quả làm tròn đến hàng phần trăm)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"0.33","explanation":"","hint":"Bước 1: Giải phương trình vi phân để tìm công thức tổng quát của \\(y(t)\\) Từ giả thiết bài toán ta có phương trình vi phân tách biến:\\[y^{\\prime }(t)=k\\cdot y(t)\\Rightarrow \\frac{y^{\\prime }(t)}{y(t)}=k\\]Lấy nguyên hàm hai vế theo biến \\[t\\], ta được: \\[\\ln |{}y(t)|{}=k\\cdot t+C_{0}\\Rightarrow y(t)=e^{k\\cdot t+C_{0}}=C\\cdot e^{k\\cdot t}\\quad (\\text{với }C=e^{C_{0}})\\]Bước 2: Xác định các hằng số \\[C\\] và \\[k\\] Thay các dữ kiện nồng độ thuốc tồn dư tại thời điểm \\(t = 6\\) ngày và \\(t = 12\\) ngày vào công thức, ta có hệ phương trình:\\[\\begin{cases}y(6)=C\\cdot e^{6k}=2\\\\ y(12)=C\\cdot e^{12k}=1\\end{cases}\\]Chia vế theo vế của phương trình thứ hai cho phương trình thứ nhất, ta được:\\[\\frac{C\\cdot e^{12k}}{C\\cdot e^{6k}}=\\frac{1}{2}\\Rightarrow e^{6k}=\\dots \\dots \\]Từ đó suy ra hằng số \\[C\\]:\\[C\\cdot \\left(\\dots \\dots \\right)=2\\Rightarrow C=\\dots \\dots \\]Vậy hàm số biểu diễn nồng độ thuốc theo thời gian là: \\(y(t) = 4 \\cdot \\left(\\frac{1}{2}\\right)^{\\frac{t}{6}}\\) Bước 3: Tính nồng độ thuốc tồn dư tại thời điểm 30 ngày Thay \\(t = 30\\) vào hàm số \\(y(t)\\) vừa tìm được:\\[y(30)=4\\cdot \\left(\\frac{1}{2}\\right)^{\\frac{30}{6}}=4\\cdot \\left(\\frac{1}{2}\\right)^{\\dots \\dots }=\\dots \\dots \\text{\\ (mg/lít)}\\]Làm tròn kết quả đến hàng phần trăm ta được: \\(\\ldots\\ldots \\text{ mg/lít}\\).\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "}]},{"title":"Chuyên đề 6. Kinh tế cơ bản: doanh thu - chi phí - lợi nhuận","questions":[{"originalNum":1,"qType":"3","qText":"Câu 1: (Sở Đà Nẵng 2025) Một công ti trung bình bán được 600 chiếc máy lọc không khí mỗi tháng với giá 10 triệu đồng một chiếc. Một khảo sát cho thấy nếu giảm giá bán mỗi chiếc 400 nghìn đồng, thì số lượng bán ra tăng thêm khoảng 60 chiếc mỗi tháng. Gọi $p$ (triệu đồng) là giá bán của mỗi máy, $x$ là số máy bán ra. Khi đó, hàm cầu $p=p(x)$ và hàm doanh thu là $R(p)=px$. Hỏi công ti phải bán mỗi máy lọc không khí với số tiền bao nhiêu triệu đồng để doanh thu là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"7","explanation":"","hint":"Bước 1: Thiết lập mối quan hệ giữa số lượng bán ra \\[x\\] và giá bán \\[p\\] Theo bài ra, ban đầu khi giá bán là \\[10\\] triệu đồng thì số lượng máy bán ra là \\[600\\] chiếc.Khi giá bán giảm đi \\(0,4\\) triệu đồng (\\[400\\] nghìn đồng) thì số lượng máy bán ra tăng thêm \\[60\\] chiếc. Hệ số biểu thị sự thay đổi lượng cầu theo giá là:\\[k=\\frac{60}{-0,4}=-150\\]Hàm số bậc nhất biểu thị lượng cầu \\[x\\] theo giá \\[p\\] (với điểm đi qua là \\((10; 600)\\)) có dạng: \\[x-600=-150(p-10)\\Rightarrow x=\\dots \\dots \\dots -150p\\]Bước 2: Xây dựng hàm số doanh thu \\(R(p)\\) Hàm số doanh thu \\(R(p)\\) phụ thuộc vào biến số \\[p\\] (giá bán) là: \\[R(p)=p\\times x=p\\times (\\dots \\dots \\dots -150p)=-150p^{2}+\\dots \\dots \\dots p\\]Bước 3: Tìm giá bán \\[p\\] để doanh thu lớn nhất Cách 1: Sử dụng tính chất của hàm số bậc hai (Tọa độ đỉnh Parabol)Hàm số doanh thu \\(R(p) = -150p^2 + 2100p\\) là một hàm số bậc hai với hệ số \\(a = -150 < 0\\), nên đồ thị của nó là một parabol quay bề lõm xuống dưới. Doanh thu đạt giá trị lớn nhất tại đỉnh của parabol:\\[p=-\\frac{b}{2a}=-\\frac{2100}{2\\times (-150)}=\\dots \\dots \\dots \\]Cách 2: Sử dụng đạo hàmTìm đạo hàm của hàm số doanh thu: \\[R^{\\prime }(p)=\\dots \\dots \\dots +2100\\]\\[R^{\\prime }(p)=0\\Leftrightarrow p=\\dots \\dots \\dots \\]\\[\\Rightarrow \\] "},{"originalNum":2,"qType":"3","qText":"Câu 2: (Sở Hưng Yên 2025) Một cơ sở sản xuất quần áo trẻ em đang bán mỗi bộ quần áo với giá 80 nghìn đồng một bộ và mỗi tháng cơ sở bán được trung bình 1200 bộ quần áo. Cơ sở sản xuất đang có kế hoạch tăng giá bán để có lợi nhuận tốt hơn. Sau khi tham khảo thị trường, người quản lý thấy rằng nếu từ mức giá 80 nghìn đồng mà cứ mỗi lần tăng thêm 5 nghìn đồng mỗi bộ quần áo thì mỗi tháng sẽ bán ít đi 100 bộ. Biết vốn sản xuất một bộ quần áo không thay đổi là 50 nghìn đồng. Để lợi nhuận thu được lớn nhất thì cơ sở sản xuất đưa ra giá bán cho một bộ quần áo là bao nhiêu? (Đơn vị: nghìn đồng).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"95","explanation":"","hint":"Bước 1: Tính lợi nhuận trên mỗi bộ quần áo ban đầu Vốn sản xuất một bộ quần áo không đổi là \\[50\\] nghìn đồng.Với giá bán ban đầu là \\[80\\] nghìn đồng, lợi nhuận thu được trên mỗi bộ quần áo là: \\[80-\\dots \\dots =\\dots \\dots \\text{\\ (nghìn đồng)}\\]Bước 2: Lập hàm số biểu diễn tổng lợi nhuận một tháng (\\[L\\]) Gọi \\[x\\] là số lần tăng giá bán thêm \\[5\\] nghìn đồng (\\(x \\ge 0\\)).Giá bán mới của một bộ quần áo sau khi tăng giá là:\\[80+\\dots \\dots \\cdot x\\text{\\ (nghìn đồng)}\\]Lợi nhuận thu được trên mỗi bộ quần áo lúc này là:\\[(80+5x)-50=\\dots \\dots +5x\\text{\\ (nghìn đồng)}\\]Do cứ mỗi lần tăng \\[5\\] nghìn đồng thì số lượng bán giảm đi \\[100\\] bộ, nên số bộ quần áo bán được trong một tháng là:\\[1200-\\dots \\dots \\cdot x\\text{\\ (bộ)}\\]Hàm số biểu diễn tổng lợi nhuận thu được trong một tháng là: \\[L(x)=(30+5x)(1200-100x)=500(6+x)(12-x)\\]\\[L(x)=500(-x^{2}+\\dots \\dots \\cdot x+72)\\]Bước 3: Tìm số lần tăng giá để lợi nhuận thu được lớn nhất Xét hàm số bậc hai \\(f(x) = -x^2 + 6x + 72\\). Đồ thị hàm số là một Parabol có bề lõm quay xuống dưới, đạt giá trị lớn nhất tại hoành độ đỉnh:\\[x=-\\frac{b}{2a}=\\dots \\dots \\]Để cơ sở sản xuất thu được lợi nhuận lớn nhất thì cần tăng giá \\(\\dots\\dots\\) lần.Khi đó, mức giá bán tối ưu cho một bộ quần áo là: \\[80+5\\times \\dots \\dots =\\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":3,"qType":"3","qText":"Câu 3: (Sở Sóc Trăng 2025) Một công ty sản xuất hai sản phẩm là sản phẩm $A$ và sản phẩm $B$. Biết số tiền thu được khi bán sản phẩm $A$ là 50000 đồng/sản phẩm; số tiền thu được khi bán từ 1 đến 100 sản phẩm $B$ là 55000 đồng/sản phẩm, từ 101 đến 200 sản phẩm $B$ là 54000 đồng/sản phẩm, từ 201 đến 300 sản phẩm $B$ là 53000 đồng/sản phẩm... số tiền thu được khi bán thêm 100 sản phẩm $B$ giảm đúng 1000 đồng/sản phẩm so với 100 sản phẩm đã bán ngay trước đó. Biết chi phí khi sản xuất sản phẩm cả $A$ và $B$ đều là 30000 đồng/sản phẩm. Giả sử trong một tuần tổng hai sản phẩm của công ty sản xuất và bán ra đúng 2000. Trong một tuần mức lợi nhuận của công ty có thể đạt được lớn nhất là bao nhiêu triệu đồng?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"41.5","explanation":"","hint":"Bước 1: Tính lợi nhuận biên trên mỗi sản phẩm Lợi nhuận khi bán một sản phẩm \\[A\\] là cố định: \\[\\text{Lợi nhuận }A=50000-30000=\\dots \\dots \\text{\\ (đồng/sản phẩm)}\\]Lợi nhuận của sản phẩm \\[B\\] giảm dần theo từng lô 100 sản phẩm:Lô 1 (từ 1 đến 100): \\(55000 - 30000 = 25000\\) (đồng/sản phẩm)Lô 2 (từ 101 đến 200): \\(54000 - 30000 = \\ldots\\ldots\\) (đồng/sản phẩm)Lô 3 (từ 201 đến 300): \\(53000 - 30000 = 23000\\) (đồng/sản phẩm)Lô 4 (từ 301 đến 400): \\(52000 - 30000 = 22000\\) (đồng/sản phẩm)Lô 5 (từ 401 đến 500): \\(51000 - 30000 = \\ldots\\ldots\\) (đồng/sản phẩm)Lô 6 (từ 501 đến 600): \\(50000 - 30000 = 20000\\) (đồng/sản phẩm)Kể từ lô thứ 7 trở đi, lợi nhuận của sản phẩm \\[B\\] sẽ \\(\\ldots\\ldots\\) hơn lợi nhuận của sản phẩm \\[A\\]. Bước 2: Xác định phương án sản xuất tối ưu Để tổng lợi nhuận đạt mức lớn nhất, công ty ưu tiên sản xuất toàn bộ các lô sản phẩm \\[B\\] có lợi nhuận biên lớn hơn hoặc bằng sản phẩm \\[A\\].Do đó, số lượng sản phẩm \\[B\\] tối ưu cần sản xuất là: \\(y = \\ldots\\ldots\\) (sản phẩm) (tương ứng hết lô thứ 5 hoặc lô thứ 6).Khi đó, số lượng sản phẩm \\[A\\] còn lại cần sản xuất là: \\[x=2000-y=\\dots \\dots \\text{\\ (sản phẩm)}\\]Bước 3: Tính mức lợi nhuận tối đa đạt được Tổng lợi nhuận từ sản phẩm \\[B\\] (tính cho 500 sản phẩm đầu):\\[\\text{Lợi nhuận }B=100\\cdot (25000+24000+23000+22000+21000)=\\dots \\dots \\text{\\ (đồng)}\\]Lợi nhuận từ 1500 sản phẩm \\[A\\]:\\[\\text{Lợi nhuận }A=1500\\cdot 20000=\\dots \\dots \\text{\\ (đồng)}\\]Tổng lợi nhuận lớn nhất công ty có thể đạt được là:\\[\\text{Tổng lợi nhuận}=\\dots \\dots +\\dots \\dots =41500000\\text{\\ (đồng)}=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":4,"qType":"3","qText":"Câu 4: (Sở Đắk Lắk 2025) Một cửa hàng có bán loại sản phẩm $A$. Khi cửa hàng bán sản phẩm $A$ với giá 400 ngàn đồng thì mỗi tuần cửa hàng bán được 200 sản phẩm. Cửa hàng dự định có đợt giảm giá bán để kích cầu trong dịp lễ sắp tới. Theo khảo sát thị trường, mỗi lần giảm giá 20 ngàn đồng 1 sản phẩm thì cửa hàng bán thêm được 20 sản phẩm mỗi tuần. Hỏi cửa hàng cần bán một sản phẩm với giá bao nhiêu ngàn đồng thì doanh thu trong 1 tuần lớn nhất.","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"300","explanation":"","hint":"Bước 1: Thiết lập hàm số biểu thị số lượng sản phẩm và giá bán mới Gọi \\[x\\] (ngàn đồng) là số tiền giảm giá của mỗi sản phẩm (\\(0 \\le x \\le 400\\)). Khi đó:Giá bán mới của một sản phẩm là: \\(400 - x\\) (ngàn đồng).Vì cứ giảm \\[20\\] ngàn đồng thì bán thêm được \\[20\\] sản phẩm (tỷ lệ là \\(1:1\\)), nên khi giảm \\[x\\] ngàn đồng, số lượng sản phẩm bán tăng thêm tương ứng là \\[x\\] sản phẩm.Tổng số lượng sản phẩm bán được trong một tuần mới là: \\(\\ldots\\ldots\\ldots + x\\) (sản phẩm). Bước 2: Xây dựng hàm số doanh thu \\(R(x)\\) theo tuần Doanh thu của cửa hàng thu được trong một tuần là: \\[R(x)=(400-x)(\\dots \\dots \\dots +x)=-x^{2}+\\dots \\dots \\dots x+80000\\]Bước 3: Tìm số tiền giảm giá \\[x\\] để doanh thu đạt giá trị lớn nhất Cách 1: Sử dụng tính chất của hàm số bậc hai (Tọa độ đỉnh Parabol)Hàm số doanh thu \\(R(x) = -x^2 + 200x + 80000\\) là một hàm số bậc hai có hệ số \\(a = -1 < 0\\), đồ thị là một parabol quay bề lõm xuống dưới. Doanh thu đạt giá trị lớn nhất tại đỉnh parabol:\\[x=-\\frac{b}{2a}=-\\frac{200}{2\\times (-1)}=\\dots \\dots \\dots \\text{\\ (ngàn đồng)}\\]Cách 2: Sử dụng đạo hàmTìm đạo hàm của hàm số doanh thu: \\[R^{\\prime }(x)=\\dots \\dots \\dots +200\\]\\[R^{\\prime }(x)=0\\Leftrightarrow x=\\dots \\dots \\dots \\]Bước 4: Xác định giá bán tối ưu của sản phẩm Với \\(x = 100\\) ngàn đồng, cửa hàng cần bán một sản phẩm với giá là: \\[400-\\dots \\dots \\dots =\\dots \\dots \\dots \\text{\\ (ngàn đồng)}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 300 "},{"originalNum":5,"qType":"3","qText":"Câu 5: (Sở Hải Dương 2025) Nhà máy $A$ chuyên sản xuất một loại sản phẩm cung cấp cho nhà máy $B$. Hai nhà máy thỏa thuận rằng, hàng tháng nhà máy $A$ cung cấp cho nhà máy $B$ số lượng sản phẩm theo đơn đặt hàng của $B$ (tối đa 100 tấn sản phẩm). Nếu số lượng đặt hàng là $x$ tấn sản phẩm thì giá bán cho mỗi tấn sản phẩm là $P(x)=45-0,001x^{2}$ (triệu đồng). Chi phí để $A$ sản xuất $x$ tấn sản phẩm trong một tháng gồm 100 triệu đồng chi phí cố định và 30 triệu đồng cho mỗi tấn sản phẩm. Nhà máy $A$ cần bán cho nhà máy $B$ bao nhiêu tấn sản phẩm mỗi tháng để lợi nhuận thu được là lớn nhất? (kết quả làm tròn đến hàng phần mười).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"70.7","explanation":"","hint":"Bước 1: Thiết lập hàm doanh thu \\(R(x)\\) và hàm chi phí \\(C(x)\\) Gọi \\[x\\] là số lượng sản phẩm đặt hàng (tấn), với điều kiện: \\(x \\in [0; 100]\\).Doanh thu của nhà máy \\[A\\] khi bán được \\[x\\] tấn sản phẩm là:\\[R(x)=x\\cdot P(x)=x\\cdot \\left(45-0,001x^{2}\\right)=45x-\\dots \\dots \\cdot x^{3}\\text{\\ (triệu đồng)}\\]Tổng chi phí để sản xuất \\[x\\] tấn sản phẩm là: \\[C(x)=\\dots \\dots +30x\\text{\\ (triệu đồng)}\\]Bước 2: Thiết lập hàm lợi nhuận \\(L(x)\\) Lợi nhuận thu được là hiệu giữa doanh thu và chi phí: \\[L(x)=R(x)-C(x)=-0,001x^{3}+\\dots \\dots \\cdot x-100\\text{\\ (triệu đồng)}\\]Bước 3: Khảo sát hàm số để tìm giá trị lớn nhất của lợi nhuận Đạo hàm của hàm lợi nhuận:\\[L^{\\prime }(x)=-0,003x^{2}+\\dots \\dots \\]Giải phương trình \\(L'(x) = 0\\):\\[-0,003x^{2}+15=0\\Leftrightarrow x^{2}=\\dots \\dots \\Rightarrow x=\\sqrt{\\dots \\dots }\\approx \\dots \\dots \\text{\\ (tấn)}\\]Lập bảng biến thiên trên đoạn \\([0; 100]\\), ta thấy hàm số đạt giá trị lớn nhất tại \\(x = 50\\sqrt{2}\\).Làm tròn kết quả đến hàng phần mười theo yêu cầu: \\(x \\approx \\ldots\\ldots\\) \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":6,"qType":"3","qText":"Câu 6: (Sở Cà Mau 2025) Một hộ kinh doanh sản xuất mỗi ngày được $x$ sản phẩm, $(1\\le x\\le 20)$. Chi phí sản xuất $x$ sản phẩm được cho bởi $C(x)=x^{3}-3x^{2}+80x+500$ (nghìn đồng). Giả sử hộ kinh doanh này bán mỗi sản phẩm với giá 320 nghìn đồng. Lợi nhuận lớn nhất mà hộ kinh doanh có được là bao nhiêu triệu đồng? (làm tròn kết quả đến hàng phần mười).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1.2","explanation":"","hint":"Bước 1: Lập hàm số biểu diễn tổng lợi nhuận thu được mỗi ngày (\\(P(x)\\)) Do bán mỗi sản phẩm với giá \\[320\\] nghìn đồng, hàm doanh thu khi bán \\[x\\] sản phẩm là:\\[R(x)=\\dots \\dots \\cdot x\\text{\\ (nghìn đồng)}\\]Hàm số biểu diễn lợi nhuận \\(P(x)\\) thu được bằng doanh thu trừ đi chi phí: \\[P(x)=R(x)-C(x)=320x-\\left(x^{3}-3x^{2}+80x+500\\right)\\]\\[P(x)=-x^{3}+3x^{2}+\\dots \\dots \\cdot x-500\\quad (\\text{với }1\\le x\\le 20)\\]Bước 2: Tìm giá trị \\[x\\] để hàm lợi nhuận đạt cực đại Tính đạo hàm của hàm số lợi nhuận \\(P(x)\\):\\[P^{\\prime }(x)=-3x^{2}+\\dots \\dots \\cdot x+240\\]Tìm nghiệm của phương trình \\(P'(x) = 0\\) trên đoạn \\([1; 20]\\): \\[-3x^{2}+6x+240=0\\implies \\left[\\begin{aligned}&x=10\\text{\\ (thỏa mãn)}\\\\ &x=-8\\text{\\ (loại)}\\end{aligned}\\right.\\]Bước 3: Tính lợi nhuận lớn nhất theo đơn vị triệu đồng Tính giá trị của hàm lợi nhuận tại các điểm đầu mút và điểm cực trị:\\[P(1)=-258\\text{\\ (nghìn đồng)}\\]\\[P(10)=\\dots \\dots \\text{\\ (nghìn đồng)}\\]\\[P(20)=-2500\\text{\\ (nghìn đồng)}\\]So sánh các giá trị, ta thấy lợi nhuận đạt mức lớn nhất là \\(\\dots\\dots\\) nghìn đồng.Đổi kết quả sang đơn vị triệu đồng (làm tròn đến hàng phần mười): \\[\\frac{\\dots \\dots }{1000}=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":7,"qType":"3","qText":"Câu 7: (Sở Lâm Đồng 2025) Một doanh nghiệp dự định sản xuất 200 máy tính bảng dành cho học sinh. Nếu doanh nghiệp đó bán $x$ máy tính bảng $(1\\le x\\le 200,x∈ \\mathbb{N})$ thì giá bán cho mỗi máy tính bảng là $p(x)=4000-10x$ (nghìn đồng), trong đó chi phí để sản xuất mỗi máy tính bảng là\n$$c(x)=x^{2}-70x+400+\\frac{1000}{x}$$\n(nghìn đồng). Hỏi doanh nghiệp đó sẽ bán bao nhiêu máy tính bảng để lợi nhuận cao nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"60","explanation":"","hint":"Bước 1: Thiết lập hàm số lợi nhuận \\(L(x)\\) Tổng doanh thu khi doanh nghiệp bán \\[x\\] máy tính bảng là:\\[R(x)=x\\cdot p(x)=x\\cdot (4000-10x)=4000x-10x^{2}\\]Tổng chi phí để sản xuất \\[x\\] máy tính bảng là:\\[C(x)=x\\cdot c(x)=x\\cdot \\left(x^{2}-70x+400+\\frac{1000}{x}\\right)=x^{3}-70x^{2}+400x+\\dots \\dots \\]Hàm số lợi nhuận \\(L(x)\\) thu được bằng doanh thu trừ đi chi phí: \\[L(x)=R(x)-C(x)=-x^{3}+\\dots \\dots x^{2}+3600x-1000\\quad (1\\le x\\le 200)\\]Bước 2: Tìm cực trị bằng phương pháp đạo hàm Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=-3x^{2}+\\dots \\dots x+3600\\]Giải phương trình đạo hàm \\(L'(x) = 0\\): \\[-3x^{2}+120x+3600=0\\Rightarrow \\begin{cases}x=\\dots \\dots \\text{\\ (thỏa mãn)}\\\\ x=-20\\text{\\ (loại)}\\end{cases}\\]Bước 3: Đánh giá và kết luận Lập bảng biến thiên hoặc đánh giá dấu của đạo hàm \\(L'(x)\\) trên đoạn \\([1; 200]\\), ta thấy hàm số \\(L(x)\\) đồng biến trên khoảng \\((1; \\ldots\\ldots)\\) và nghịch biến trên khoảng \\((\\ldots\\ldots; 200)\\).Do đó, lợi nhuận của doanh nghiệp đạt giá trị cao nhất tại điểm \\(x = \\ldots\\ldots\\)\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":8,"qType":"3","qText":"Câu 8: (Sở Hậu Giang 2025) Ở khu du lịch D có một cửa hàng chuyên bán áo lưu niệm. Cửa hàng đã lấy hàng hóa để nhập vào kho với giá 20 nghìn đồng/cái. Cửa hàng bán lại cho khách hàng với giá 39 nghìn đồng/cái. Với giá bán như trên, cửa hàng bán được 120 cái/ngày. Trong một thời gian thực hiện giảm giá bán, cửa hàng nhận thấy rằng nếu giảm 1 nghìn đồng/cái thì trong một ngày, số áo bán được tăng thêm 15 cái. Khi giảm giá ở mức phù hợp, cửa hàng có thể thu được lợi nhuận cao nhất trong một ngày là bao nhiêu? (làm tròn kết quả đến hàng đơn vị, tính theo đơn vị nghìn đồng)","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"2734","explanation":"","hint":"Bước 1: Thiết lập các hàm số theo lượng tiền giảm giá Gọi \\[x\\] (ngàn đồng) là số tiền giảm giá cho mỗi chiếc áo lưu niệm (\\(0 \\le x \\le 19\\)). Khi đó:Lợi nhuận thu được trên mỗi chiếc áo sau khi giảm giá là:\\[(39-x)-20=\\dots \\dots \\dots -x\\text{\\ (ngàn đồng)}\\]Số lượng áo cửa hàng bán được trong một ngày là: \\[120+15x\\text{\\ (cái)}\\]Bước 2: Xây dựng hàm số tổng lợi nhuận \\(L(x)\\) trong một ngày Tổng lợi nhuận thu được trong một ngày của cửa hàng là: \\[L(x)=(\\dots \\dots \\dots -x)(120+15x)=-15x^{2}+\\dots \\dots \\dots x+2280\\]Bước 3: Tìm số tiền giảm giá \\[x\\] để lợi nhuận đạt giá trị lớn nhất Hàm số lợi nhuận \\(L(x) = -15x^2 + 165x + 2280\\) là hàm số bậc hai với hệ số \\(a = -15 < 0\\), đồ thị là một parabol quay bề lõm xuống dưới.Lợi nhuận trong ngày đạt giá trị lớn nhất tại đỉnh parabol: \\[x=-\\frac{b}{2a}=-\\frac{165}{2\\times (-15)}=\\dots \\dots \\dots \\text{\\ (ngàn đồng)}\\]Bước 4: Tính mức lợi nhuận cao nhất trong một ngày Thay giá trị \\(x = 5,5\\) vào hàm số lợi nhuận \\(L(x)\\), ta được:\\[L(5,5)=-15\\times (5,5)^{2}+165\\times 5,5+2280=\\dots \\dots \\dots \\text{\\ (ngàn đồng)}\\]Làm tròn kết quả đến hàng đơn vị: \\(\\approx \\ldots\\ldots\\ldots\\) \\[\\Rightarrow \\] Đáp án cần nhập là: 2734 "},{"originalNum":9,"qType":"3","qText":"Câu 9: (Sở Thái Bình 2025) Một công ty trung bình bán được 900 cái máy lọc nước mỗi tháng với giá 8 triệu đồng một cái. Một cuộc khảo sát thị trường chỉ ra rằng nếu cứ giảm giá bán 100 nghìn đồng thì số lượng máy lọc nước bán ra tăng 10 cái. Biết hàm chi phí là $C(x)=2000-\\frac{9}{5}x$ (triệu đồng), với $x$ là số máy lọc nước bán ra trong tháng. Tìm lợi nhuận lớn nhất mà công ty thu được (tính theo triệu đồng).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"6836","explanation":"","hint":"Bước 1: Thiết lập hàm giá bán \\(p(x)\\) theo số lượng máy lọc nước bán ra Gọi \\[x\\] là số máy lọc nước bán ra trong tháng (\\(x > 0\\)).Cứ giảm giá \\[100\\] nghìn đồng (\\(0{,}1\\) triệu đồng) thì số lượng tăng thêm \\[10\\] cái. Do đó, mối quan hệ giữa giá bán \\(p(x)\\) (triệu đồng) và số lượng \\[x\\] được xác định qua biểu thức: \\[p(x)=8-0,1\\cdot \\frac{x-900}{10}=\\dots \\dots -0,01x\\]Bước 2: Thiết lập hàm doanh thu \\(R(x)\\) và hàm lợi nhuận \\(L(x)\\) Doanh thu của công ty thu được từ việc bán \\[x\\] máy lọc nước là:\\[R(x)=x\\cdot p(x)=\\dots \\dots \\cdot x-0,01x^{2}\\text{\\ (triệu đồng)}\\]Hàm chi phí đã cho là: \\(C(x) = 2000 - \\frac{9}{5}x = 2000 - 1{,}8x\\)Lợi nhuận của công ty thu được là: \\[L(x)=R(x)-C(x)=-0,01x^{2}+\\dots \\dots \\cdot x-2000\\text{\\ (triệu đồng)}\\]Bước 3: Tìm lợi nhuận lớn nhất bằng phương pháp đạo hàm Đạo hàm của hàm lợi nhuận:\\[L^{\\prime }(x)=-0,02x+\\dots \\dots \\]Giải phương trình \\(L'(x) = 0\\), ta tìm được số lượng máy lọc nước tối ưu:\\[-0,02x+18,8=0\\Leftrightarrow x=\\dots \\dots \\text{\\ (cái)}\\]Thay giá trị \\[x\\] vừa tìm được vào hàm \\(L(x)\\), ta nhận được mức lợi nhuận tối đa của công ty là: \\[L(\\dots \\dots )=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":10,"qType":"3","qText":"Câu 10: (THPT Yên Lạc - Vĩnh Phúc 2025) Doanh thu (Revenue) của một công ty bất động sản khi bán căn hộ thứ $n$ ($n$ nguyên dương, nhỏ hơn 200) được cho bởi hàm số $R(n)=\\frac{(n-4)(n-30)^2}{100}+36$ (triệu đồng). Trong 100 căn hộ đầu tiên được bán ra, căn hộ thứ bao nhiêu cho doanh thu thấp nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1","explanation":"","hint":"Bước 1: Tính đạo hàm của hàm số doanh thu \\(R(n)\\) Hàm số doanh thu khi bán căn hộ thứ \\[n\\] là:\\[R(n)=\\frac{(n-4)(n-30)^{2}}{100}+36\\quad (\\text{với }n\\in \\mathbb{N}^{*},1\\le n\\le 100)\\]Áp dụng quy tắc đạo hàm của tích \\((u \\cdot v)' = u'v + uv'\\), ta có đạo hàm \\(R'(n)\\): \\[R^{\\prime }(n)=\\frac{1}{100}\\left[(n-4)^{\\prime }\\cdot (n-30)^{2}+(n-4)\\cdot \\left((n-30)^{2}\\right)^{\\prime }\\right]\\]\\[R^{\\prime }(n)=\\frac{1}{100}\\left[(n-30)^{2}+(n-4)\\cdot 2(n-30)\\right]\\]\\[R^{\\prime }(n)=\\frac{n-30}{100}\\cdot \\left[(n-30)+2(n-4)\\right]=\\frac{(n-30)(\\dots \\dots )}{100}\\]Bước 2: Tìm các nghiệm và lập bảng biến thiên của hàm số trên đoạn \\([1; 100]\\) Giải phương trình \\(R'(n) = 0\\): \\[\\frac{(n-30)(3n-38)}{100}=0\\implies \\left[\\begin{aligned}&n=30\\\\ &n=\\frac{38}{3}\\approx \\dots \\dots \\end{aligned}\\right.\\]Bảng biến thiên của hàm số \\(R(n)\\) trên đoạn \\([1; 100]\\):Hàm số đồng biến trên các khoảng \\(\\left(1; \\frac{38}{3}\\right)\\) và \\((30; 100)\\).Hàm số nghịch biến trên khoảng \\(\\left(\\frac{38}{3}; 30\\right)\\). Bước 3: So sánh các giá trị cực tiểu tại các điểm biên để tìm doanh thu thấp nhất Dựa vào chiều biến thiên, hàm số đạt giá trị nhỏ nhất tại một trong hai điểm đáy của thung lũng biến thiên là \\(n = 1\\) hoặc \\(n = 30\\). Ta tiến hành tính toán và so sánh:\\[R(1)=\\frac{(1-4)(1-30)^{2}}{100}+36=\\dots \\dots \\text{\\ (triệu đồng)}\\]\\[R(30)=\\frac{(30-4)(30-30)^{2}}{100}+36=\\dots \\dots \\text{\\ (triệu đồng)}\\]So sánh hai giá trị, ta thấy \\(R(1) < R(30)\\). Do đó, doanh thu thấp nhất đạt được khi bán căn hộ thứ \\(\\dots\\dots\\) \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":11,"qType":"3","qText":"Câu 11: (Mã 0104 - BGD 2025) Nếu một doanh nghiệp sản xuất $x$ sản phẩm trong một tháng ($x ∈ \\mathbb{N}^*;1 \\le x \\le 4500$) thì doanh thu nhận được khi bán hết số sản phẩm là $F(x)=-0,01x^2+450x$ (nghìn đồng), trong khi chi phí sản xuất bình quân cho mỗi sản phẩm là $G(x)=\\frac{30000}{x}+340$ (nghìn đồng). Giả sử số sản phẩm sản xuất ra luôn được bán hết. Trong một tháng, doanh nghiệp đó cần sản xuất ít nhất bao nhiêu sản phẩm để lợi nhuận thu được lớn hơn 100 triệu đồng?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"1347","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng chi phí và hàm số lợi nhuận Tổng chi phí để sản xuất \\[x\\] sản phẩm trong một tháng là:\\[C(x)=x\\cdot G(x)=x\\cdot \\left(\\frac{30000}{x}+340\\right)=\\dots \\dots +340x\\text{\\ (nghìn đồng)}\\]Hàm số lợi nhuận \\(L(x)\\) của doanh nghiệp nhận được trong một tháng là: \\[L(x)=F(x)-C(x)=(-0,01x^{2}+450x)-(\\dots \\dots +340x)=-0,01x^{2}+\\dots \\dots x-30000\\text{\\ (nghìn đồng)}\\]Bước 2: Biến đổi điều kiện bài toán về cùng đơn vị Đổi mức lợi nhuận yêu cầu từ đơn vị triệu đồng sang nghìn đồng để đồng nhất dữ kiện:\\[100\\text{\\ triệu đồng}=\\dots \\dots \\dots \\dots \\text{\\ nghìn đồng}\\]Để lợi nhuận thu được lớn hơn 100 triệu đồng, ta có bất phương trình: \\[-0,01x^{2}+110x-30000>\\dots \\dots \\dots \\dots \\Leftrightarrow -0,01x^{2}+110x-130000>0\\]Bước 3: Giải bất phương trình và kết luận số lượng sản phẩm ít nhất Giải bất phương trình bậc hai ở Bước 2, ta được khoảng giá trị của \\[x\\]:\\[\\dots \\dots <x<\\dots \\dots \\]Vì \\(x \\in \\mathbb{N}^*\\) nên để lợi nhuận thu được lớn hơn 100 triệu đồng, doanh nghiệp đó cần sản xuất ít nhất là \\(\\ldots\\ldots\\) sản phẩm.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":12,"qType":"3","qText":"Câu 12: (Đề Tham Khảo 2025) Một doanh nghiệp dự định sản xuất không quá 500 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm ($1 \\le x \\le 500$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=x^3-1999x^2+1001000x+250000$ (đồng), trong khi chi phí sản xuất bình quân cho một sản phẩm là $G(x)=x+1000+\\frac{250000}{x}$ (đồng). Doanh nghiệp cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"333","explanation":"","hint":"Bước 1: Thiết lập hàm số tổng chi phí sản xuất \\(C(x)\\) Vì chi phí sản xuất bình quân cho một sản phẩm là \\(G(x) = x + 1000 + \\frac{250000}{x}\\), nên tổng chi phí để sản xuất \\[x\\] sản phẩm là: \\[C(x)=x\\times G(x)=x\\left(x+1000+\\frac{250000}{x}\\right)=x^{2}+\\dots \\dots \\dots x+250000\\text{\\ (đồng)}\\]Bước 2: Xác định hàm số lợi nhuận \\(P(x)\\) Lợi nhuận thu được khi bán hết \\[x\\] sản phẩm là hiệu giữa doanh thu \\(F(x)\\) và tổng chi phí \\(C(x)\\): \\[P(x)=F(x)-C(x)\\]\\[P(x)=(x^{3}-1999x^{2}+1001000x+250000)-(x^{2}+1000x+250000)\\]\\[P(x)=x^{3}-\\dots \\dots \\dots x^{2}+\\dots \\dots \\dots x\\quad (\\text{với }1\\le x\\le 500)\\]Bước 3: Tìm số lượng sản phẩm \\[x\\] để lợi nhuận lớn nhất Tính đạo hàm của hàm số lợi nhuận: \\[P^{\\prime }(x)=3x^{2}-\\dots \\dots \\dots x+1000000\\]Giải phương trình \\(P'(x) = 0\\): \\[3x^{2}-4000x+1000000=0\\Leftrightarrow \\left[\\begin{aligned}&x=1000\\quad (\\text{loại vì không thuộc }[1;500])\\\\ &x=\\frac{1000}{3}\\approx 333,33\\end{aligned}\\right.\\]Lập bảng biến thiên hoặc đánh giá dấu của \\(P'(x)\\), ta thấy hàm số \\(P(x)\\) đồng biến trên khoảng \\(\\left(1; \\frac{1000}{3}\\right)\\) và nghịch biến trên khoảng \\(\\left(\\frac{1000}{3}; 500\\right)\\). Do đó, hàm số đạt giá trị lớn nhất tại điểm \\(x = \\frac{1000}{3}\\). Vì số lượng sản phẩm \\[x\\] phải là số nguyên, ta so sánh giá trị tại hai số nguyên gần nhất xung quanh \\[\\frac{1000}{3}\\]:Với \\(x = 333\\): \\(P(333) = 148.148.037\\) đồng.Với \\(x = 334\\): \\(P(334) = 148.147.704\\) đồng. So sánh ta thấy \\(P(333) > P(334)\\), vậy doanh nghiệp cần sản xuất \\(\\ldots\\ldots\\ldots\\) sản phẩm để lợi nhuận lớn nhất. \\[\\Rightarrow \\] Đáp án cần nhập là: 333 "},{"originalNum":13,"qType":"3","qText":"Câu 13: (THPT Tiên Du - Bắc Ninh 2025) Một doanh nghiệp dự định sản xuất không quá 300 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm ($1 \\le x \\le 300$) thì doanh thu nhận được khi bán hết số sản phẩm đó là $F(x)=-2x^2+1312x$ (nghìn đồng), trong khi chi phí sản xuất bình quân cho một sản phẩm là $G(x)=x^2-77x+1000+\\frac{40000}{x}$ (nghìn đồng). Lợi nhuận thu được của doanh nghiệp (tính theo đơn vị triệu đồng) đạt giá trị lớn nhất bằng bao nhiêu (làm tròn kết quả đến hàng đơn vị).","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"38","explanation":"","hint":"Bước 1: Xác định hàm tổng chi phí sản xuất \\(C(x)\\) Vì chi phí sản xuất bình quân cho một sản phẩm là \\(G(x)\\), nên tổng chi phí sản xuất cho \\[x\\] sản phẩm (\\(1 \\leq x \\leq 300\\)) là: \\[C(x)=x\\cdot G(x)=x\\cdot \\left(x^{2}-77x+1000+\\frac{40000}{x}\\right)=x^{3}-\\dots \\dots \\cdot x^{2}+1000x+40000\\text{\\ (nghìn đồng)}\\]Bước 2: Thiết lập hàm lợi nhuận \\(L(x)\\) Lợi nhuận thu được bằng doanh thu trừ đi tổng chi phí: \\[L(x)=F(x)-C(x)=\\left(-2x^{2}+1312x\\right)-\\left(x^{3}-77x^{2}+1000x+40000\\right)\\]\\[L(x)=-x^{3}+\\dots \\dots \\cdot x^{2}+312x-40000\\text{\\ (nghìn đồng)}\\]Bước 3: Khảo sát hàm số để tìm lợi nhuận lớn nhất Đạo hàm của hàm số lợi nhuận:\\[L^{\\prime }(x)=-3x^{2}+\\dots \\dots \\cdot x+312\\]Giải phương trình \\(L'(x) = 0\\) trên đoạn \\([1; 300]\\):\\[-3x^{2}+150x+312=0\\Leftrightarrow \\left[\\begin{aligned}&x=52\\text{\\ (thỏa mãn)}\\\\ &x=-2\\text{\\ (loại)}\\end{aligned}\\right.\\]Lập bảng biến thiên của hàm số \\(L(x)\\) trên đoạn \\([1; 300]\\), ta thấy hàm số đạt giá trị lớn nhất tại \\(x = 52\\).Giá trị lợi nhuận lớn nhất tính theo đơn vị nghìn đồng là:\\[L(52)=\\dots \\dots \\text{\\ (nghìn đồng)}\\]Đổi sang đơn vị triệu đồng và làm tròn đến hàng đơn vị theo yêu cầu đề bài: \\[\\frac{\\dots \\dots }{1000}\\approx \\dots \\dots \\text{\\ (triệu đồng)}\\]\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":14,"qType":"3","qText":"Câu 14: (THPT Lê Thánh Tông - HCM 2025) Một doanh nghiệp dự định sản xuất không quá 400 sản phẩm. Nếu doanh nghiệp sản xuất $x$ sản phẩm ($1 \\le x \\le 400$) thì doanh thu nhận được khi bán hết số sản phẩm là $F(x)=x^3-1999x^2+1001000x+250000$ (đồng). Trong đó, chi phí vận hành máy móc cho mỗi sản phẩm là $G(x)=\\frac{100000x}{\\frac{3}{2}x+1}$ đồng. Tổng chi phí mua nguyên vật liệu là $H(x)=2x^3+100000x-50000$ (đồng) nhưng do doanh nghiệp mua với số lượng lớn nên được giảm 1% cho 200 sản phẩm đầu tiên doanh nghiệp sản xuất và giảm 2% cho sản phẩm tiếp theo. Doanh nghiệp cần sản xuất bao nhiêu sản phẩm để lợi nhuận thu được là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"253","explanation":"","hint":"Bước 1: Xác định tổng chi phí vận hành máy móc Chi phí vận hành máy móc cho mỗi sản phẩm là \\(G(x) = \\frac{100000x}{\\frac{3}{2}x+1}\\) (đồng).Do đó, tổng chi phí vận hành máy móc khi sản xuất \\[x\\] sản phẩm là: \\[C_{vh}(x)=x\\cdot G(x)=\\frac{\\dots \\dots \\cdot x^{2}}{\\frac{3}{2}x+1}\\text{\\ (đồng)}\\]Bước 2: Xác định tổng chi phí mua nguyên vật liệu thực tế khi số lượng lớn (\\(x > 200\\)) Khi sản xuất \\[x\\] sản phẩm (\\(x > 200\\)), chi phí nguyên vật liệu phân bổ bình quân cho mỗi sản phẩm là \\[\\frac{H(x)}{x}\\].Chi phí thực tế cho \\[200\\] sản phẩm đầu tiên sau khi giảm \\(1\\%\\) là:\\[200\\cdot \\frac{H(x)}{x}\\cdot (1-0.01)=\\frac{\\dots \\dots }{x}\\cdot H(x)\\]Chi phí thực tế cho \\((x - 200)\\) sản phẩm tiếp theo sau khi giảm \\(2\\%\\) là:\\[(x-200)\\cdot \\frac{H(x)}{x}\\cdot (1-0.02)=\\frac{0,98(x-200)}{x}\\cdot H(x)\\]Tổng chi phí mua nguyên vật liệu thực tế thu gọn lại thành: \\[C_{nvl}(x)=\\frac{198+0,98x-196}{x}\\cdot H(x)=\\left(0,98+\\frac{\\dots \\dots }{x}\\right)\\cdot H(x)\\]\\[C_{nvl}(x)=\\left(0,98+\\frac{2}{x}\\right)\\left(2x^{3}+100000x-50000\\right)=1,96x^{3}+4x^{2}+\\dots \\dots \\cdot x+48000-\\frac{100000}{x}\\]Bước 3: Lập hàm số lợi nhuận và tìm số lượng sản phẩm tối ưu Hàm số biểu diễn lợi nhuận \\(L(x)\\) bằng doanh thu trừ đi tổng các chi phí:\\[L(x)=F(x)-C_{vh}(x)-C_{nvl}(x)\\]\\[L(x)=-0,96x^{3}-2003x^{2}+\\dots \\dots \\cdot x+202000+\\frac{100000}{x}-\\frac{100000x^{2}}{\\frac{3}{2}x+1}\\]Khảo sát hàm số lợi nhuận \\(L(x)\\) trên khoảng \\((200; 400]\\) bằng cách tính đạo hàm \\(L'(x) = 0\\), ta tìm được nghiệm cực đại duy nhất tại:\\[x\\approx 253,1\\]Vì số lượng sản phẩm phải là một số nguyên dương, ta so sánh \\(L(253)\\) và \\(L(254)\\) để kết luận doanh nghiệp cần sản xuất \\(\\dots\\dots\\) sản phẩm để đạt lợi nhuận lớn nhất. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":15,"qType":"3","qText":"Câu 15: Theo thống kê tại một nhà máy $Z$, nếu áp dụng tuần làm việc 40 giờ thì mỗi tuần có 100 tổ công nhân đi làm và mỗi tổ công nhân làm được 120 sản phẩm trong một giờ. Nếu tăng thời gian làm việc thêm 2 giờ mỗi tuần thì sẽ có 1 tổ công nhân nghỉ việc và năng suất lao động giảm 5 sản phẩm/1 tổ/1 giờ. Ngoài ra, số phế phẩm mỗi tuần ước tính là $P(x)=\\frac{95x^2+120x}{4}$, với $x$ là thời gian làm việc trong một tuần. Nhà máy cần áp dụng thời gian làm việc mỗi tuần mấy giờ để số lượng sản phẩm thu được mỗi tuần là lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"36","explanation":"","hint":"Bước 1: Thiết lập các hàm số phụ thuộc vào tổng số giờ làm việc \\[x\\] Gọi \\[x\\] là tổng số giờ làm việc trong một tuần của nhà máy \\((x \\geq 0)\\). Số giờ làm tăng thêm so với quy định cũ (40 giờ) là: \\(x - 40\\) (giờ).Vì cứ tăng thêm 2 giờ thì có 1 tổ nghỉ việc, nên số tổ công nhân đi làm mỗi tuần là:\\[N(x)=100-1\\cdot \\frac{x-40}{2}=\\dots \\dots -0,5x\\text{\\ (tổ)}\\]Vì cứ tăng thêm 2 giờ thì năng suất giảm 5 sản phẩm/tổ/giờ, nên năng suất mỗi tổ trong một giờ là: \\[W(x)=120-5\\cdot \\frac{x-40}{2}=\\dots \\dots -2,5x\\text{\\ (sản phẩm/tổ/giờ)}\\]Bước 2: Xây dựng hàm số tổng lượng sản phẩm thu được \\(S(x)\\) Tổng số lượng sản phẩm làm ra (chưa trừ phế phẩm) trong một tuần là:\\[G(x)=N(x)\\cdot W(x)\\cdot x=(120-0,5x)(220-2,5x)x=1,25x^{3}-410x^{2}+\\dots \\dots \\dots \\dots x\\]Số lượng sản phẩm thực tế thu được sau khi trừ đi lượng phế phẩm \\(P(x)\\) là: \\[S(x)=G(x)-P(x)=\\left(1,25x^{3}-410x^{2}+26400x\\right)-\\frac{95x^{2}+120x}{4}\\]\\[\\Rightarrow S(x)=1,25x^{3}-\\dots \\dots \\dots \\dots x^{2}+26370x\\]Bước 3: Tìm cực trị bằng phương pháp đạo hàm để tối ưu hóa Tính đạo hàm của hàm số sản phẩm thu được \\(S(x)\\):\\[S^{\\prime }(x)=3,75x^{2}-\\dots \\dots \\dots \\dots x+26370\\]Giải phương trình đạo hàm \\(S'(x) = 0\\), ta tìm được các nghiệm:\\[\\begin{cases}x=\\dots \\dots \\text{\\ (giờ)}\\\\ x\\approx 195,3\\text{\\ (giờ)}\\end{cases}\\]Lập bảng biến thiên trên miền khảo sát, ta thấy lượng sản phẩm đạt giá trị lớn nhất khi nhà máy áp dụng thời gian làm việc \\(\\ldots\\ldots\\) giờ mỗi tuần.\\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":16,"qType":"3","qText":"Câu 16: (THPT Triệu Sơn 4 - Thanh Hóa 2025) Một xe ô tô chở khách du lịch có sức chứa tối đa là 16 hành khách. Trong một khu du lịch, một đoàn khách gồm 24 người đang đi bộ và muốn thuê xe về khách sạn. Lái xe đưa ra thỏa thuận với đoàn khách du lịch như sau: Nếu một chuyến xe chở $x$ (người) thì giá tiền cho mỗi người là $\\frac{(44-x)^2}{2}$ (nghìn đồng). Với thỏa thuận như trên thì lái xe có thể thu được nhiều nhất bao nhiêu triệu đồng từ một chuyến chở khách (làm tròn kết quả đến hàng phần trăm)?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"6.31","explanation":"","hint":"Bước 1: Xác định điều kiện của biến số \\[x\\] Gọi \\[x\\] là số hành khách được chở trong một chuyến xe (\\(x \\in \\mathbb{N}^*\\)).Vì sức chứa tối đa của xe ô tô du lịch là \\[16\\] hành khách, ta có điều kiện chặn của biến số \\[x\\] là: \\[1\\le x\\le \\dots \\dots \\dots \\]Bước 2: Thiết lập hàm số doanh thu \\(f(x)\\) từ một chuyến xe Số tiền thu được từ một chuyến chở \\[x\\] hành khách (đơn vị: nghìn đồng) là: \\[f(x)=x\\times \\frac{(44-x)^{2}}{2}=\\frac{1}{2}x(44-x)^{2}\\]Bước 3: Tìm số lượng khách \\[x\\] để doanh thu một chuyến đạt lớn nhất Xét hàm số \\(f(x) = \\frac{1}{2}x(44 - x)^2\\) trên đoạn \\([1; 16]\\). Tìm đạo hàm \\(f'(x)\\): \\[f^{\\prime }(x)=\\frac{1}{2}\\left[(44-x)^{2}+x\\cdot 2(44-x)\\cdot (-1)\\right]=\\frac{1}{2}(44-x)(\\dots \\dots \\dots -3x)\\]Giải phương trình \\(f'(x) = 0\\) trên đoạn \\([1; 16]\\): \\[\\frac{1}{2}(44-x)(44-3x)=0\\Leftrightarrow \\left[\\begin{aligned}&x=44\\quad (\\text{loại})\\\\ &x=\\frac{44}{3}\\approx 14,67\\end{aligned}\\right.\\]Vì số lượng hành khách \\[x\\] phải là số nguyên, ta so sánh giá trị doanh thu thu được tại hai số nguyên gần với giá trị \\(14,67\\) nhất là \\[14\\] và \\[15\\], đồng thời kiểm tra cả giá trị biên \\[16\\]:Với \\(x = 14\\): \\(f(14) = \\frac{1}{2} \\cdot 14 \\cdot (44 - 14)^2 = \\ldots\\ldots\\ldots \\text{ (nghìn đồng)}\\)Với \\(x = 15\\): \\(f(15) = \\frac{1}{2} \\cdot 15 \\cdot (44 - 15)^2 = \\ldots\\ldots\\ldots \\text{ (nghìn đồng)}\\)Với \\(x = 16\\): \\(f(16) = \\frac{1}{2} \\cdot 16 \\cdot (44 - 16)^2 = 6272 \\text{ (nghìn đồng)}\\) Bước 4: Tính số tiền nhiều nhất thu được theo đơn vị triệu đồng So sánh các kết quả trên, doanh thu lớn nhất đạt được khi chuyến xe chở \\[15\\] hành khách.Đổi giá trị doanh thu lớn nhất sang đơn vị triệu đồng và làm tròn đến hàng phần trăm: \\[6307,5\\text{\\ nghìn đồng}=\\dots \\dots \\dots \\text{\\ triệu đồng}\\approx \\dots \\dots \\dots \\text{\\ triệu đồng}\\]\\[\\Rightarrow \\] Đáp án cần nhập là: 6.31 "},{"originalNum":17,"qType":"3","qText":"Câu 17: (HSG Vũng Tàu 2025) Bác Bình có một nông trại ao nuôi cá, mỗi ngày thu hoạch được 2 tấn cá. Nếu bán cho thương lái với giá 30 nghìn đồng/kg thì hết cá, nếu giá bán cứ tăng thêm 2 nghìn đồng/kg thì số cá thừa sẽ tăng thêm 10 kg. Số cá thừa này được bán để làm thức ăn cho động vật với giá 10 nghìn đồng/kg. Hỏi bác Bình phải bán với giá bao nhiêu nghìn đồng/kg để số tiền bán cá mỗi ngày đạt doanh thu lớn nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"220","explanation":"","hint":"Bước 1: Thiết lập biểu thức lượng cá bán cho thương lái và lượng cá thừa Tổng khối lượng cá thu hoạch mỗi ngày là: \\(2\\text{ tấn} = 2000\\text{ kg}\\).Gọi \\[x\\] (nghìn đồng/kg) là giá bán cá cho thương lái (\\(x \\geq 30\\)).Mức giá tăng thêm so với ban đầu là: \\(x - 30\\) (nghìn đồng/kg).Vì cứ tăng giá \\[2\\] nghìn đồng/kg thì cá thừa tăng \\[10\\] kg, nên khối lượng cá thừa là:\\[m_{\\text{thừa}}=10\\cdot \\frac{x-30}{2}=\\dots \\dots \\cdot x-150\\text{\\ (kg)}\\]Khối lượng cá bán được cho thương lái là: \\[m_{\\text{bán}}=2000-(5x-150)=\\dots \\dots -5x\\text{\\ (kg)}\\]Bước 2: Thiết lập hàm tổng doanh thu \\(R(x)\\) Doanh thu từ việc bán cá cho thương lái với giá \\[x\\] là:\\[R_{1}(x)=x\\cdot (2150-5x)=2150x-5x^{2}\\text{\\ (nghìn đồng)}\\]Doanh thu từ việc bán số cá thừa làm thức ăn gia súc với giá \\[10\\] nghìn đồng/kg là:\\[R_{2}(x)=10\\cdot (5x-150)=\\dots \\dots \\cdot x-1500\\text{\\ (nghìn đồng)}\\]Hàm tổng doanh thu mỗi ngày thu được là: \\[R(x)=R_{1}(x)+R_{2}(x)=-5x^{2}+\\dots \\dots \\cdot x-1500\\text{\\ (nghìn đồng)}\\]Bước 3: Tìm giá bán \\[x\\] để đạt doanh thu lớn nhất Hàm số \\(R(x) = -5x^2 + 2200x - 1500\\) là một hàm số bậc hai với hệ số \\(a = -5 < 0\\).Hoành độ đỉnh của parabol (nơi hàm số đạt giá trị lớn nhất) được tính theo công thức:\\[x=-\\frac{b}{2a}=-\\frac{2200}{2\\cdot (-5)}=\\dots \\dots \\]Giá trị này hoàn toàn thỏa mãn điều kiện \\(x \\geq 30\\). \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\ldots\\ldots\\) "},{"originalNum":18,"qType":"3","qText":"Câu 18: (HSG Vũng Tàu 2025) Một công ty X sản xuất máy tính bảng dành cho học sinh bán được $x$ máy mỗi tháng. Giá bán của mỗi máy tính bảng được cho bởi công thức $p(x)=8600-10x$ (nghìn đồng). Chi phí để sản xuất mỗi máy tính bảng là $c(x)=x^2-4x+500+\\frac{1000}{x}$ (nghìn đồng). Hỏi công ty X sẽ bán bao nhiêu máy tính bảng mỗi tháng để lợi nhuận cao nhất?","image":null,"options":{"A":"","B":"","C":"","D":""},"correct":"50","explanation":"","hint":"Bước 1: Lập hàm số biểu diễn tổng lợi nhuận thu được mỗi tháng (\\(L(x)\\)) Do doanh nghiệp bán được \\[x\\] máy tính bảng với giá mỗi máy là \\(p(x) = 8600 - 10x\\), hàm tổng doanh thu là:\\[R(x)=x\\cdot p(x)=8600x-\\dots \\dots \\cdot x^{2}\\]Tổng chi phí để sản xuất \\[x\\] máy tính bảng là:\\[C(x)=x\\cdot c(x)=x\\cdot \\left(x^{2}-4x+500+\\frac{1000}{x}\\right)=x^{3}-4x^{2}+500x+\\dots \\dots \\]Hàm số biểu diễn tổng lợi nhuận \\(L(x)\\) bằng tổng doanh thu trừ đi tổng chi phí: \\[L(x)=R(x)-C(x)=\\left(8600x-10x^{2}\\right)-\\left(x^{3}-4x^{2}+500x+1000\\right)\\]\\[L(x)=-x^{3}-\\dots \\dots \\cdot x^{2}+8100x-1000\\quad (\\text{với }x>0)\\]Bước 2: Tìm giá trị \\[x\\] để hàm lợi nhuận đạt cực đại Tính đạo hàm của hàm số lợi nhuận \\(L(x)\\):\\[L^{\\prime }(x)=-3x^{2}-\\dots \\dots \\cdot x+8100\\]Tìm nghiệm của phương trình đạo hàm \\(L'(x) = 0\\) trên khoảng \\((0; +\\infty)\\): \\[-3x^{2}-12x+8100=0\\implies x^{2}+4x-2700=0\\implies \\left[\\begin{aligned}&x=50\\text{\\ (thỏa mãn)}\\\\ &x=-54\\text{\\ (loại)}\\end{aligned}\\right.\\]Bước 3: Lập bảng biến thiên và kết luận Khi qua điểm \\(x = 50\\), đạo hàm \\(L'(x)\\) đổi dấu từ dương sang âm, do đó hàm số đạt cực đại tại điểm này.Vậy công ty X sẽ bán \\(\\dots\\dots\\) máy tính bảng mỗi tháng để đạt được lợi nhuận cao nhất. \\[\\Rightarrow \\] Nhập đáp án đúng: \\(\\dots\\dots\\) "},{"originalNum":19,"qType":"3","qText":"Câu 19: (THPT Triệu Sơn 1-Thanh Hóa 2025) Ông $A$ dự đ
