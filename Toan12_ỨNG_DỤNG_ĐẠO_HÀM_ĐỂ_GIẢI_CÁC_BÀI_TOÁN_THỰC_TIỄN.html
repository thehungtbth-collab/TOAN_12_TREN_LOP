ots\\)\\(\\Rightarrow g'(x) = \\mathbf{-6x + 36}\\)Giải phương trình \\(g'(x) = 0\\):\\(-6x + 36 = 0 \\Leftrightarrow x = \\ldots\\ldots\\)\\(\\Leftrightarrow x = \\mathbf{6}\\) Bước 3: Lập bảng biến thiên hoặc đánh giá đỉnh Parabol Vì hàm số \\(g(x) = -3x^2 + 36x\\) là một hàm bậc hai có hệ số \\(a = -3 < 0\\), nên đồ thị là một Parabol có bề lõm quay xuống dưới.Do đó, hàm số đạt giá trị lớn nhất tại đỉnh của Parabol, tức là tại \\(x = \\mathbf{6}\\). \\[\\Rightarrow \\] Kết luận: Tốc độ truyền bệnh sẽ lớn nhất vào ngày thứ 6. Mình đã soạn xong phần hướng dẫn điền khuyết bằng LaTeX cho câu toán ứng dụng đạo hàm này. Bạn có muốn mình thay đổi cấu trúc các bước hay tạo thêm câu hỏi tương tự về ứng dụng đạo hàm vào thực tế nữa không?  Copied to clipboardFailed to copy to clipboard.  Try again later.CopiedFailed to copyCopyShare public linkThis public link shares a thread, which may include personal information. You can delete this link, but not copies made by others.Copy linkCan’t copy the link right now. Please try again later.FacebookGmailXRedditWhatsAppShareGood responseBad responseMoreExport to DocsDraft in GmailAbout this responseSaved timeClearHelpfulComprehensiveOtherIncorrectInappropriateNot workingUnhelpfulOtherA copy of this chat will be included.A copy of this chat and the content that you shared will be included.A copy of this chat and the content that you shared will be included.SubmitThanks for letting us knowGoogle may use account and system data to understand your feedback and improve our services, subject to our Privacy Policy and Terms of Service. For legal issues, make a legal removal request.Shared0 filesShow lessShow allgoogle.xsrf = google.xsrf || {};google.xsrf = {...google.xsrf,...{\"ahxKmf\":\"AF5tSO6y9bZQQ3I2h8Qkqa8gQ-T2J4d_8Q:1790234570471\"}};google.xsrf = google.xsrf || {};google.xsrf = {...google.xsrf,...{\"sYMMbb\":\"AF5tSO7pbIz3hKB_LFUHQdpLWHOtL1vJww:1790234570471\"}};You sent: 1 imageShareDownloadsn._setImageSrc('img-e9K0aoSlEKDa2roP2IrdoQI_cvwtxy_2','https:\\/\\/lens.usercontent.google.com\\/image?vsrid\\x3dCPSYmeaBu8OtqgEQARgBIhBGrhaBm9Y20wacyqCtof2gMoEBIgJiaSgGQnMKLmxmZS1kdW1teToxYzZmMGFiOS1lZTZhLTQ3ODEtOWU1MC00YjE2YjMxZDBmNTcSQQo_L2Jucy9iaS9ib3JnL2JpL2Jucy9sZW5zLWZyb250ZW5kLWFwaS9wcm9kLmxlbnMtZnJvbnRlbmQtYXBpLzUwWgQKAmJpOMjgltbZhpcDUABqCWltYWdlL3BuZw')AI Mode reply for 1 imageDưới đây là lời giải chi tiết cho Câu 11 dưới dạng hướng dẫn điền khuyết sử dụng định dạng LaTeX để bạn tham khảo: Bước 1: Lựa chọn công thức phù hợp và xác định hệ số ban đầu Vì tốc độ đánh máy của một người không thể tăng lên vô hạn theo thời gian, nên khi thời gian \\(t \\to +\\infty\\), tốc độ trung bình \\(S(t)\\) phải tiến tới một giới hạn hữu hạn. Do đó, ta loại công thức \\(S(t) = \\frac{at^2+b}{ct+d}\\) (vì giới hạn của hàm này bằng vô cực) và chọn công thức:\\[S(t)=\\frac{at^{2}+b}{ct^{2}+d}\\]Tại thời điểm bắt đầu khóa học khi chưa biết đánh máy (\\(t = 0\\)), tốc độ đánh máy trung bình bằng \\[0\\]:\\[S(0)=\\frac{b}{d}=0\\implies b=\\dots \\dots \\]\\(\\Rightarrow b = \\mathbf{0}\\)Khi đó, công thức rút gọn thành: \\(S(t) = \\frac{at^2}{ct^2+d}\\). Chia cả tử và mẫu cho \\[c\\] (với \\(c \\neq 0\\)), ta đặt lại hàm dưới dạng đơn giản: \\[S(t)=\\frac{Kt^{2}}{t^{2}+M}\\quad \\left(\\text{với }K=\\frac{a}{c},M=\\frac{d}{c}\\right)\\]Bước 2: Lập hệ phương trình để tìm các hằng số \\[K\\] và \\[M\\] Sau \\[4\\] tuần đi học, tốc độ đánh máy trung bình đạt \\[20\\] từ trên phút:\\[S(4)=\\frac{K\\cdot 4^{2}}{4^{2}+M}=20\\iff \\frac{16K}{16+M}=20\\iff 16K-20M=\\dots \\dots \\]\\(\\Rightarrow 16K - 20M = \\mathbf{320}\\) (1)Sau \\[6\\] tuần đi học, tốc độ đánh máy trung bình đạt \\[30\\] từ trên phút:\\[S(6)=\\frac{K\\cdot 6^{2}}{6^{2}+M}=30\\iff \\frac{36K}{36+M}=30\\iff 36K-30M=\\dots \\dots \\]\\(\\Rightarrow 36K - 30M = \\mathbf{1080}\\) (2)Giải hệ phương trình gồm hai phương trình (1) và (2), ta tìm được:\\[K=\\dots \\dots ,\\quad M=\\dots \\dots \\]\\(\\Rightarrow K = \\mathbf{50}, \\quad M = \\mathbf{24}\\)Như vậy, hàm số biểu diễn tốc độ đánh máy trung bình của ông A là: \\[S(t)=\\frac{50t^{2}}{t^{2}+24}\\]Bước 3: Dự đoán tốc độ đánh máy trung bình sau 15 tuần Thay \\(t = 15\\) vào hàm số vừa tìm được để tính toán:\\[S(15)=\\frac{50\\cdot 15^{2}}{15^{2}+24}=\\frac{\\dots \\dots \\dots }{249}\\approx \\dots \\dots \\text{\\ (từ/phút)}\\]\\(\\Rightarrow S(15) = \\frac{\\mathbf{11250}}{249} \\approx \\mathbf{45} \\text{ (từ/phút)}\\) \\[\\Rightarrow \\] Đáp án cần nhập: 45 Bạn có cần mình giải thích kỹ hơn ở bước loại trừ công thức dựa trên giới hạn hay muốn làm thêm một câu hỏi thực tế nào khác không?  Copied to clipboardFailed to copy to clipboard.  Try again later.CopiedFailed to copyCopyShare public linkThis public link shares a thread, which may include personal information. You can delete this link, but not copies made by others.Copy linkCan’t copy the link right now. Please try again later.FacebookGmailXRedditWhatsAppShareGood responseBad responseMoreExport to DocsDraft in GmailAbout this responseSaved timeClearHelpfulComprehensiveOtherIncorrectInappropriateNot workingUnhelpfulOtherA copy of this chat will be included.A copy of this chat and the content that you shared will be included.A copy of this chat and the content that you shared will be included.SubmitThanks for letting us knowGoogle may use account and system data to understand your feedback and improve our services, subject to our Privacy Policy and Terms of Service. For legal issues, make a legal removal request.Shared0 filesShow lessShow allgoogle.xsrf = google.xsrf || {};google.xsrf = {...google.xsrf,...{\"ahxKmf\":\"AF5tSO4McwLImjJrXIsU-D7vFqdOwIXPLg:1790235272036\"}};google.xsrf = google.xsrf || {};google.xsrf = {...google.xsrf,...{\"sYMMbb\":\"AF5tSO7VVftPXCrvvNPGrsWrMD0zXiZ48A:1790235272037\"}};You sent: 1 imageShareDownloadsn._setImageSrc('img-peC0ao2uBf2o1e8PzurA0A4_1bnsu3_2','https:\\/\\/lens.usercontent.google.com\\/image?vsrid\\x3dCMmt_fCaxP73hwEQARgBIhAgP8irOMcicruvNaJB7XZZMoEBIgJiaSgaQnMKLmxmZS         let currentStudent = { id: "", name: "" };
        let sectionStartTimes = {};

        async function handleLogin() {
            const id = document.getElementById('hs-id').value.trim();
            const pass = document.getElementById('hs-pass').value.trim();
            const msg = document.getElementById('login-msg');
            
            if(!id || !pass) return msg.innerText = "Nhập đủ ID và Mật khẩu!";
            
            try {
                if(!ENCRYPTED_USERS) {
                    msg.innerText = "Lỗi: Bài thi chưa được nhúng dữ liệu học sinh (Chưa tải từ Generator)!";
                    return;
                }
                
                // Giải mã danh sách học sinh
                const users = JSON.parse(decodeURIComponent(atob(ENCRYPTED_USERS)));
                
                // Tìm kiếm thông tin học sinh ở môi trường cục bộ (so sánh id và pass)
                const user = users.find(u => u.id == id && u.password == pass); // Đổi 'password' thành key phù hợp với Sheet của bạn
                
                if(user) {
                    currentStudent.id = id; 
                    currentStudent.name = user.name;
                    document.getElementById('login-modal').style.display = 'none';
                    
                    // --- THÊM PHẦN HỎI VÀ HIỂN THỊ TÊN Ở ĐÂY ---
                    // Hỏi xác nhận họ tên (Gợi ý sẵn tên lấy từ GG Sheet)
                    const confirmedName = prompt("Vui lòng xác nhận Họ Tên của bạn để hiển thị trên bài làm:", currentStudent.name) || currentStudent.name;
                    currentStudent.name = confirmedName; // Cập nhật lại nếu hs sửa
                    
                    // Hiển thị tên với viền RGB và Nút tải
                    document.getElementById('student-name-display').innerHTML = "Học sinh: " + currentStudent.name + " - ID: " + currentStudent.id;
                    document.getElementById('student-info-container').style.display = 'block';
                    document.getElementById('btn-download-html').style.display = 'block';
                    // -------------------------------------------

                    quizData.forEach((sec, sIdx) => sectionStartTimes[sIdx] = Date.now());
                    startHeartbeat(id);
                } else { 
                    msg.innerText = "Sai Mã học sinh hoặc Mật khẩu!"; 
                }
            } catch(e) { 
                msg.innerText = "Lỗi hệ thống khi đăng nhập!"; 
            }
        }
		
		// ==========================================
        // HỆ THỐNG TRACKING & CHỐNG GIAN LẬN

        function startHeartbeat(studentId) {
            setInterval(function() {
                const formData = new URLSearchParams();
                formData.append('action', 'ping');
                formData.append('id', studentId);
                formData.append('status', getRealStatus()); 
                fetch(GAS_URL, { method: "POST", body: formData })
                .catch(err => console.log("Lỗi ping:", err));
            }, 60000); 
        }

        window.addEventListener('beforeunload', function () {
            if (typeof currentStudent !== 'undefined' && currentStudent.id) {
                const formData = new FormData();
                formData.append('action', 'ping');
                formData.append('id', currentStudent.id);
                formData.append('status', 'Mất kết nối (Thoát trang)');
                navigator.sendBeacon(GAS_URL, formData);
            }
        });

        function getRealStatus() {
            // Tinh chỉnh riêng cho trang Toán 12: Kiểm tra trạng thái các nút nộp bài
            const submitBtns = document.querySelectorAll('.btn-submit-section');
            if (submitBtns.length === 0) return "Đang làm bài";
            
            let allSubmitted = true;
            let submittedCount = 0;
            
            submitBtns.forEach(btn => {
                if (btn.innerText !== "ĐÃ LƯU ĐIỂM") {
                    allSubmitted = false;
                } else {
                    submittedCount++;
                }
            });

            if (allSubmitted) return "Đã nộp xong tất cả (Đang xem giải thích)";
            if (submittedCount > 0) return `Đã nộp ${submittedCount}/${submitBtns.length} chuyên đề`;
            
            return "Đang làm bài";
        }

        let tabSwitchTimeout;
        let hasSentTabSwitchSignal = false; 

        document.addEventListener("visibilitychange", function() {
            if (typeof currentStudent !== 'undefined' && currentStudent.id) {
                if (document.hidden) {
                    tabSwitchTimeout = setTimeout(function() {
                        hasSentTabSwitchSignal = true; 
                        const formData = new FormData();
                        formData.append('action', 'ping');
                        formData.append('id', currentStudent.id);
                        formData.append('status', '⚠️ ĐANG LƯỚT TAB KHÁC (Quá 1 phút)!');
                        navigator.sendBeacon(GAS_URL, formData);
                    }, 60000); 
                } else {
                    clearTimeout(tabSwitchTimeout);
                    if (hasSentTabSwitchSignal) {
                        let currentStatus = getRealStatus();
                        const formData = new FormData();
                        formData.append('action', 'ping');
                        formData.append('id', currentStudent.id);
                        formData.append('status', currentStatus);
                        navigator.sendBeacon(GAS_URL, formData);
                        hasSentTabSwitchSignal = false; 
                    }
                }
            }
        });

        async function sendReportToSheet(score, total, timeSpent, testName, submitBtn) {
            submitBtn.innerText = "ĐANG GỬI DỮ LIỆU..."; submitBtn.disabled = true;
            const formData = new URLSearchParams();
            formData.append('action', 'submitReport'); formData.append('id', currentStudent.id);
            formData.append('name', currentStudent.name); formData.append('testName', testName);
            formData.append('score', score + "/" + total); formData.append('time', timeSpent + " giây");
            formData.append('details', "Đã nộp bài"); formData.append('note', 'Toán');

            try {
                await fetch(GAS_URL, { method: 'POST', body: formData });
                alert(`Lưu điểm phần "${testName}" thành công! (${score}/${total})`);
                submitBtn.innerText = "ĐÃ LƯU ĐIỂM"; submitBtn.style.background = "#27ae60";
            } catch(e) {
                alert("Lỗi khi gửi kết quả! Hãy chụp màn hình lại.");
                submitBtn.innerText = "LỖI - THỬ LẠI"; submitBtn.disabled = false;
            }
        }

        window.submitSection = function(sIdx, btnId) {
            const btn = document.getElementById(btnId);
            const sec = quizData[sIdx];
            let score = 0, totalItems = 0;
            
            sec.questions.forEach((q, qIdx) => {
                const id = sIdx + '_' + qIdx;
                if (q.qType === "1") {
                    totalItems++;
                    const selected = document.querySelector(`input[name="q${id}"]:checked`);
                    if(selected && selected.value === q.correct) score++;
                } else if (q.qType === "2") {
                    totalItems += 4;
                    ['A','B','C','D'].forEach(opt => {
                        const selected = document.querySelector(`input[name="q${id}_${opt}"]:checked`);
                        if(selected && selected.value === q.correct[opt]) score++;
                    });
                } else if (q.qType === "3") {
                    totalItems++;
                    const input = document.getElementById(`q${id}_sa`);
                    if(input) {
                        const userAns = input.value.trim().toLowerCase();
                        const correctVals = q.correct.split(';').map(v => v.trim().toLowerCase());
                        if (correctVals.includes(userAns)) score++;
                    }
                }
            });
            
            let timeSpent = sectionStartTimes[sIdx] ? Math.floor((Date.now() - sectionStartTimes[sIdx]) / 1000) : 0;
            sendReportToSheet(score, totalItems, timeSpent, sec.title, btn);
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            let html = "";

            quizData.forEach((sec, sIdx) => {
                html += `<h2 class="section-header">${sec.title}</h2>`;
                sec.questions.forEach((q, qIdx) => {
                    const id = sIdx + '_' + qIdx;
                    
                    // Chỉ giữ lại icon bóng đèn, đổi hàm onclick thành showHintModal và truyền sIdx, qIdx
                    let hintIcon = q.hint ? `<span class="hint-icon" onclick="showHintModal(${sIdx}, ${qIdx})" title="Click để xem gợi ý">💡</span>` : '';

                    html += `<div class="question-box" id="qBox_${id}">
                                <div class="q-text">
                                    ${q.qText}
                                    ${hintIcon}
                                </div>`;
                                
                    if (q.image) html += `<img src="${q.image}" style="max-width:100%; border-radius:4px; margin-bottom:15px;">`;
                    
                    // Nâng cấp HTML Type 1 & 2 với class mới
                    if (q.qType === "1") {
                        html += `<div class="options-grid">
                            <label class="option-label" id="lbl_${id}_A"><input type="radio" name="q${id}" value="A"><span class="opt-letter">A</span> ${q.options.A}</label>
                            <label class="option-label" id="lbl_${id}_B"><input type="radio" name="q${id}" value="B"><span class="opt-letter">B</span> ${q.options.B}</label>
                            <label class="option-label" id="lbl_${id}_C"><input type="radio" name="q${id}" value="C"><span class="opt-letter">C</span> ${q.options.C}</label>
                            <label class="option-label" id="lbl_${id}_D"><input type="radio" name="q${id}" value="D"><span class="opt-letter">D</span> ${q.options.D}</label>
                        </div>`;
                    } else if (q.qType === "2") {
                        html += `<table class="tf-table">
                            <tr><th>Mệnh đề</th><th width="80px">Đúng</th><th width="80px">Sai</th></tr>
                            ${['A','B','C','D'].map(opt => `
                            <tr>
                                <td><span class="opt-letter-tf">${opt}</span> ${q.options[opt]}</td>
                                <td class="tf-cell-center" id="td_${id}_${opt}_D">
                                    <label class="tf-radio-label"><input type="radio" name="q${id}_${opt}" value="Đ"><span class="tf-btn">Đ</span></label>
                                </td>
                                <td class="tf-cell-center" id="td_${id}_${opt}_S">
                                    <label class="tf-radio-label"><input type="radio" name="q${id}_${opt}" value="S"><span class="tf-btn">S</span></label>
                                </td>
                            </tr>`).join('')}
                        </table>`;
                    } else if (q.qType === "3") {
						html += `<div>
							<input type="text" id="q${id}_sa" class="sa-input" placeholder="Nhập hoặc tick chọn đáp án..." style="font-size:20px; font-weight:bold; margin-bottom:15px; text-align:center;">
							<div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width: 400px; margin: 0 auto;">
								${['1','2','3','4','5','6','7','8','9','0','-',',','.'].map(char => 
									`<button type="button" style="width:45px; height:45px; border-radius:50%; background:#fff; border:2px solid #bdc3c7; font-size:18px; font-weight:bold; color:#2c3e50; cursor:pointer;" onmouseover="this.style.background='#ecf0f1'" onmouseout="this.style.background='#fff'" onclick="document.getElementById('q${id}_sa').value += '${char}'">${char}</button>`
								).join('')}
								<button type="button" style="height:45px; padding:0 20px; border-radius:25px; background:#e74c3c; border:none; font-size:16px; font-weight:bold; color:white; cursor:pointer;" onclick="let input = document.getElementById('q${id}_sa'); input.value = input.value.slice(0, -1);">Xóa</button>
							</div>
						</div>`;
					}

                    html += `<div class="actions">
                                <button class="btn-check" onclick="checkAnswer(${sIdx}, ${qIdx})">Kiểm tra ngay</button>
                                <button class="btn-key" id="btnKey_${id}" onclick="showKey(${sIdx}, ${qIdx})">Xem Lời Giải</button>
                            </div>
                            <div class="feedback" id="feedback_${id}"></div>
                            <div class="explanation-box" id="exp_${id}">${q.explanation}</div>
                        </div>`;
                });
                const btnId = 'submitBtn_' + sIdx;
                html += `<button id="${btnId}" class="btn-submit-section" onclick="submitSection(${sIdx}, '${btnId}')">NỘP BÀI & LƯU ĐIỂM CHUYÊN ĐỀ NÀY</button><hr style="margin-top:40px;">`;
            });
            container.innerHTML = html;
        }
		
		window.showHintModal = function(sIdx, qIdx) {
            const q = quizData[sIdx].questions[qIdx];
            if (!q || !q.hint) return;
            
            const modalBody = document.getElementById('hint-modal-body');
            // Chuyển đổi dấu xuống dòng
            modalBody.innerHTML = q.hint.replace(/\n/g, '<br>');
            
            // Hiển thị pop-up
            document.getElementById('hint-modal-overlay').style.display = 'flex';
            
            // Yêu cầu MathJax render lại công thức Toán trong pop-up
            if (window.MathJax) {
                MathJax.typesetPromise([modalBody]);
            }
        };

        window.closeHintModal = function() {
            document.getElementById('hint-modal-overlay').style.display = 'none';
        };

        window.checkAnswer = function(sIdx, qIdx) {
            const id = sIdx + '_' + qIdx;
            const q = quizData[sIdx].questions[qIdx];
            const feedback = document.getElementById(`feedback_${id}`);
            document.getElementById(`btnKey_${id}`).style.display = 'inline-block';
            let isAllCorrect = true;

            if (q.qType === "1") {
                const selected = document.querySelector(`input[name="q${id}"]:checked`);
                ['A', 'B', 'C', 'D'].forEach(opt => document.getElementById(`lbl_${id}_${opt}`).className = 'option-label');
                if (!selected) { isAllCorrect = false; } 
                else if (selected.value === q.correct) { document.getElementById(`lbl_${id}_${selected.value}`).classList.add('correct'); } 
                else { document.getElementById(`lbl_${id}_${selected.value}`).classList.add('wrong'); isAllCorrect = false; }
            } 
            else if (q.qType === "2") {
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    const selected = document.querySelector(`input[name="q${id}_${opt}"]:checked`);
                    const tdD = document.getElementById(`td_${id}_${opt}_D`);
                    const tdS = document.getElementById(`td_${id}_${opt}_S`);
                    tdD.className = 'tf-cell-center'; tdS.className = 'tf-cell-center';
                    
                    if (!selected) { isAllCorrect = false; }
                    else if (selected.value === q.correct[opt]) {
                        if(selected.value === 'Đ') tdD.classList.add('tf-correct'); else tdS.classList.add('tf-correct');
                    } else {
                        if(selected.value === 'Đ') tdD.classList.add('tf-wrong'); else tdS.classList.add('tf-wrong');
                        isAllCorrect = false;
                    }
                });
            }
            else if (q.qType === "3") {
                const input = document.getElementById(`q${id}_sa`);
                const userAns = input.value.trim().toLowerCase();
                const correctVals = q.correct.split(';').map(v => v.trim().toLowerCase());
                if (!userAns) isAllCorrect = false;
                else if (correctVals.includes(userAns)) { input.style.borderColor = '#2ecc71'; input.style.backgroundColor = '#d5f5e3'; }
                else { input.style.borderColor = '#e74c3c'; input.style.backgroundColor = '#fadbd8'; isAllCorrect = false; }
            }

            feedback.innerHTML = isAllCorrect ? '<span style="color:#2ecc71">Xuất sắc! Bạn chọn đúng hết! 🎉</span>' : '<span style="color:#e74c3c">Có chỗ sai sót, hãy kiểm tra lại.</span>';
        };

        window.showKey = function(sIdx, qIdx) {
            const id = sIdx + '_' + qIdx;
            const q = quizData[sIdx].questions[qIdx];
            const exp = document.getElementById(`exp_${id}`);
            
            let correctText = "";
            if(q.qType === "1") correctText = `<strong>Đáp án đúng: ${q.correct}</strong><br><br>`;
            else if(q.qType === "2") correctText = `<strong>Key: A-${q.correct.A} | B-${q.correct.B} | C-${q.correct.C} | D-${q.correct.D}</strong><br><br>`;
            else if(q.qType === "3") correctText = `<strong>Đáp án được chấp nhận: ${q.correct}</strong><br><br>`;

            exp.innerHTML = correctText + q.explanation;
            exp.style.display = 'block';
            if (window.MathJax) MathJax.typesetPromise([exp]);
        };
		
		// ==========================================
        // HÀM LƯU BÀI LÀM ĐÃ CHẤM THÀNH FILE HTML
        // ==========================================
        window.downloadGradedHTML = function() {
            const btnDownload = document.getElementById('btn-download-html');
            btnDownload.innerText = "ĐANG TẠO FILE...";
            
            // 1. Đồng bộ trạng thái giao diện vào HTML Attributes để giữ nguyên thao tác
            document.querySelectorAll('input[type="radio"]').forEach(el => {
                if (el.checked) el.setAttribute('checked', 'checked');
                else el.removeAttribute('checked');
            });
            document.querySelectorAll('input[type="text"]').forEach(el => {
                el.setAttribute('value', el.value);
            });

            // 2. Clone toàn bộ mã nguồn hiện tại của trang
            const clone = document.documentElement.cloneNode(true);

            // 3. Xóa các thành phần không cần thiết ở bản offline
            const elementsToRemove = ['#login-modal', '#btn-download-html', '.btn-submit-section', '.btn-check'];
            elementsToRemove.forEach(selector => {
                clone.querySelectorAll(selector).forEach(el => el.remove());
            });

            // 4. Khóa toàn bộ input và button (NHƯNG giữ lại nút Xem Lời Giải)
            clone.querySelectorAll('input, button:not(.btn-key)').forEach(el => el.setAttribute('disabled', 'true'));

            // 5. XỬ LÝ LỖI "RENDER LẠI TỪ ĐẦU" (Dùng replace chuỗi để an toàn tuyệt đối, tránh lỗi regex)
            clone.querySelectorAll('script').forEach(script => {
                let code = script.innerHTML;
                code = code.replace('function renderQuiz() {', 'function renderQuiz() { return; /* Đã chặn render offline */ ');
                code = code.replace('startHeartbeat(id);', '/* Bản offline: Đã chặn heartbeat */');
                script.innerHTML = code;
            });

            // 6. Tạo file và ép trình duyệt tải xuống (Đã xóa ký tự xuống dòng)
            const htmlContent = "<!DOCTYPE html>" + clone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            // Tên file xuất ra chứa toàn bộ bài làm
            const safeName = currentStudent.name ? currentStudent.name.replace(/\s+/g, '_') : 'Khach';
            const safeId = currentStudent.id ? currentStudent.id : 'Unknown';
            a.download = `BaiLam_${safeName}_${safeId}.html`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            btnDownload.innerText = "📥 TẢI BÀI ĐÃ CHẤM";
        };

        renderQuiz();
    </script>
